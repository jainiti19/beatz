name = "beatznbox-stems"
main = "src/index.js"
compatibility_date = "2026-09-02"

# A workers.dev URL is now the INTENDED way in, and is safe in a way it was
# not before. The old Worker checked the site's basic-auth password, so it had
# to sit on the player's own hostname and a public URL really would have been
# an open door. This one checks a signed token and fails closed without one,
# so its own hostname is fine -- and that is what keeps a Worker route off
# beatznbox.wesimplyhome.com, where enabling one broke the live site twice.
workers_dev = true
preview_urls = false

# The bucket holding the audio. Private: this Worker is the only way in.
[[r2_buckets]]
binding = "STEMS"
bucket_name = "beatznbox-stems"

# The HMAC key that signs stem tokens is set with
#   wrangler secret put STEM_TOKEN_KEY
# and must match /opt/beatznbox/stem-token.key on the VPS, which is what the
# queue service signs with. A mismatch looks exactly like every token being
# forged: a uniform 401 on audio and nothing else wrong.
#
# BEATZ_PASS is no longer read by this Worker. Leaving a stale secret set does
# nothing, but it can be removed with `wrangler secret delete BEATZ_PASS`.

# NO ROUTE, deliberately, and there should never be one again. A route here
# would put this Worker in front of beatznbox.wesimplyhome.com, which is what
# broke the live site twice on 2 Sep. Token auth removes the reason a route
# was ever needed: the player can reach the workers.dev hostname above from
# any origin, because the credential travels in the URL rather than in a
# header the browser only sends to one origin.

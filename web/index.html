                // A slow phone can finish loading after the context was
                // rebuilt by the 44.1kHz fallback. Wiring a node into a dead
                // context is silence, so check we are still the live one.
                if (audioCtx !== ctx || !masterGain) return;
                tempoNode = new AudioWorkletNode(ctx, 'tempo-processor', {
                    numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [2],
                    processorOptions: { pitch: shifterRatio() }
                });
                masterGain.disconnect();
                masterGain.connect(tempoNode);
                tempoNode.connect(ctx.destination);
                tempoReady = true;
                if (pendingTempo !== null) {
                    const t = pendingTempo; pendingTempo = null;
                    setTempo(t);
                }
                renderTempo();
            }).catch((e) => {
                // Without the worklet the only way to slow a song is to drop
                // its key, which is the thing singers cannot practise against.
                // Better to offer nothing than to quietly detune the room.
                console.warn('tempo worklet unavailable, speed control hidden', e);
                tempoReady = false;
                renderTempo();
            });
        }

        /* Position within the song, in the song's own seconds. At 0.8x the wall
         * clock advances 1.25s for every second of music. */
        function songPosition() {
            if (!isPlaying) return pauseOffset;
            return (audioCtx.currentTime - startTime) * tempo;
        }

        function setTempo(t) {
            // A restored setup can ask for a speed before the worklet exists.
            // Dropping it would silently ignore what the singer saved.
            // And a later 1x replaces an earlier song's pending speed.
            if (!tempoReady) { pendingTempo = t === 1 ? null : t; return; }
            if (t === tempo) return;
            const pos = songPosition();
            tempo = t;
            if (tempoNode) tempoNode.port.postMessage({ pitch: shifterRatio() });
            if (isPlaying) {
                for (const stem of STEM_NAMES) {
                    const src = sourceNodes[stem];
                    if (src) src.playbackRate.setValueAtTime(t, audioCtx.currentTime);
                }
                startTime = audioCtx.currentTime - pos / t;
                // The fades are pinned to wall-clock times worked out at the
                // old speed. Re-place them, or a clip end lands early or late.
                scheduleClipGain();
            } else {
                pauseOffset = pos;
            }
            renderTempo();
        }

        function renderTempo() {
            const row = document.getElementById('tempoRow');
            if (!row) return;
            // Hidden rather than disabled while the worklet loads: a row of dead
            // buttons on a slow phone reads as a broken feature.
            row.style.display = tempoReady ? 'flex' : 'none';
            row.querySelectorAll('.tempo-btn').forEach((b) => {
                b.classList.toggle('active', parseFloat(b.dataset.tempo) === tempo);
            });
            renderKey();
        }

        /* What the shifter has to do: undo the slowing (1/tempo), then move to
         * the chosen key. At normal speed in the original key this is exactly
         * 1, and the worklet passes the audio through untouched. */
        function shifterRatio() {
            return Math.pow(2, keyShift / 12) / tempo;
        }

        function setKey(n) {
            n = Math.max(KEY_MIN, Math.min(KEY_MAX, Math.round(n / KEY_STEP) * KEY_STEP));
            if (n === keyShift) { renderKey(); return; }
            keyShift = n;
            // Before the worklet exists there is nothing to tell: it is built
            // from shifterRatio(), so it starts in this key.
            if (tempoNode) tempoNode.port.postMessage({ pitch: shifterRatio() });
            renderKey();
        }

        function renderKey() {
            const row = document.getElementById('keyRow');
            if (!row) return;
            // Without the worklet a key change is impossible, same as speed.
            row.style.display = tempoReady ? 'flex' : 'none';
            const v = document.getElementById('keyValue');
            v.textContent = keyShift === 0 ? 'Original'
                          : (keyShift > 0 ? '+' : '−') + Math.abs(keyShift);
            v.classList.toggle('active', keyShift !== 0);
            const [down, , up] = row.querySelectorAll('.tempo-btn');
            down.disabled = keyShift <= KEY_MIN;
            up.disabled = keyShift >= KEY_MAX;
        }

        function startPlayback() {
            if (!audioCtx || Object.keys(stems).length === 0) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            keepScreenAwake();

            for (const stem of STEM_NAMES) {
                if (!stems[stem]) continue;
                const src = audioCtx.createBufferSource();
                src.buffer = stems[stem];
                src.playbackRate.value = tempo;
                src.connect(gainNodes[stem]);
                src.start(0, pauseOffset);
                sourceNodes[stem] = src;
            }

            // pauseOffset is song time; the wall clock runs 1/tempo faster.
            startTime = audioCtx.currentTime - pauseOffset / tempo;
            isPlaying = true;
            document.getElementById('playBtn').innerHTML = '&#10074;&#10074;';
            seekInterval = setInterval(updateSeek, 200);

            // Fades are scheduled on the audio clock, not driven by a timer,
            // so they stay smooth when the tab is backgrounded and timers drop
            // to once a second.
            armClip(pauseOffset, false);
            scheduleClipGain();

            // Auto-next on end — only if song actually finished naturally
            const firstStem = STEM_NAMES.find(s => sourceNodes[s]);
            if (firstStem) {
                const expectedEndSong = currentSongIndex;
                sourceNodes[firstStem].addEventListener('ended', () => {
                    if (isPlaying && currentSongIndex === expectedEndSong) {
                        const cur = songPosition();
                        // Only auto-next if we're actually near the end
                        if (cur >= songDuration - 1) {
                            stopPlayback();
                            // Reached here because the song ended, not because
                            // anyone chose: keep playing, keep the same mix.
                            playNext({ autoplay: true, inheritMix: true });
                        }
                    }
                });
            }
        }

        function pausePlayback() {
            if (!isPlaying) return;
            pauseOffset = songPosition();
            for (const stem of STEM_NAMES) {
                try { sourceNodes[stem]?.stop(); sourceNodes[stem]?.disconnect(); } catch (e) {}
            }
            sourceNodes = {};
            isPlaying = false;
            releaseScreenAwake();
            clearClipFade();       // resuming mid-song starts at full level
            document.getElementById('playBtn').innerHTML = '&#9654;';
            clearInterval(seekInterval);
        }

        function stopPlayback() {
            if (isPlaying) {
                for (const stem of STEM_NAMES) {
                    try { sourceNodes[stem]?.stop(); sourceNodes[stem]?.disconnect(); } catch (e) {}
                }
                sourceNodes = {};
                isPlaying = false;
                releaseScreenAwake();
                clearInterval(seekInterval);
            }
            clearClipFade();
            pauseOffset = 0;
            const seekBar = document.getElementById('seekBar');
            const curTime = document.getElementById('currentTime');
            const playBtn = document.getElementById('playBtn');
            if (seekBar) seekBar.value = 0;
            if (curTime) curTime.textContent = '0:00';
            if (playBtn) playBtn.innerHTML = '&#9654;';
        }

        function seekTo(val) {
            const frac = val / 1000;
            wasPlayingBeforeSeek = isPlaying;
            if (isPlaying) {
                // Stop sources without triggering auto-next
                for (const stem of STEM_NAMES) {
                    try { sourceNodes[stem]?.stop(); sourceNodes[stem]?.disconnect(); } catch (e) {}
                }
                sourceNodes = {};
                isPlaying = false;
                clearInterval(seekInterval);
            }
            // startPlayback below re-arms from the new position: past the
            // clip's end it plays on, before the fade it fades as normal.
            clearClipFade();
            pauseOffset = frac * songDuration;
            document.getElementById('currentTime').textContent = formatTime(pauseOffset);
            userScrolledAt = 0;   // an explicit seek should snap the lyrics, grace period or not
            if (wasPlayingBeforeSeek) startPlayback();
        }

        function updateSeek() {
            if (!isPlaying || !songDuration) return;
            const cur = songPosition();
            // The clip's end. The audio is already silent by now -- the fade
            // ran on the audio clock -- so this tick only has to move on, and
            // being up to a second late in a background tab costs nothing
            // audible. Same path as a song ending on its own.
            if (clipRun && clipRun.end !== null && cur >= clipRun.end) {
                stopPlayback();
                playNext({ autoplay: true, inheritMix: true });
                return;
            }
            document.getElementById('seekBar').value = (cur / songDuration) * 1000;
            document.getElementById('currentTime').textContent = formatTime(cur);
        }

        // ===== Stem Volume =====

        function setStemVol(stem, val) {
            const v = val / 100;
            if (gainNodes[stem]) gainNodes[stem].gain.value = v;
            const volEl = document.getElementById('vol-' + stem);
            if (volEl) volEl.textContent = v === 0 ? 'OFF' : Math.round(v * 100) + '%';
        }

        // Which preset, if any, does this mix correspond to? A carried-over
        // mix usually matches one exactly, and leaving every button dark when
        // it does looks like a bug.
        function syncPresetButtons(mix) {
            const p = PRESETS;
            let match = null;
            for (const [name, vals] of Object.entries(p)) {
                if (STEM_NAMES.every(k => Number(mix[k]) === vals[k])) { match = name; break; }
            }
            currentPreset = match;
            document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
            if (match) {
                const btn = document.getElementById('pre-' + match);
                if (btn) btn.classList.add('active');
            }
        }

        function applyPreset(name) {
            const p = PRESETS[name];
            if (!p) return;
            currentPreset = name;
            for (const [stem, vol] of Object.entries(p)) {
                setStemVol(stem, vol);
                const sl = document.getElementById('sl-' + stem);
                if (sl) sl.value = vol;
            }
            document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
            const btn = document.getElementById('pre-' + name);
            if (btn) btn.classList.add('active');
        }

        // ===== Pasted lyrics =====

        // For the songs LRCLIB simply does not carry. The words go to the
        // laptop, which aligns them against this song's own audio — so the
        // paste needs no timings, just the lines in singing order.
        async function submitLyrics() {
            const btn = document.getElementById('pasteBtn');
            const note = document.getElementById('pasteNote');
            const song = songs[currentSongIndex];
            if (!song) { note.textContent = 'Pick a song first.'; return; }
            const text = document.getElementById('pasteText').value.trim();
            if (text.split('\n').filter(l => l.trim()).length < 4) {
                note.textContent = 'Needs at least 4 lines.'; return;
            }
            btn.disabled = true;
            note.textContent = 'Sending...';
            try {
                const resp = await fetch('/api/lyrics', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dir: song.dir, lyrics: text }),
                });
                const data = await resp.json().catch(() => ({}));
                if (!resp.ok) throw new Error(data.error || `HTTP ${resp.status}`);
                note.textContent = `Got ${data.lines} lines. You'll see it under Requests when timed.`;
                // The server's own clock, not this device's: the check below
                // compares it against a Last-Modified from the same server.
                addReq({ song: song.name + ' (lyrics)', title: song.name + ' (lyrics)',
                         state: 'queued', seen: true, lyricsFor: song.dir,
                         since: resp.headers.get('Date') || new Date().toUTCString() });
                document.getElementById('pasteText').value = '';
            } catch (e) {
                note.textContent = 'Could not send: ' + e.message;
            } finally {
                btn.disabled = false;
            }
        }

        // ===== Request tracking =====

        // What this browser asked for. Kept here rather than server-side so the
        // service stays anonymous - it never needs to know who anyone is.
        function myReqs() {
            let l;
            try { l = JSON.parse(localStorage.getItem('beatznbox_reqs') || '[]'); }
            catch (e) { return []; }
            // A finished request is news for a day, then it is clutter. Only
            // settled ones expire -- anything still queued stays visible however
            // long the laptop takes, because that is the case you need to see.
            const cutoff = Date.now() - 24 * 60 * 60 * 1000;
            const keep = l.filter(r => !r.at || !r.state || r.state === 'queued'
                                       || r.seen !== true || r.at > cutoff);
            if (keep.length !== l.length) {
                try { localStorage.setItem('beatznbox_reqs', JSON.stringify(keep)); }
                catch (e) {}
            }
            return keep;
        }
        function saveReqs(list) {
            try { localStorage.setItem('beatznbox_reqs', JSON.stringify(list.slice(-30))); }
            catch (e) {}
        }
        function addReq(rec) { const l = myReqs(); l.push(rec); saveReqs(l); renderBell(); }

        /* The song list and the player take turns on a phone. This only ever
         * changes which of the two is on screen -- it never changes what is
         * loaded or playing, so going back to browse does not interrupt the
         * song someone is singing to. */
        /* selectSong() returns early when the index has not changed, so a
         * retry has to forget what is loaded before asking for it again. */
        function retryCurrentSong() {
            const i = currentSongIndex;
            if (i < 0) return;
            currentSongIndex = -1;
            selectSong(i);
        }

        function toggleLibrary() {
            document.body.classList.toggle('view-library');
        }

        /* Phone Back (Iti, 24 Sep, "critical"): with a song on screen, Back
         * used to leave the site. Now the player (or the lyrics view) holds a
         * history entry, and Back returns to the song list -- the playlist
         * still picked, the song still playing. Any way of reaching the list
         * other than Back consumes that entry, so Back from the list leaves
         * as it always did. Watching the body's classes catches every route
         * between the views without touching each one. */
        const PHONE = window.matchMedia('(max-width: 820px)');
        function playerOnScreen() {
            const b = document.body.classList;
            return b.contains('big-screen') || (PHONE.matches && !b.contains('no-song') && !b.contains('view-library'));
        }
        function syncBackEntry() {
            const held = !!(history.state && history.state.beatzPlayer);
            if (playerOnScreen() && !held) history.pushState({ beatzPlayer: 1 }, '');
            else if (!playerOnScreen() && held) history.back();
        }
        window.addEventListener('popstate', () => {
            if (history.state && history.state.beatzPlayer) return;
            if (document.body.classList.contains('big-screen')) expandButton();   // lyrics -> list
            else if (playerOnScreen()) document.body.classList.add('view-library');
        });
        // A reload keeps history.state, but the page opens on the list.
        if (history.state && history.state.beatzPlayer) history.replaceState(null, '');
        new MutationObserver(syncBackEntry).observe(document.body, { attributes: true, attributeFilter: ['class'] });

        function toggleBell() {
            const p = document.getElementById('bellPanel');
            p.hidden = !p.hidden;
            if (!p.hidden) {
                // Opening the panel is the acknowledgement; the badge counts
                // only what has changed since it was last opened.
                const l = myReqs().map(r => ({ ...r, seen: true }));
                saveReqs(l);
                renderBell();
            }
        }
        function clearSeen() { saveReqs([]); renderBell(); document.getElementById('bellPanel').hidden = true; }

        function renderBell() {
            const list = myReqs().slice().reverse();
            const unseen = list.filter(r => !r.seen && r.state && r.state !== 'queued').length;
            const badge = document.getElementById('bellBadge');
            if (badge) { badge.hidden = unseen === 0; badge.textContent = unseen; }
            const el = document.getElementById('bellList');
            if (!el) return;
            if (!list.length) { el.innerHTML = '<div class="bell-empty">Nothing waiting. Songs you ask for show up here.</div>'; return; }
            el.innerHTML = list.map(r => {
                const st = r.state || 'queued';
                const label = { done: 'Ready — in the list now', queued: 'Waiting for the watcher',
                                duplicate: 'Already in the list', failed: 'Could not find it' }[st] || st;
                return `<div class="bell-item">
                    <div>${(r.title || r.song || '').replace(/</g, '&lt;')}</div>
                    <div class="st ${st}">${label}${r.note ? ' — ' + r.note.replace(/</g, '&lt;') : ''}</div>
                </div>`;
            }).join('');
        }

        /* A pasted lyric has no queue id -- it is a file drop, not a request --
         * so pollRequests() never had anything to ask about and the entry sat
         * at "queued" for ever. It misled Iti twice into thinking the watcher
         * was dead when the words were already live. There is no status
         * endpoint to add without touching the server, but there is a plain
         * fact on disk: the song's lyrics file gets rewritten when the
         * alignment lands. So compare its Last-Modified against the moment the
         * paste was accepted, both being the server's own clock. */
        async function checkPastedLyrics(list) {
            const open = list.filter(r => r.lyricsFor && (!r.state || r.state === 'queued'));
            if (!open.length) return false;
            let changed = false;
            await Promise.all(open.map(async (r) => {
                try {
                    const resp = await fetch(`${STEMS_BASE_URL}/${encodeURIComponent(r.lyricsFor)}/lyrics_timed.json`,
                                             { method: 'HEAD', cache: 'no-store' });
                    if (!resp.ok) return;
                    const lm = Date.parse(resp.headers.get('Last-Modified') || '');
                    const since = Date.parse(r.since || '');
                    if (!lm || !since || lm <= since) return;
                    r.state = 'done';
                    r.seen = false;
                    changed = true;
                } catch (e) {}
            }));
            return changed;
        }

        // Ask only about things still in flight; a finished request never changes.
        async function pollRequests() {
            const list = myReqs();
            if (await checkPastedLyrics(list)) {
                saveReqs(list); renderBell(); loadSongList();
            }
            const open = list.filter(r => r.id && (!r.state || r.state === 'queued'));
            if (!open.length) return;
            try {
                const resp = await fetch('/api/status?ids=' + open.map(r => r.id).join(','),
                                         { cache: 'no-store' });
                if (!resp.ok) return;
                const data = await resp.json();
                let changed = false;
                list.forEach(r => {
                    const s = data.status && data.status[r.id];
                    if (!s || s.state === 'queued' || s.state === 'unknown') return;
                    if (r.state !== s.state) {
                        r.state = s.state;
                        if (s.title) r.title = s.title;   // the real title, not what was typed
                        if (s.note) r.note = s.note;
                        r.seen = false;
                        changed = true;
                    }
                });
                if (changed) { saveReqs(list); renderBell(); loadSongList(); }
            } catch (e) {}
        }

        // ===== Song requests =====

        // Hands the request to the queue service and stops there. The laptop
        // picks it up on its own schedule, so the honest thing to tell the
        // person is that it is queued — not that it is coming.
        async function submitRequest() {
            const btn = document.getElementById('reqBtn');
            const note = document.getElementById('reqNote');
            const song = document.getElementById('reqSong').value.trim();
            if (!song) { note.textContent = 'Type a song name first.'; return; }
            btn.disabled = true;
            note.textContent = 'Sending...';
            try {
                const resp = await fetch('/api/request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        song,
                        detail: document.getElementById('reqDetail').value.trim(),
                        who: document.getElementById('reqWho').value.trim(),
                    }),
                });
                const data = await resp.json().catch(() => ({}));
                if (!resp.ok) {
                    // A duplicate is not an error the person caused - say what we
                    // already have and leave the box alone so they can edit it.
                    if (data.duplicate) {
                        note.textContent = data.error || 'Already in the list.';
                        addReq({ at: Date.now(), song, title: data.existing || song,
                                 state: 'duplicate', seen: false });
                        return;
                    }
                    throw new Error(data.error || `HTTP ${resp.status}`);
                }
                addReq({ id: data.id, song, title: song, state: 'queued', seen: true, at: Date.now() });
                note.textContent = `Queued. You'll see it under Requests when it's ready.`;
                document.getElementById('reqSong').value = '';
                document.getElementById('reqDetail').value = '';
            } catch (e) {
                note.textContent = 'Could not send: ' + e.message;
            } finally {
                btn.disabled = false;
            }
        }

        // ===== Up Next =====

        function updateUpNext() {
            const el = document.getElementById('upNext');
            if (!el) return;
            const nextIdx = getNextSongIndex();
            // A class, not an inline style. Inline display is what forced
            // `!important` into the stage rules three separate times; with the
            // state in a class the stage can simply restyle it.
            const on = nextIdx >= 0 && filteredSongs.length > 1;
            el.classList.toggle('is-on', on);
            if (on) document.getElementById('nextSongName').textContent = songs[nextIdx].name;
        }

        // Pull the next song's mp3s in the background so switching does not
        // pay for the download a second time. Compressed bytes only: decoded
        // PCM is ~18x larger (389MB for a 4:36 song, vs 22MB of mp3), so
        // holding two decoded songs would get a phone tab killed.
        // A phone has neither the bandwidth to spare nor the memory: another
        // 22MB in flight competes with the song being loaded, and holding it
        // alongside ~390MB of decoded audio is what tips a tab over.
        /* ===== Offline library =====
         *
         * The measurement that motivates all of this, taken on the OnePlus over
         * adb: a song already on the phone loads in ~2s, a cold one in 13-20s,
         * and 83-89% of the cold time is the download. Do Dil Mil Rahe is 32MB
         * and loaded in 2s because it was held; Yun Hi is smaller at 24MB and
         * took over 20s because it was not. So the only lever that matters on a
         * phone is whether the bytes are already there.
         *
         * Downloading is driven from here rather than the worker because only
         * the page knows which songs were picked and only the page can show
         * progress. The worker just serves what is held.
         */
        const STEM_CACHE_NAME = 'beatz-stems-v1';

        /* The way out, for a device where holding audio turns out to be the
         * problem rather than the fix. ?nocache=1 serves everything from the
         * network and empties what is held; an outside tester can be told a
         * URL, and cannot be talked through Chrome's storage settings. */
        const CACHE_OFF = new URLSearchParams(location.search).has('nocache');

        async function stemCache() {
            if (CACHE_OFF || !window.caches) return null;
            // Private windows and a browser with site data blocked both throw
            // here rather than returning null.
            try { return await caches.open(STEM_CACHE_NAME); } catch (e) { return null; }
        }

        /* Audio, read through the cache. NOT a service worker: a worker's own
         * fetches carry none of the page's basic-auth credentials, so they 401,
         * and a browser answers a 401 by re-opening its Sign in dialog. That is
         * what locked a real user out of the live site on 2 Sep. The page has
         * no such problem — the browser attaches the credentials to a fetch the
         * page makes — and caches.open() has never needed a worker.
         *
         * Playing a song also holds it. The case Iti actually hit is "a song I
         * played last week is slow again": Chrome's HTTP cache is evictable and
         * evicts, so nothing short of the Cache API survives. */
        async function cachedFetch(url, opts = {}) {
            const cache = await stemCache();
            if (cache) {
                try {
                    const hit = await cache.match(url);
                    if (hit) return hit;
                } catch (e) {}
            }
            await edgeReady;             // so the first song is not the one
                                         // measurement that quietly used the origin

            /* The origin holds every file; the edge holds what was last
             * uploaded to it. A song added since then would simply fail to
             * play, and "this one song is broken" is the hardest kind of bug
             * to hear about. So an edge that cannot serve a file is not an
             * error, it is a slower route. */
            const netUrl = toNet(url);
            let resp = null;
            try {
                resp = await fetch(netUrl, opts);
            } catch (e) {
                // A superseded prefetch aborts on purpose. That is not the
                // edge failing and must not turn into a second request.
                if (netUrl === url || (opts.signal && opts.signal.aborted)) throw e;
            }
            if (netUrl !== url && (!resp || !resp.ok)) {
                console.warn('stems: edge gave', resp ? resp.status : 'no response',
                             'for', url, '— falling back to the origin');
                resp = await fetch(url, opts);
            }
            if (cache && resp.ok) {
                // Clone BEFORE the caller reads the body, and do not await:
                // a full quota must slow nothing down and must not fail a load.
                const copy = resp.clone();
                cache.put(url, copy).catch(() => {});
            }
            return resp;
        }

        /* Lyrics go to the network first and fall back to what is held.
         * Realignment rewrites lyrics_timed.json in place and there is no rev
         * to bust it with, so a held copy must never beat the live one — but a
         * saved song with no signal still has to show its words. */
        async function netFirstCached(url) {
            try {
                const r = await fetch(url, { cache: 'no-store' });
                if (r.ok) {
                    // Hold it too. Playing a song holds its audio, and audio
                    // with no words is not a sing-along -- a song that went
                    // quiet on the train would have shown a blank pane.
                    const cache = await stemCache();
                    if (cache) cache.put(url, r.clone()).catch(() => {});
                    return r;
                }
            } catch (e) {}
            if (window.caches) {
                try {
                    const hit = await caches.match(url);
                    if (hit) return hit;
                } catch (e) {}
            }
            return new Response(null, { status: 504 });
        }
        // Which songs are held locally. Kept as a set so filterSongs() can ask
        // synchronously -- it runs on every keystroke and cannot await a cache.
        let offlineDirs = new Set();
        // dir -> how many of its stems are held, so a part-saved song can be
        // priced at what it still needs rather than at a whole song.
        let offlineStems = new Map();
        let savedOnly = false;
        const MB_PER_SONG = 22;              // measured mean across the library
        const CONFIRM_OVER = 25;             // songs, before asking twice
        const SAVE_STALL_MS = 25000;         // same rule the song loader uses
        let offlineBusy = false, offlineCancel = false, offlineArmed = false;

        /* Fetch one file for the cache, giving up if it stops arriving.
         *
         * The save loop used a plain fetch with no timeout, so one stem whose
         * body stopped yielding hung the whole download: the counter sat at
         * N/164 for ever, Stop did nothing (the loop never reached its cancel
         * check), and the only way out was reloading the page. Iti hit exactly
         * that trying to save the library on wifi before a session.
         *
         * Two things are needed, the same two selectSong() needed on 4 Sep. The
         * body has to be read HERE rather than handed to cache.put(), because
         * progress is the only thing that tells slow apart from dead and
         * cache.put() consumes the stream where we cannot watch it. And the
         * abort has to be raced explicitly -- a read that has stopped yielding
         * does not reliably reject when the signal fires. */
        async function fetchForCache(url) {
            const ctl = new AbortController();
            let lastAt = Date.now();
            const timer = setInterval(() => {
                if (Date.now() - lastAt >= SAVE_STALL_MS) {
                    ctl.abort(new Error(`nothing arrived for ${SAVE_STALL_MS / 1000}s`));
                }
            }, 2000);
            const aborted = new Promise((_, reject) => {
                if (ctl.signal.aborted) return reject(ctl.signal.reason);
                ctl.signal.addEventListener('abort',
                    () => reject(ctl.signal.reason), { once: true });
            });
            aborted.catch(() => {});      // never an unhandled rejection
            try {
                const r = await Promise.race([fetch(url, { signal: ctl.signal }), aborted]);
                if (!r.ok) throw new Error('HTTP ' + r.status);
                // A cache hit and a very old browser both land here; there is no
                // stream to watch, so the fetch timeout above is all we get.
                if (!r.body || !r.body.getReader) return r;
                const reader = r.body.getReader();
                const chunks = [];
                let got = 0;
                try {
                    for (;;) {
                        const { done, value } = await Promise.race([reader.read(), aborted]);
                        if (done) break;
                        chunks.push(value);
                        got += value.length;
                        lastAt = Date.now();
                    }
                } catch (e) {
                    try { await reader.cancel(); } catch (_) {}
                    throw e;
                }
                const body = new Uint8Array(got);
                let off = 0;
                for (const c of chunks) { body.set(c, off); off += c.length; }
                // Rebuilt, not replayed: a Response whose body has been read
                // cannot be cached. The headers come along so a cached hit still
                // says audio/mpeg and still carries its week of Cache-Control.
                return new Response(body, { status: r.status, headers: r.headers });
            } finally {
                clearInterval(timer);
            }
        }

        async function initOffline() {
            if (CACHE_OFF && window.caches) {
                await caches.delete(STEM_CACHE_NAME);
                console.warn('?nocache=1 — held audio dropped, network only');
            }
            // A worker that misbehaves is not something an outside tester could
            // clear, so ?nosw=1 is the way back out.
            if (new URLSearchParams(location.search).has('nosw')) {
                if (navigator.serviceWorker) {
                    for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
                }
                if (window.caches) for (const k of await caches.keys()) if (k.startsWith('beatz-')) await caches.delete(k);
                console.warn('service worker unregistered and caches dropped (?nosw=1)');
                return;
            }
            // Offline saving is REMOVED, not merely disabled. The worker sat in
            // front of every request, and its own fetches carry no basic-auth
            // credentials, so they 401 -- and a browser answers a 401 by
            // re-opening its Sign in dialog. Logging in worked; the worker then
            // produced another 401 and the box came back, over and over. A
            // cache for audio must never sit in the authentication path.
            //
            // sw.js is now a stub that unregisters itself, because a worker
            // already on a device keeps running until a new script replaces it.
            if (!('serviceWorker' in navigator)) return;
            try {
                const regs = await navigator.serviceWorker.getRegistrations();
                if (regs.length) {
                    // Let the stub run so it can clear the caches it made.
                    await navigator.serviceWorker.register('sw.js');
                } else if (window.caches) {
                    for (const k of await caches.keys()) {
                        // NOT the stem cache. This sweep exists to clear what the
                        // old worker left behind, and it ran on every load -- so
                        // it deleted the songs "Save offline" had just saved, and
                        // the feature silently undid itself one reload later. Iti
                        // lost 37 songs and five minutes of wifi to this.
                        if (k === STEM_CACHE_NAME) continue;
                        if (k.startsWith('beatz-')) await caches.delete(k);
                    }
                }
            } catch (e) { console.warn('could not clean up the old worker', e); }

            // Saving is back, without the worker that broke it. The row is
            // hidden in the markup so that a browser with no Cache API — or
            // one refusing it in a private window — offers nothing it cannot
            // deliver.
            const row = document.getElementById('offlineRow');
            if (row && await stemCache()) {
                row.hidden = false;
                renderOffline();
            }
        }

        /* How many of the songs currently listed are fully held. Counted from
         * the cache rather than remembered in localStorage, because the cache is
         * the only thing that actually decides whether a load hits the network. */
        async function refreshOfflineDirs() {
            if (!window.caches) return offlineDirs;
            const c = await caches.open(STEM_CACHE_NAME);
            // One sweep of the cache index, not four match() calls per song --
            // that was 440 lookups on this library every time the filter moved.
            const per = new Map();
            for (const req of await c.keys()) {
                const u = new URL(req.url);
                const m = u.pathname.match(/\/stems\/([^/]+)\/([^/]+)\.mp3$/);
                if (!m) continue;
                const dir = decodeURIComponent(m[1]);
                // A reprocessed song writes the same filename under a new rev,
                // so the copy held under the old one can never be reached
                // again. Dropped here rather than left to the quota, which
                // would evict something still wanted instead.
                const rev = revOf(dir);
                if (rev && String(rev) !== (u.searchParams.get('v') || '')) {
                    c.delete(req).catch(() => {});
                    continue;
                }
                per.set(dir, (per.get(dir) || 0) + 1);
            }
            offlineDirs = new Set([...per].filter(([, n]) => n >= STEM_NAMES.length).map(([d]) => d));
            // Kept as well as the set of whole songs: a song stopped half way
            // through still holds most of its bytes, and the estimate has to
            // say so or it reads as "download all of that again".
            offlineStems = per;
            return offlineDirs;
        }

        /* Stems still to fetch for these songs, and what that is in MB. Counting
         * whole songs said 92 songs / ~2GB when 92 songs were merely INCOMPLETE
         * -- most of their audio was already on the phone. The unit that gets
         * downloaded is a stem, so that is the unit to count. */
        function offlineRemaining(list) {
            let stems = 0;
            for (const song of list) {
                stems += Math.max(0, STEM_NAMES.length - (offlineStems.get(song.dir) || 0));
            }
            return { stems, mb: Math.round(stems * MB_PER_SONG / STEM_NAMES.length) };
        }

        // A set list is MB; the whole library is GB, and "~2024 MB" is a number
        // nobody can feel.
        function offlineSize(mb) {
            return mb >= 1024 ? `${(mb / 1024).toFixed(1)} GB` : `${mb} MB`;
        }

        async function offlineHeld(list) {
            const held = await refreshOfflineDirs();
            return list.filter((song) => held.has(song.dir)).length;
        }

        function toggleSavedOnly() {
            savedOnly = !savedOnly;
            if (savedOnly) selectedPlaylist = null;      // same either/or group
            renderPlaylistChips();
            filterSongs();
        }

        async function renderOffline() {
            const el = document.getElementById('offlineRow');
            if (!el || el.hidden) return;
            const list = filteredSongs;
            if (offlineBusy) return;                 // progress owns the row
            const held = await offlineHeld(list);
            const missing = list.length - held;
            const scope = selectedPlaylist ? `"${selectedPlaylist}"` : 'all songs';
            if (missing === 0 && list.length) {
                el.innerHTML = `<span class="offline-note">&#10003; ${held} song${held === 1 ? '' : 's'} saved for offline &mdash; ${held === 1 ? 'it loads' : 'these load'} instantly</span>`
                    + ` <button class="offline-btn" onclick="clearOffline()">Remove</button>`;
                offlineArmed = false;
                return;
            }
            // What is left to fetch, not what is left to finish: a song with
            // three of its four stems costs a quarter of a song, not a whole one.
            const { mb: est } = offlineRemaining(list);
            const size = offlineSize(est);
            const needsConfirm = missing > CONFIRM_OVER;
            const label = (needsConfirm && !offlineArmed)
                ? `Save ${scope} offline (~${size})`
                : `Save ${missing} song${missing === 1 ? '' : 's'} (~${size})`;
            // "92 already saved" next to "Save 92 songs" read as though the 92
            // had to be fetched again. Saying it as a total out of a total is
            // the thing that was actually wanted: how far along am I.
            const progress = held
                ? ` <span class="offline-note">${held} of ${list.length} saved</span>`
                : '';
            el.innerHTML = `<button class="offline-btn${offlineArmed ? ' armed' : ''}" onclick="saveOffline()">`
                + (offlineArmed ? `Tap again to download ~${size}` : label) + `</button>`
                + progress;
        }

        async function saveOffline() {
            if (offlineBusy) { offlineCancel = true; return; }
            const list = filteredSongs.slice();
            const held = await offlineHeld(list);
            // Two taps rather than a native confirm(): a blocking dialog is the
            // thing the phone critique already called out.
            if ((list.length - held) > CONFIRM_OVER && !offlineArmed) {
                offlineArmed = true; renderOffline(); return;
            }
            offlineArmed = false; offlineBusy = true; offlineCancel = false;
            // A set list is ~20 songs and several hundred MB, the whole library
            // 3.6GB, fetched one stem at a time. The screen used to sleep well
            // before that finished, and a backgrounded tab is throttled to a
            // crawl -- so a save left alone to run never got there. The lock was
            // only ever taken for playback; saving needs it just as much.
            keepScreenAwake();
            // Without this Chrome treats the whole library as evictable, which is
            // exactly what it was already doing mid-session.
            let persisted = false;
            try { persisted = await navigator.storage.persist(); } catch (e) {}
            const el = document.getElementById('offlineRow');
            const c = await caches.open(STEM_CACHE_NAME);
            let done = 0, failed = 0;
            const paint = (n) => {
                el.innerHTML = `<span class="offline-note">Downloading ${n}/${list.length}&hellip;</span>`
                    + ` <button class="offline-btn" onclick="saveOffline()">Stop</button>`;
            };
            paint(0);
            for (const song of list) {
                if (offlineCancel) break;
                try {
                    for (const stem of STEM_NAMES) {
                        const u = audioUrl(song.dir, stem);
                        if (await c.match(u)) continue;
                        await c.put(u, await fetchForCache(u));
                        // Checked between stems as well as between songs: a song
                        // is ~22MB, so waiting for the whole four made Stop feel
                        // broken on a slow connection.
                        if (offlineCancel) break;
                    }
                    // Lyrics are tiny and useless to omit -- a saved song that
                    // cannot show its words is not saved for a sing-along.
                    for (const f of ['lyrics_timed.json', 'lyrics.txt']) {
                        const u = stemUrl(song.dir, f);
                        if (!(await c.match(u))) {
                            try { await c.put(u, await fetchForCache(u)); } catch (e) {}
                        }
                    }
                } catch (e) {
                    failed++;
                    console.warn('offline save failed for', song.dir, e);
                }
                done++;
                paint(done);
            }
            offlineBusy = false;
            // Playback may have been running throughout, and it wants the lock
            // for itself -- only the save's own claim goes back.
            if (!isPlaying) releaseScreenAwake();
            await refreshOfflineDirs();
            renderPlaylistChips();
            if (failed) {
                el.innerHTML = `<span class="offline-note">Saved with ${failed} failure${failed === 1 ? '' : 's'}
                    &mdash; tap to retry the rest</span> <button class="offline-btn" onclick="saveOffline()">Retry</button>`;
                return;
            }
            if (!persisted) {
                console.warn('storage.persist() refused; the browser may still evict these');
            }
            renderOffline();
        }

        async function clearOffline() {
            if (!window.caches) return;
            await caches.delete(STEM_CACHE_NAME);
            await refreshOfflineDirs();
            // Nothing is saved any more, so a Saved filter would show an empty
            // list with no way back to the songs.
            savedOnly = false;
            renderPlaylistChips();
            filterSongs();
            renderOffline();
        }

        function shouldPrefetch() {
            if (window.matchMedia('(max-width: 820px)').matches) return false;
            const c = navigator.connection;
            if (c && (c.saveData || /2g|slow-2g/.test(c.effectiveType || ''))) return false;
            return true;
        }

        async function prefetchNext() {
            if (!shouldPrefetch()) return;
            const nextIdx = getNextSongIndex();
            if (nextIdx < 0) return;
            const dir = songs[nextIdx].dir;
            if (prefetched.dir === dir) return;
            if (prefetched.ctrl) prefetched.ctrl.abort();
            const ctrl = new AbortController();
            const bytes = {};
            prefetched = { dir, bytes, ctrl };
            try {
                await Promise.all(STEM_NAMES.map(async (stem) => {
                    const resp = await cachedFetch(audioUrl(dir, stem),
                                                   { signal: ctrl.signal });
                    bytes[stem] = await resp.arrayBuffer();
                }));
            } catch (e) {
                // Superseded by a newer pick, or the network went away. Either
                // way selectSong just fetches on demand, so drop the partial.
                if (prefetched.ctrl === ctrl) {
                    prefetched = { dir: null, bytes: null, ctrl: null };
                }
            }
        }

        function getNextSongIndex() {
            if (currentSongIndex < 0) return -1;
            const currentInFiltered = filteredSongs.indexOf(songs[currentSongIndex]);
            if (currentInFiltered < 0) return -1;
            const nextFiltered = (currentInFiltered + 1) % filteredSongs.length;
            return songs.indexOf(filteredSongs[nextFiltered]);
        }

        function playNext(opts = {}) {
            const nextIdx = getNextSongIndex();
            if (nextIdx >= 0) selectSong(nextIdx, opts);
        }

        // ===== Session Presets =====

        function saveSetup() {
            if (currentSongIndex < 0) return;
            const song = songs[currentSongIndex];
            const tag = prompt('Tag name (e.g. Chorus, Hook):') || '';
            const key = (selectedPlaylist || 'all') + '::' + song.dir;
            const seekBar = document.getElementById('seekBar');
            const setup = {
                position: seekBar ? seekBar.value / 1000 : 0,
                volumes: {},
                preset: currentPreset,
                tempo: tempo,
                key: keyShift,
                tag: tag
            };
            for (const stem of STEM_NAMES) {
                const sl = document.getElementById('sl-' + stem);
                setup.volumes[stem] = sl ? parseInt(sl.value) : 80;
            }
            setup.saved = Date.now();
            if (!isAdmin()) {
                // A viewer's setup is for their own practice: kept on this
                // device, never sent, and labelled so. The shared map is not
                // touched, so the hosts' setup for this song survives intact.
                keepSetupHere(key, setup);
                return;
            }
            sessionPresets[key] = setup;
            storePresetsLocally();
            showPresetIndicator(tag);
            pushSetup(key, setup);
        }

        /* Keep a setup as this device's own (see mySetups). Called when a
         * viewer saves, and when the server refuses a save the page thought
         * was an admin's -- in that case the shared map already holds the
         * refused setup, so it comes out; the next load from the server puts
         * back whatever the hosts had saved there. */
        function keepSetupHere(key, setup) {
            mySetups[key] = Object.assign({}, setup, { local: true });
            storeMine();
            if (sessionPresets[key] === setup) {
                delete sessionPresets[key];
                storePresetsLocally();
            }
            showPresetIndicator(setup.tag, true);
        }

        function clearSetup() {
            if (currentSongIndex < 0) return;
            const song = songs[currentSongIndex];
            // Which copies go: see clearsKey.
            if (!isAdmin()) {
                // A viewer clears only what is theirs. If the hosts saved a
                // setup for this song, say so -- it still applies next load.
                for (const key of Object.keys(mySetups)) {
                    if (clearsKey(key, song.dir)) delete mySetups[key];
                }
                storeMine();
            } else {
                for (const key of Object.keys(sessionPresets)) {
                    if (clearsKey(key, song.dir)) {
                        delete sessionPresets[key];
                        pushSetup(key, null);
                    }
                }
                storePresetsLocally();
            }
            // In a playlist the song's default (saved from All) can still
            // apply; say so rather than showing nothing.
            const left = setupFor(song.dir);
            if (left) { showPresetIndicator(left.tag, !!left.local, left); return; }
            document.getElementById('presetIndicator').textContent = '';
            document.getElementById('clearSetupBtn').style.display = 'none';
        }

        /* A song's setup. Iti's call on 24 Sep, replacing the 14 Sep one (a
         * setup belongs to the song, wherever saved): with a playlist picked,
         * the setup saved in THAT playlist, so the same song can run at 80% in
         * one set and full speed in another. Failing that, the one saved from
         * All -- the song's default -- but never another playlist's. From All,
         * the newest from anywhere, as before. Keys: "<playlist|all>::<dir>". */
        function setupFor(dir, sharedOnly) {
            // A viewer's own practice setup wins over the shared one on their
            // device -- it is the one they just chose. Never for an admin.
            if (!isAdmin() && !sharedOnly) {
                const mine = pickSetup(mySetups, dir);
                if (mine) return mine;
            }
            return pickSetup(sessionPresets, dir);
        }

        function pickSetup(map, dir) {
            if (selectedPlaylist) {
                return map[selectedPlaylist + '::' + dir] || map['all::' + dir] || null;
            }
            let best = null;
            for (const [key, s] of Object.entries(map)) {
                if (!key.endsWith('::' + dir)) continue;
                if (!best || (s.saved || 0) > (best.saved || 0)) best = s;
            }
            return best;
        }

        /* The keys Clear removes: in a playlist, only that playlist's setup
         * (the song's default and other sets keep theirs); from All, every
         * copy, or the newest-wins lookup would bring the next one back. */
        function clearsKey(key, dir) {
            return selectedPlaylist ? key === selectedPlaylist + '::' + dir
                                    : key.endsWith('::' + dir);
        }

        function storePresetsLocally() {
            try { localStorage.setItem('beatznbox_presets', JSON.stringify(sessionPresets)); } catch (e) {}
        }

        async function pushSetup(key, setup, migrating) {
            try {
                const r = await fetch('/api/presets', { method: 'POST', credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key, setup }) });
                // A 400 is a setup the server will never accept; retrying it on
                // every page load would only stall the migration forever.
                if (r.status === 400) { console.warn('setup refused by the server', key); return true; }
                if (r.status === 403) {
                    // A viewer login: keep it on this device instead, and say
                    // so where "Setup saved" would have appeared.
                    // Not for the one-off migration of old browser-only
                    // setups: those predate the 22 Sep wipe and should not
                    // come back, even on one device.
                    readOnlyRefused('setup');
                    if (setup && !migrating) keepSetupHere(key, setup);
                    return false;
                }
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return true;
            } catch (e) {
                console.warn('setup kept on this device only', e);
                return false;
            }
        }

        async function loadPresets() {
            let server;
            try {
                const r = await fetch('/api/presets', { cache: 'no-store', credentials: 'include' });
                if (!r.ok) return;
                server = (await r.json()).presets || {};
            } catch (e) {
                console.warn('setups: using the local copy', e);
                return;
            }
            // Setups saved before the server held them exist only in this
            // browser. Send them up once; after that the server is the record,
            // or a setup cleared elsewhere would be resurrected by every device
            // still holding an old copy.
            let migrated = false;
            try { migrated = localStorage.getItem('beatznbox_presets_migrated') === '1'; } catch (e) {}
            // Viewers never send setups up: the server would refuse them, and
            // the shared set was wiped clean on purpose on 22 Sep. Whatever
            // this browser still holds from before is replaced below by the
            // server's copy, as on any device that has already migrated.
            if (!migrated && isAdmin()) {
                const pending = Object.entries(sessionPresets).filter(([k]) => !(k in server));
                const sent = await Promise.all(pending.map(([k, s]) => pushSetup(k, s, true)));
                if (sent.every(Boolean)) {
                    pending.forEach(([k, s]) => { server[k] = s; });
                    try { localStorage.setItem('beatznbox_presets_migrated', '1'); } catch (e) {}
                } else if (isAdmin()) {
                    return;   // try again next load rather than drop them
                }
                // else: refused as a viewer (the role flipped mid-way): take
                // the server's copy below, like any other viewer.
            }
            sessionPresets = server;
            storePresetsLocally();
            renderPlaylistMode();
        }

        function restoreSetup(preset) {
            if (preset.volumes) {
                for (const [stem, vol] of Object.entries(preset.volumes)) {
                    setStemVol(stem, vol);
                    const sl = document.getElementById('sl-' + stem);
                    if (sl) sl.value = vol;
                }
            }
            if (preset.tempo) setTempo(preset.tempo);
            setKey(preset.key || 0);
            if (preset.position > 0) {
                pauseOffset = preset.position * songDuration;
                const seekBar = document.getElementById('seekBar');
                if (seekBar) seekBar.value = preset.position * 1000;
                document.getElementById('currentTime').textContent = formatTime(pauseOffset);
            }
            if (preset.preset) {
                currentPreset = preset.preset;
                document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
                const btn = document.getElementById('pre-' + preset.preset);
                if (btn) btn.classList.add('active');
            }
            showPresetIndicator(preset.tag, !!preset.local, preset);
        }

        /* `here`: the setup lives only on this device (a viewer's own). The
         * words say so, because "Setup saved" alone reads as saved for the
         * room. Clear is offered for an admin, or for a viewer's own setup --
         * never a viewer's view of a shared one, which is not theirs to clear. */
        function showPresetIndicator(tag, here, setup) {
            const el = document.getElementById('presetIndicator');
            // In a playlist with nothing saved there, the song's default from
            // All is what applies. Clear here would not touch it, so no Clear;
            // Save Setup makes one for this playlist.
            const song = songs[currentSongIndex];
            const fromAll = !!(setup && selectedPlaylist && song)
                && (setup === sessionPresets['all::' + song.dir] || setup === mySetups['all::' + song.dir]);
            const what = fromAll ? 'Song setup (from All)'
                       : here ? 'Saved on this device only' : 'Setup saved';
            if (el) el.textContent = tag ? `${what}: "${tag}"` : what;
            const clearBtn = document.getElementById('clearSetupBtn');
            if (clearBtn) clearBtn.style.display = !fromAll && (isAdmin() || here) ? 'inline-block' : 'none';
        }

        // ===== Playlist clips =====

        function clipKey(dir) {
            return selectedPlaylist ? selectedPlaylist + '::' + dir : null;
        }

        /* This song's clip in the playlist being played, or null. Only ever
         * with a playlist picked: from All, or a search, every song plays
         * whole -- which is how Bheegi Bheegi trimmed for Friday's set stays
         * full length everywhere else. */
        function clipFor(dir) {
            const key = dir ? clipKey(dir) : null;
            // A viewer's own clip (only ever from a refused save, see
            // pushClip) plays on their device in place of the shared one.
            const mine = key && !isAdmin() ? myClips[key] : null;
            const c = mine || (key ? clips[key] : null);
            return c && typeof c.start === 'number' ? c : null;
        }

        /* Put the playhead on the clip's start, if this song has one here.
         * Used on load and by the Stop button, so Stop-then-Play replays the
         * way the song comes in -- which is what Karan is tuning by ear. */
        function cueClipStart() {
            const clip = clipFor(currentSongDir);
            if (!clip || !songDuration || isPlaying) return;
            // A start past the end of the audio is a clip set against a
            // different recording of the song. Play it from the top.
            if (clip.start >= songDuration - 1) return;
            pauseOffset = clip.start;
            const seekBar = document.getElementById('seekBar');
            if (seekBar) seekBar.value = (pauseOffset / songDuration) * 1000;
            const t = document.getElementById('currentTime');
            if (t) t.textContent = formatTime(pauseOffset);
        }

        /* Decide what this play of the song's clip does, from position `pos`.
         *
         * Fresh (a play press, a seek, the next song starting): fade in only if
         * we are starting AT the clip start -- resuming after a pause mid-verse
         * comes back at full level -- and arm the end only if it is still ahead.
         *
         * midPlay (Set start / Set end / Clear, or picking the playlist while
         * the song runs): nothing jumps. A new end is armed only with a full
         * fade still to go, so pressing "Set end" does not cut the song off
         * under the finger that pressed it; it takes effect next time through. */
        function armClip(pos, midPlay) {
            const prev = clipRun;
            clipRun = null;
            const fades = playlistFades();
            // With fades on, a song with no clip is a clip of the whole song.
            const clip = clipFor(currentSongDir) || (fades ? { start: 0, end: null } : null);
            if (!clip) return;
            const fadeIn = fades && (midPlay
                ? !!(prev && prev.fadeIn && prev.start === clip.start)
                : (clip.start > 0 || CLIP_FADE_IN_FROM_ZERO) && Math.abs(pos - clip.start) < 0.25);
            let end = null;
            if (clip.end !== null && clip.end !== undefined) {
                const kept = prev && prev.end === clip.end;
                if (pos < clip.end - (midPlay && !kept && fades ? CLIP_FADE : 0)) end = clip.end;
            }
            // Out into the clip's end, or the song's own when there is none. A
            // clip end already passed plays on at full level, as before.
            const fadeOut = fades && (end !== null || clip.end === null || clip.end === undefined);
            if (fadeIn || end !== null || fadeOut) clipRun = { start: clip.start, end, fadeIn, fadeOut };
        }

        /* The gain curve from `pos` onward, as [songSeconds, gain] points to
         * ramp between linearly. Pure, so it can be checked without audio.
         * The curve is piecewise linear with corners only at these points, so
         * ramping straight between them is exact. A clip shorter than two
         * fades shares its length between them rather than overlapping. */
        function clipEnvelope(run, pos, duration) {
            const stop = run.end !== null ? run.end : duration;
            const fade = Math.max(0.01, Math.min(CLIP_FADE, (stop - run.start) / 2));
            // Fades off: a clip end still cuts -- over 50ms, not a click, and
            // on the audio clock rather than up to a second late on the timer.
            const out = run.fadeOut ? fade : (run.end !== null ? 0.05 : 0);
            const gain = (s) => {
                let g = 1;
                if (run.fadeIn) g = Math.min(g, (s - run.start) / fade);
                if (out) g = Math.min(g, (stop - s) / out);
                return Math.max(0, Math.min(1, g));
            };
            const marks = [pos];
            if (run.fadeIn) marks.push(run.start + fade);
            if (out) marks.push(stop - out, stop);
            return [...new Set(marks.filter(s => s >= pos))]
                .sort((a, b) => a - b).map(s => [s, gain(s)]);
        }

        /* Lay the curve onto masterGain, on the audio clock. Song seconds
         * become wall seconds through startTime and tempo, exactly as
         * songPosition() reads them back. Everything already scheduled is
         * dropped first, so calling this again (tempo change, clip edit) is
         * always safe. */
        function scheduleClipGain() {
            if (!masterGain || !audioCtx) return;
            const g = masterGain.gain, now = audioCtx.currentTime;
            g.cancelScheduledValues(0);
            if (!clipRun || !isPlaying) { g.setValueAtTime(1, now); return; }
            const env = clipEnvelope(clipRun, songPosition(), songDuration);
            g.setValueAtTime(env[0][1], now);
            for (const [s, v] of env.slice(1)) {
                g.linearRampToValueAtTime(v, Math.max(now, startTime + s / tempo));
            }
        }

        /* Pause, stop and seek all end with the gain back at 1. Left mid-ramp,
         * the next song -- which may have no clip at all -- would start
         * silent, and nothing on screen would say why. */
        function clearClipFade() {
            clipRun = null;
            if (!masterGain || !audioCtx) return;
            masterGain.gain.cancelScheduledValues(0);
            masterGain.gain.setValueAtTime(1, audioCtx.currentTime);
        }

        /* "Set start" / "Set end": the current position, like Save Setup takes
         * the current mix. Rough is fine -- Karan tunes these by ear, and
         * pressing again just moves the point. */
        function setClipPoint(which) {
            // Hidden from viewers; this catches a tap before whoami answers.
            if (!isAdmin()) return;
            if (!selectedPlaylist || currentSongIndex < 0 || !songDuration) return;
            const key = clipKey(currentSongDir);
            const pos = Math.round(songPosition() * 10) / 10;
            const cur = clipFor(currentSongDir) || { start: 0, end: null };
            const next = { start: cur.start, end: cur.end === undefined ? null : cur.end };
            next[which] = pos;
            // Refused, not quietly fixed: dropping the old end to make room
            // for a later start would lose a timing someone set on purpose.
            if (next.end !== null && next.end <= next.start) {
                renderClip(which === 'end'
                    ? `End must come after the start (${formatTime(next.start)})`
                    : `Start must come before the end (${formatTime(next.end)})`);
                return;
            }
            clips[key] = next;
            storeClipsLocally();
            pushClip(key, next);
            if (isPlaying) { armClip(songPosition(), true); scheduleClipGain(); }
            renderClip();
        }

        function clearClip() {
            const key = clipKey(currentSongDir);
            if (!isAdmin()) {
                // A viewer can only drop their own device's clip.
                if (key && myClips[key]) { delete myClips[key]; storeMine(); renderClip(); }
                return;
            }
            if (!key || !clips[key]) return;
            delete clips[key];
            storeClipsLocally();
            pushClip(key, null);
            if (isPlaying) { armClip(songPosition(), true); scheduleClipGain(); }
            renderClip();
        }

        function renderClip(note) {
            const row = document.getElementById('clipRow');
            if (!row) return;
            row.style.display = selectedPlaylist ? 'flex' : 'none';
            const out = document.getElementById('clipSummary');
            if (!out || !selectedPlaylist) return;
            if (note) { out.textContent = note; return; }
            const clip = clipFor(currentSongDir);
            const key = clipKey(currentSongDir);
            const here = !isAdmin() && key && myClips[key] === clip;
            out.title = `Only in "${selectedPlaylist}" — elsewhere the song plays whole`;
            // A viewer's own clip says so, and keeps a Clear (it is theirs);
            // a viewer sees the hosts' clips as times alone, no Clear.
            out.innerHTML = clip
                ? `${formatTime(clip.start)} &rarr; ${clip.end !== null ? formatTime(clip.end) : 'end'}`
                  + (here
                      ? ` &middot; on this device only &middot; <button class="clip-mine-clear" onclick="clearClip()">Clear</button>`
                      : isAdmin()
                      ? ` &middot; <button class="clip-clear" onclick="clearClip()">Clear</button>`
                      : '')
                : 'Whole song';
        }

        function storeClipsLocally() {
            try { localStorage.setItem('beatznbox_clips', JSON.stringify(clips)); } catch (e) {}
        }

        async function pushClip(key, clip) {
            try {
                const r = await fetch('/api/clips', { method: 'POST', credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key, clip }) });
                if (r.status === 403) {
                    // A viewer login the page took for an admin. A set point
                    // is kept as this device's own clip, labelled so; a
                    // Clear is simply undone. Either way the shared clips come
                    // back from the server, untouched.
                    readOnlyRefused('clip');
                    if (clip) { myClips[key] = clip; storeMine(); }
                    await loadClips();
                    renderClip(clip ? undefined : 'Clips are set by the hosts, so that was not cleared.');
                    return;
                }
                if (!r.ok) throw new Error('HTTP ' + r.status);
            } catch (e) {
                console.warn('clip kept on this device only', e);
            }
        }

        // Once per page load, like setups and playlists -- never polled, for
        // the reason given at the bottom of this script (a stray 401 reopens
        // the Sign in box, and a poll turns that into a loop).
        async function loadClips() {
            try {
                const r = await fetch('/api/clips', { cache: 'no-store', credentials: 'include' });
                if (!r.ok) return;
                clips = (await r.json()).clips || {};
                storeClipsLocally();
                renderClip();
            } catch (e) {
                // Offline at the venue: the local copy already loaded above
                // still runs the set.
                console.warn('clips: using the local copy', e);
            }
        }

        // ===== Helpers =====

        function toggleSection(name) {
            const el = document.getElementById(name + 'Section');
            const arrow = document.getElementById(name + 'Arrow');
            if (el) {
                el.style.display = el.style.display === 'none' ? 'block' : 'none';
                if (arrow) arrow.innerHTML = el.style.display === 'none' ? '&#9660;' : '&#9650;';
            }
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return m + ':' + (s < 10 ? '0' : '') + s;
        }

        // Init
        loadSongList();
        loadPlaylists();
        // Setups wait for whoami: whether this browser may send up its old
        // setups (the one-off migration) depends on the login. Nothing else
        // waits -- playlists, clips and playback load as before.
        loadWhoami().then(loadPresets);
        loadClips();
        initOffline();
        renderBell();
        pollRequests();
        setInterval(pollRequests, 20000);

        // 2 minutes: the manifest is ~8KB and no-cache, and a song takes
        // minutes to process, so anything tighter is just noise.
        setInterval(() => refreshSongList({ quiet: false }), 120000);

        // NO periodic playlist poll. The site is behind basic auth, and any
        // request that reaches the server without credentials returns 401 --
        // which a browser answers by re-opening its Sign in dialog. A one-off
        // failure is one stray prompt; polling it every two minutes turns that
        // into an endless loop of prompts, which is exactly what locked a user
        // out. Playlists load once per page load; a reload picks up anyone
        // else's changes, which is often enough for a set built before a jam.

        // Track genuine user scrolling only. A 'scroll' listener would also fire
        // for our own smooth scrolling and permanently suppress auto-scroll.
        (function trackManualLyricsScroll() {
            const lc = document.getElementById('lyricsContent');
            if (!lc) return;
            const mark = () => { userScrolledAt = Date.now(); };
            lc.addEventListener('wheel', mark, { passive: true });
            lc.addEventListener('touchmove', mark, { passive: true });
        })();
    </script>
</body>
</html>

            // Only offered once something is actually saved, or it reads as a
            // filter that always empties the list.

            el.innerHTML = html;
            renderPlaylistMode();
        }

        // ===== Playlist mode =====
        // Iti, 24 Sep: the mode (Karaoke, Jamming...) is set for a whole
        // playlist, and a song only differs where a setup was saved for it IN
        // that playlist. Kept with the setups under "<playlist>::*" -- no song
        // dir is "*" -- so it needs nothing new from the server.
        const MODE_NAMES = { singalong: 'Sing along', karaoke: 'Karaoke', unplugged: 'Unplugged', jamming: 'Jamming' };

        function playlistMode(name = selectedPlaylist) {
            const s = name ? sessionPresets[name + '::*'] : null;
            return s && PRESETS[s.preset] ? s.preset : null;
        }

        /* Fades (Iti, 24 Sep): with a playlist picked, every song fades in
         * over CLIP_FADE seconds and out over the CLIP_FADE before its end --
         * the clip's end if it has one, the song's own otherwise. On unless
         * turned off. Off rides in the same "::*" record as tag "nofade": the
         * server keeps only the setup fields it knows, and tag is free text,
         * so this needs no server change (that takes root to restart). */
        function playlistFades(name = selectedPlaylist) {
            if (!name) return false;
            const s = sessionPresets[name + '::*'];
            return !(s && s.tag === 'nofade');
        }

        function renderPlaylistMode() {
            const el = document.getElementById('playlistMode');
            if (!el) return;
            el.hidden = !selectedPlaylist;
            if (el.hidden) return;
            const mode = playlistMode(), fades = playlistFades();
            // Viewers see the set's settings but cannot change them.
            if (!isAdmin()) {
                el.textContent = `Mode: ${mode ? MODE_NAMES[mode] : 'per song'} · Fades ${fades ? 'on' : 'off'}`;
                return;
            }
            el.innerHTML = `<label for="plModeSel">Mode</label>
                <select id="plModeSel" onchange="setPlaylistSettings(this.value, playlistFades())">
                    <option value="">Per song</option>
                    ${Object.entries(MODE_NAMES).map(([k, t]) =>
                        `<option value="${k}" ${k === mode ? 'selected' : ''}>${t}</option>`).join('')}
                </select>
                <button class="pl-fade${fades ? ' on' : ''}" aria-pressed="${fades}"
                        title="Fade each song in and out over ${CLIP_FADE}s"
                        onclick="setPlaylistSettings(playlistMode(), !playlistFades())">Fades ${fades ? 'on' : 'off'}</button>`;
        }

        function setPlaylistSettings(mode, fades) {
            if (!isAdmin() || !selectedPlaylist) return;
            const key = selectedPlaylist + '::*';
            mode = mode && PRESETS[mode] ? mode : null;
            const modeChanged = mode !== playlistMode();
            if (mode || !fades) {
                const setup = { preset: mode || '', volumes: mode ? Object.assign({}, PRESETS[mode]) : {},
                                tag: fades ? '' : 'nofade', saved: Date.now() };
                sessionPresets[key] = setup;
                pushSetup(key, setup);
            } else {
                delete sessionPresets[key];          // both at their defaults
                pushSetup(key, null);
            }
            storePresetsLocally();
            renderPlaylistMode();
            // The song on now follows at once: its mix unless it has its own
            // setup here, and its fades from where it is.
            const song = songs[currentSongIndex];
            if (modeChanged && mode && song && !ownPlaylistSetup(song.dir)) applyPreset(mode);
            if (isPlaying) { armClip(songPosition(), true); scheduleClipGain(); }
        }

        /* The setup saved for this song in the picked playlist -- the only
         * thing that overrides the playlist's mode. */
        function ownPlaylistSetup(dir) {
            if (!selectedPlaylist) return null;
            const k = selectedPlaylist + '::' + dir;
            return (!isAdmin() && mySetups[k]) || sessionPresets[k] || null;
        }

        function selectPlaylist(name) {
            selectedPlaylist = name;
            // Saved and the playlists sit in the same row and look alike, so
            // they read as one either/or group -- but they used to AND
            // together, which meant picking a playlist while Saved was on
            // showed the intersection and you had to unclick Saved first.
            savedOnly = false;
            renderPlaylistChips();
            filterSongs();
            // Clips belong to the playlist, so the row and the running fade
            // follow the chip. Picking the set mid-song arms its clip end.
            renderClip();
            if (isPlaying) { armClip(songPosition(), true); scheduleClipGain(); }
        }

        function createPlaylist() {
            if (!isAdmin()) return;
            const name = prompt('New playlist name:');
            if (name && name.trim()) {
                playlists[name.trim()] = [];
                savePlaylists();
                renderPlaylistChips();
            }
        }

        // credentials:'include' is explicit rather than relying on the default.
        // These requests MUST carry the login: one that does not comes back 401
        // and the browser reopens its password prompt over a page that is
        // already signed in.
        async function loadPlaylists() {
            try {
                const r = await fetch('/api/playlists',
                                      { cache: 'no-store', credentials: 'include' });
                if (!r.ok) return;
                const d = await r.json();
                playlists = d.playlists || {};
                playlistRev = d.rev || 0;
                localStorage.setItem('beatznbox_playlists', JSON.stringify(playlists));
                renderPlaylistChips();
                filterSongs();
            } catch (e) {
                // Offline, or the queue service is down. The localStorage copy
                // is already loaded, so the set still works -- it just will not
                // pick up anyone else's changes until the next successful load.
                console.warn('playlists: using the local copy', e);
            }
        }

        async function savePlaylists() {
            localStorage.setItem('beatznbox_playlists', JSON.stringify(playlists));
            const body = () => JSON.stringify({ playlists, rev: playlistRev });
            try {
                let r = await fetch('/api/playlists', { method: 'POST', credentials: 'include',
                    headers: { 'Content-Type': 'application/json' }, body: body() });
                if (r.status === 409) {
                    // Someone edited from another phone between our load and
                    // our save. Keep both: their lists, ours winning on names
                    // we hold, minus whatever we deleted here.
                    const d = await r.json();
                    const merged = Object.assign({}, d.playlists || {}, playlists);
                    for (const n of deletedPlaylists) delete merged[n];
                    playlists = merged;
                    playlistRev = d.rev || 0;
                    r = await fetch('/api/playlists', { method: 'POST', credentials: 'include',
                        headers: { 'Content-Type': 'application/json' }, body: body() });
                }
                if (r.status === 403) {
                    // A viewer login (see "Who is signed in"). Unlike setups
                    // and clips there is no device-only playlist: the list
                    // is one shared map, replaced whole by every load, and a
                    // private copy would fight that. So put the shared one
                    // back and say why, in the note under the chips.
                    readOnlyRefused('playlist change');
                    deletedPlaylists.clear();
                    await loadPlaylists();
                    const note = document.getElementById('viewerNote');
                    if (note) note.textContent = 'Playlists are set by the hosts, so that change was not saved.';
                    return;
                }
                if (r.ok) {
                    const d = await r.json();
                    playlists = d.playlists || {};
                    playlistRev = d.rev || 0;
                    localStorage.setItem('beatznbox_playlists', JSON.stringify(playlists));
                    renderPlaylistChips();
                }
            } catch (e) {
                console.warn('playlists: change kept locally, not shared', e);
            }
        }

        function filterSongs() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const x = document.getElementById('searchClear');
            if (x) x.hidden = !query;
            let list = songs;

            if (selectedPlaylist) {
                const playlistSongs = playlists[selectedPlaylist] || [];
                list = playlistSongs.map(dir => songs.find(s => s.dir === dir)).filter(Boolean);
            }

            // One box across title, film and singer: at a party people type
            // "Kishore" or "Dabangg" as readily as they type the song.
            if (savedOnly) list = list.filter(s => offlineDirs.has(s.dir));

            if (query) {
                list = list.filter(s => {
                    const hay = [s.name, s.film || '', ...(s.singers || [])].join(' ').toLowerCase();
                    return hay.includes(query);
                });
            }

            filteredSongs = list;
            // The Clear chip appears and disappears with the filter it undoes.
            renderSongList();
        }

        function renderSongList() {
            const el = document.getElementById('songList');
            document.getElementById('songCount').textContent = `${filteredSongs.length} songs`;
            renderOffline();          // the offer depends on which songs are listed

            if (filteredSongs.length === 0) {
                el.innerHTML = '<div style="padding:20px;color:#999;text-align:center">No songs found</div>';
                return;
            }

            // Move up/down only on a whole playlist: with a search or Saved
            // narrowing it, the neighbour on screen is not the neighbour in
            // the set, and a move would jump over songs you cannot see.
            const query = document.getElementById('searchInput').value.trim();
            const canMove = !!selectedPlaylist && !query && !savedOnly;
            const last = filteredSongs.length - 1;

            el.innerHTML = filteredSongs.map((song, i) => {
                const globalIdx = songs.indexOf(song);
                const isActive = globalIdx === currentSongIndex;
                const songPlaylists = Object.keys(playlists).filter(p => playlists[p].includes(song.dir));
                // A dot rather than a word: the list is scanned, not read, and
                // the point is to stop re-discovering a bad song mid-performance.
                const dot = song.lyrics === 'bad'
                    ? `<span class="lyric-dot bad" title="${song.lyricsFault === 'words'
                        ? 'No usable words' : 'Cannot follow the words'} — ${song.lyricsNote || ''}"></span>`
                    : song.lyrics === 'check'
                    ? `<span class="lyric-dot check" title="Rough patch — ${song.lyricsNote || ''}"></span>`
                    : '';
                return `<div class="song-item ${isActive ? 'active' : ''}" onclick="selectSong(${globalIdx})">
                    <div style="flex:1">
                        <div class="song-name">${dot}${song.name}</div>
                        ${(song.film || (song.singers || []).length)
                            ? `<div class="song-sub">${[song.film, (song.singers || [])[0]].filter(Boolean).join(' · ')}</div>`
                            : ''}
                        ${songPlaylists.length ? `<div class="song-playlists">${songPlaylists.join(', ')}</div>` : ''}
                    </div>
                    ${canMove ? `<span class="pl-move">
                        <button class="pl-move-btn" ${i === 0 ? 'disabled' : ''} title="Move up" aria-label="Move up" onclick="event.stopPropagation();moveInPlaylist(${i}, -1)">&#9650;</button>
                        <button class="pl-move-btn" ${i === last ? 'disabled' : ''} title="Move down" aria-label="Move down" onclick="event.stopPropagation();moveInPlaylist(${i}, 1)">&#9660;</button>
                    </span>` : ''}
                    <span class="add-pl" title="Add to a playlist" aria-label="Add to a playlist" onclick="event.stopPropagation();addToPlaylist(${globalIdx})">+</span>
                </div>`;
            }).join('');
        }

        /* Swap a song with its neighbour in the picked playlist. `i` is its
         * place in the list on screen, which canMove keeps equal to its place
         * in the playlist (bar songs no longer in the library, hence by dir). */
        function moveInPlaylist(i, delta) {
            if (!isAdmin() || !selectedPlaylist) return;
            const list = playlists[selectedPlaylist];
            const a = filteredSongs[i], b = filteredSongs[i + delta];
            if (!list || !a || !b) return;
            const ia = list.indexOf(a.dir), ib = list.indexOf(b.dir);
            if (ia < 0 || ib < 0) return;
            [list[ia], list[ib]] = [list[ib], list[ia]];
            savePlaylists();
            filterSongs();
        }

        /* Picking, not typing. This used to be prompt() with the names listed
           in the message, so adding a song meant reading a playlist name and
           re-typing it exactly -- and a typo silently did nothing, because the
           old code only acted when the string matched a key. It also could only
           add, so removing meant going into edit mode on the playlist. */
        function addToPlaylist(songIdx) {
            if (!isAdmin()) return;
            const song = songs[songIdx];
            closePlaylistPicker();
            const names = Object.keys(playlists);
            const rows = names.map((n) => {
                const on = playlists[n].includes(song.dir);
                return `<button class="pp-row${on ? ' on' : ''}" onclick="togglePlaylistMember(${songIdx}, ${JSON.stringify(n).replace(/"/g, '&quot;')})">`
                     + `<span class="pp-tick">${on ? '&#10003;' : ''}</span>`
                     + `<span class="pp-name"></span></button>`;
            }).join('');
            const el = document.createElement('div');
            el.className = 'pp-backdrop';
            el.id = 'playlistPicker';
            el.onclick = (e) => { if (e.target === el) closePlaylistPicker(); };
            el.innerHTML = `<div class="pp-card" role="dialog" aria-label="Add to a playlist">
                    <div class="pp-head"></div>
                    <div class="pp-rows">${rows || '<div class="pp-empty">No playlists yet</div>'}</div>
                    <button class="pp-new" onclick="newPlaylistFor(${songIdx})">+ New playlist</button>
                </div>`;
            document.body.appendChild(el);
            // textContent, not interpolation: song and playlist names are data.
            el.querySelector('.pp-head').textContent = song.name;
            [...el.querySelectorAll('.pp-row')].forEach((b, i) => {
                b.querySelector('.pp-name').textContent = names[i];
            });
        }

        function closePlaylistPicker() {
            const el = document.getElementById('playlistPicker');
            if (el) el.remove();
        }

        function togglePlaylistMember(songIdx, name) {
            if (!isAdmin()) return;
            const song = songs[songIdx];
            const list = playlists[name];
            if (!list) return;
            const at = list.indexOf(song.dir);
            if (at >= 0) list.splice(at, 1); else list.push(song.dir);
            savePlaylists();
            renderSongList();
            addToPlaylist(songIdx);        // reopen, so several can be ticked
        }

        function newPlaylistFor(songIdx) {
            if (!isAdmin()) return;
            const name = prompt('New playlist name:');
            closePlaylistPicker();
            if (!name || !name.trim()) return;
            const n = name.trim();
            if (!playlists[n]) playlists[n] = [];
            if (!playlists[n].includes(songs[songIdx].dir)) playlists[n].push(songs[songIdx].dir);
            savePlaylists();
            renderPlaylistChips();
            renderSongList();
        }

        // ===== Player =====

        // opts.autoplay   — start as soon as the stems are decoded
        // opts.inheritMix  — carry the current fader positions across, instead
        //                    of resetting to a preset. Both are set when one
        //                    song rolls into the next on its own: nobody asked
        //                    for a change, so nothing should change.
        async function selectSong(index, opts = {}) {
            // Leaving the list is the point of picking, so this happens even
            // when the tap lands on the song already loaded -- otherwise
            // tapping what is playing looks like nothing happened.
            document.body.classList.remove('view-library');
            if (currentSongIndex === index) return;

            /* A load used to make every other song untappable until it
             * finished -- `if (isLoading) return;` with no feedback. An
             * average song is 22MB, which is ~12s on good 4G but nearer two
             * minutes on 3G, so "the whole library is dead" was the normal
             * experience of a weak connection rather than an edge case.
             * Picking a different song now cancels the one in flight. */
            if (cancelLoad) cancelLoad();
            const myLoad = ++loadGen;

            // Read the mix before tearing the graph down.
            const carriedMix = opts.inheritMix ? currentMix() : null;

            // Fully stop and disconnect everything
            stopPlayback();
            for (const stem of STEM_NAMES) {
                if (gainNodes[stem]) {
                    gainNodes[stem].disconnect();
                    gainNodes[stem] = null;
                }
            }
            stems = {};
            sourceNodes = {};

            currentSongIndex = index;
            // There is something to show now, so the player and the lyric pane
            // come back. On a phone they were never rendered until this point.
            // No scrolling to the player any more: on a phone the player now
            // replaces the list rather than sitting under it, so there is
            // nothing above it to scroll past.
            document.body.classList.remove('no-song');
            const song = songs[index];
            currentSongDir = song.dir;
            isLoading = true;

            document.getElementById('nowPlaying').textContent = song.name;
            document.getElementById('bsSong').textContent = song.name;
            renderSongList();

            document.getElementById('playerContent').innerHTML = `
                <div class="player-head">
                    <div class="player-title">${song.name}</div>
                    <!-- The same + the song list has, so filing the song you
                         are singing does not mean going back to find it. -->
                    <button class="add-pl" onclick="addToPlaylist(${index})"
                            title="Add to a playlist" aria-label="Add to a playlist">+</button>
                    <button class="flag-btn" id="flagBtn" onclick="toggleReport()"
                            title="Report a problem with this song"
                            aria-label="Report a problem with this song">&#9873;</button>
                </div>
                <div class="report-box" id="reportBox" hidden>
                    <div class="report-reasons">
                        <button class="report-reason" data-reason="wrong-song"
                                onclick="pickReason(this)">Wrong song</button>
                        <button class="report-reason" data-reason="lyrics"
                                onclick="pickReason(this)">Lyrics don't match</button>
                        <button class="report-reason" data-reason="quality"
                                onclick="pickReason(this)">Sound quality</button>
                        <button class="report-reason" data-reason="other"
                                onclick="pickReason(this)">Something else</button>
                    </div>
                    <input type="text" id="reportNote" maxlength="200"
                           placeholder="Anything worth knowing (optional)">
                    <button class="report-send" id="reportSend" onclick="sendReport()" disabled>Send</button>
                    <div class="request-note" id="reportResult"></div>
                </div>
                <div class="loading" id="loadingStatus">Loading stems...</div>
                <div class="seek-row">
                    <span class="time" id="currentTime">0:00</span>
                    <input type="range" id="seekBar" min="0" max="1000" value="0" oninput="seekTo(this.value)">
                    <span class="time" id="totalTime">0:00</span>
                </div>
                <div class="transport">
                    <button class="btn btn-stop" id="stopBtn" onclick="stopPlayback(); cueClipStart()">&#9632;</button>
                    <button class="btn btn-play" id="playBtn" onclick="togglePlay()">&#9654;</button>
                    <button class="btn btn-expand" onclick="expandButton()"
                            title="Lyrics view" aria-label="Lyrics view">&#127908;</button>
                    <button class="btn btn-expand btn-popout" onclick="popOutLyrics()"
                            title="Lyrics in their own window, for a TV"
                            aria-label="Pop out lyrics"><svg width="16" height="16"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
                            style="display:block;margin:auto"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path
                            d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></button>
                </div>
                <div class="presets">
                    <button class="preset-btn" id="pre-singalong" onclick="applyPreset('singalong')">Sing along</button>
                    <button class="preset-btn" id="pre-karaoke" onclick="applyPreset('karaoke')">Karaoke</button>
                    <button class="preset-btn" id="pre-unplugged" onclick="applyPreset('unplugged')">Unplugged</button>
                    <button class="preset-btn" id="pre-jamming" onclick="applyPreset('jamming')">Jamming</button>
                </div>
                <div class="tempo-row" id="tempoRow" style="display:none">
                    <span class="tempo-label">Speed</span>
                    ${TEMPOS.map((t) => `<button class="tempo-btn" data-tempo="${t}" onclick="setTempo(${t})">${Math.round(t * 100) + '%'}</button>`).join('')}
                </div>
                <div class="tempo-row" id="keyRow" style="display:none">
                    <span class="tempo-label">Key</span>
                    <button class="tempo-btn key-step" onclick="setKey(keyShift - KEY_STEP)" aria-label="Lower the key">&minus;</button>
                    <button class="tempo-btn key-value" id="keyValue" onclick="setKey(0)" title="Back to the original key">Original</button>
                    <button class="tempo-btn key-step" onclick="setKey(keyShift + KEY_STEP)" aria-label="Raise the key">+</button>
                </div>
                <!-- Only while a playlist is picked: a clip belongs to a song
                     in one set, so outside a playlist there is nothing to set.
                     A tempo-row so the stage sheet styles it like its
                     neighbours with no rules of its own. -->
                <div class="tempo-row clip-row" id="clipRow" style="display:none">
                    <span class="tempo-label">Clip</span>
                    <!-- clip-edit: hidden for viewers, whose clips are the
                         hosts' (see body.viewer in the CSS). -->
                    <button class="tempo-btn clip-edit" onclick="setClipPoint('start')"
                            title="Start this song here in this playlist">Set start</button>
                    <button class="tempo-btn clip-edit" onclick="setClipPoint('end')"
                            title="End this song here in this playlist (fades out over the 5s before)">Set end</button>
                    <span class="clip-summary" id="clipSummary"></span>
                </div>
                <div class="up-next" id="upNext">
                    <span class="label">Up next:</span>
                    <span class="next-name" id="nextSongName"></span>
                    <button class="skip-btn" onclick="playNext({ autoplay: true })">Play</button>
                </div>
                <div class="section-header" onclick="toggleSection('mixer')">
                    <span>Stem Mixer</span><span id="mixerArrow">&#9650;</span>
                </div>
                <div class="section-content" id="mixerSection">
                    <div class="stem-row"><span class="stem-name">Vocals</span><input type="range" min="0" max="100" value="0" id="sl-vocals" oninput="setStemVol('vocals',this.value)"><span class="stem-vol" id="vol-vocals">0%</span></div>
                    <div class="stem-row"><span class="stem-name">Drums</span><input type="range" min="0" max="100" value="80" id="sl-drums" oninput="setStemVol('drums',this.value)"><span class="stem-vol" id="vol-drums">80%</span></div>
                    <div class="stem-row"><span class="stem-name">Bass</span><input type="range" min="0" max="100" value="80" id="sl-bass" oninput="setStemVol('bass',this.value)"><span class="stem-vol" id="vol-bass">80%</span></div>
                    <div class="stem-row"><span class="stem-name">Harmony</span><input type="range" min="0" max="100" value="80" id="sl-other" oninput="setStemVol('other',this.value)"><span class="stem-vol" id="vol-other">80%</span></div>
                </div>
                <div class="save-row">
                    <button class="save-btn" onclick="saveSetup()">Save Setup</button>
                    <button class="save-btn" onclick="clearSetup()" style="display:none" id="clearSetupBtn">Clear</button>
                </div>
                <div class="preset-indicator" id="presetIndicator"></div>
            `;

            // The template above ships fresh, enabled buttons, so the lock has
            // to go on after it — not when loading started.
            setTransportEnabled(false);

            // Show up next
            updateUpNext();

            // Stacked on a phone, the controls sit below a song list that fills
            // a third of the screen — so picking a song appears to do nothing.
            // Bring the player into view. Desktop keeps all three panels
            // visible at once and needs no scrolling.
            if (window.matchMedia('(max-width: 820px)').matches) {
                document.querySelector('.panel-center')
                        .scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

            // Init audio. Pin the context to the stems' own 44.1kHz: left to
            // pick its own rate it opens at 48k and resamples every stem on
            // decode, which measured 2707ms against 1344ms rate-matched, and
            // holds 421MB of PCM instead of 386MB. Decode is the floor on
            // load time, so this is the single biggest win available.
            if (!audioCtx) {
                try {
                    audioCtx = new AudioContext({ sampleRate: 44100 });
                    pinnedRate = true;
                } catch (e) {
                    // A browser may refuse a rate its hardware cannot open.
                    // Correct playback at 48k beats no playback at 44.1k.
                    console.warn('44.1kHz context unavailable, using default', e);
                    audioCtx = new AudioContext();
                }
            }

            ensureMasterBus();

            // Load stems, all four at once. Serially this cost four round
            // trips plus four decodes with no overlap — each decode blocked
            // the next download — which is where the 10-15s wait came from.
            let loaded = 0;
            const pre = (prefetched.dir === song.dir) ? prefetched.bytes : null;
            // A prefetch for some *other* song is now dead weight: nothing will
            // ever read those bytes, but they are still on the wire competing
            // with the four stems we actually need. prefetchNext only aborted
            // the previous prefetch when starting the next one, so picking out
            // of list order -- which is what a room calling out songs does --
            // left 8 mp3s in flight instead of 4. Measured 7.1-7.4s against
            // 5.8s for the same load in order.
            if (!pre && prefetched.ctrl) {
                prefetched.ctrl.abort();
                prefetched = { dir: null, bytes: null, ctrl: null };
            }
            // decodeAudioData detaches the buffer it is given, so prefetched
            // bytes are good for exactly one decode. Drop our handle now.
            if (pre) prefetched = { dir: null, bytes: null, ctrl: null };
            /* A song is about 22MB. The status used to move only when a whole
             * ~6MB stem finished, so on weak mobile data you watched
             * "Loading... (0/4)" for minutes with no sign of life -- and if the
             * connection stalled there was no timeout anywhere, so it simply
             * hung. Iti hit exactly that outside on 4 Sep: the page and the
             * password were fine and no song would load. Slow and dead looked
             * the same, again. */
            let bytesIn = 0, bytesExpected = 0, lastProgressAt = Date.now();
            const mb = (b) => (b / 1048576).toFixed(1);
            const setLoadStatus = () => {
                const el = document.getElementById('loadingStatus');
                if (!el) return;
                if (loaded >= STEM_NAMES.length) { el.textContent = ''; return; }
                el.textContent = bytesIn
                    ? `Loading... ${mb(bytesIn)}`
                      + (bytesExpected ? ` / ${mb(bytesExpected)} MB` : ' MB')
                    : `Loading... (${loaded}/${STEM_NAMES.length})`;
            };
            setLoadStatus();
            let firstError = null;

            // One controller for the whole song, so a stall can cancel all four
            // rather than leaving them hanging.
            const loadCtl = new AbortController();
            const STALL_MS = 25000;
            // The watchdog rejects a promise of its own AND aborts the fetches.
            // Both, because neither alone is enough: abort() tears down a real
            // network request, but a body that has stopped yielding does not
            // reliably reject its pending read when the signal fires -- proved
            // on 4 Sep, abort() was called and the read stayed pending, so the
            // player sat at "Loading... (0/4)" with isLoading stuck true and
            // no other song could be picked. Racing our own promise does not
            // depend on that behaviour at all.
            let onStall = () => {};
            const stalled = new Promise((_, reject) => {
                onStall = (why) => reject(new Error(why || `nothing arrived for ${STALL_MS / 1000}s`));
            });
            stalled.catch(() => {});      // never an unhandled rejection
            const stallTimer = setInterval(() => {
                if (loaded >= STEM_NAMES.length) return;
                if (Date.now() - lastProgressAt < STALL_MS) return;
                clearInterval(stallTimer);
                loadCtl.abort(new Error('stalled'));
                onStall();
            }, 2000);
            // Picking another song uses the same machinery the watchdog does.
            cancelLoad = () => {
                clearInterval(stallTimer);
                loadCtl.abort(new Error('superseded'));
                onStall('superseded');
                isLoading = false;
                cancelLoad = null;
            };

            // The abort has to be raced explicitly rather than trusted to
            // propagate. A response whose body simply stops yielding leaves
            // reader.read() pending forever, and aborting the signal does not
            // always reject it -- so the watchdog fired and nothing happened,
            // isLoading stayed true, and NO further song could be selected.
            // That is the shape of "none of the songs were loading when
            // clicked": one stall wedges the whole player.
            const onAbort = (signal) => new Promise((_, reject) => {
                if (signal.aborted) return reject(signal.reason);
                signal.addEventListener('abort',
                    () => reject(signal.reason), { once: true });
            });

            const readWithProgress = async (resp, signal) => {
                const len = Number(resp.headers.get('Content-Length')) || 0;
                if (len) { bytesExpected += len; }
                // A cache hit and a very old browser both land here.
                if (!resp.body || !resp.body.getReader) return resp.arrayBuffer();
                const reader = resp.body.getReader();
                const chunks = [];
                let got = 0;
                try {
                    for (;;) {
                        const { done, value } =
                            await Promise.race([reader.read(), onAbort(signal)]);
                        if (done) break;
                        chunks.push(value);
                        got += value.length;
                        bytesIn += value.length;
                        lastProgressAt = Date.now();
                        setLoadStatus();
                    }
                } catch (e) {
                    try { await reader.cancel(); } catch (_) {}
                    throw e;
                }
                const out = new Uint8Array(got);
                let off = 0;
                for (const c of chunks) { out.set(c, off); off += c.length; }
                return out.buffer;
            };

            const fetchStem = (stem) => Promise.race([stalled, (async () => {
                let buf = pre && pre[stem];
                if (!buf || buf.byteLength === 0) {
                    const resp = await cachedFetch(audioUrl(song.dir, stem),
                                                   { signal: loadCtl.signal });
                    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                    buf = await readWithProgress(resp, loadCtl.signal);
                }
                return buf;
            })()]);
            // Fetch all four at once, decode them one at a time. The network
            // is where the parallel win is; decoding in parallel as well put
            // four ~100MB buffers under allocation at the same moment, which a
            // phone does not have — it showed up as a stuck load on an iPhone
            // and as "failed to load" on Android.
            const pending = {};
            STEM_NAMES.forEach((stem) => {
                pending[stem] = fetchStem(stem).catch((e) => {
                    if (!firstError) firstError = e;
                    console.warn(`Fetch failed: ${stem}`, e);
                    return null;
                });
            });
            // Decode WIDTH, not "decode in parallel". Four at once put four
            // ~100MB allocations under the allocator at the same moment, which
            // hung an iPhone and gave Android "failed to load" -- that is why
            // this loop was serial. Two at once holds half the peak of the
            // version that broke.
            //
            // Phones were excluded wholesale at first, which meant the machine
            // that needs the help most got none of it. Measured over adb on the
            // OnePlus 12 (8 cores, 8GB), Kesariya's four stems: width 1 took
            // 1923ms and 1733ms, width 2 took 984ms and 990ms -- 45% off, the
            // same ratio as the laptop, with no failure.
            //
            // So the gate is memory, not screen size. navigator.deviceMemory is
            // a Chromium API that iOS Safari does not implement, so it reads
            // undefined there and an iPhone -- the device that actually hung --
            // keeps the serial path by construction rather than by our guess
            // about which iPhone is safe. Low-end Androids fall out too.
            const roomyEnough = !window.matchMedia('(max-width: 820px)').matches
                                || (navigator.deviceMemory || 0) >= 4;
            const decodeWidth = roomyEnough ? 2 : 1;
            for (let i = 0; i < STEM_NAMES.length; i += decodeWidth) {
                await Promise.all(STEM_NAMES.slice(i, i + decodeWidth).map(async (stem) => {
                    try {
                        const buf = await pending[stem];
                        if (!buf || myLoad !== loadGen) return;
                        const decoded = await audioCtx.decodeAudioData(buf);
                        if (myLoad !== loadGen) return;   // superseded mid-decode
                        stems[stem] = decoded;
                        loaded++;
                        setLoadStatus();
                    } catch (e) {
                        if (!firstError) firstError = e;
                        console.warn(`Decode failed: ${stem}`, e);
                    }
                }));
            }

            // A context pinned to 44.1kHz decodes faster and holds less, but
            // some browsers accept the rate and then refuse to decode at it.
            // Losing playback is worse than losing the saving, so fall back to
            // whatever rate the device wants and try once more.
            if (loaded === 0 && audioCtx.sampleRate === 44100 && pinnedRate) {
                console.warn('44.1kHz decode failed everywhere; retrying at the device rate');
                pinnedRate = false;
                try { audioCtx.close(); } catch (e) {}
                audioCtx = new AudioContext();
                gainNodes = {};
                // masterGain and the worklet node belong to the context we just
                // closed. Kept, they would silently route the retry into nothing.
                masterGain = null; tempoNode = null; tempoReady = false;
                ensureMasterBus();
                firstError = null;
                for (const stem of STEM_NAMES) {
                    try {
                        // The first attempt detached these buffers, so refetch.
                        const buf = await fetchStem(stem);
                        stems[stem] = await audioCtx.decodeAudioData(buf);
                        loaded++;
                        setLoadStatus();
                    } catch (e) {
                        if (!firstError) firstError = e;
                        console.warn(`Retry failed: ${stem}`, e);
                    }
                }
            }

            clearInterval(stallTimer);
            // A superseded load must not touch the player: another song is
            // already loading into it, and its own finish will do this.
            if (myLoad !== loadGen) return;
            cancelLoad = null;
            isLoading = false;

            if (loaded === 0) {
                // Say what actually went wrong — "Failed to load" alone left
                // nobody anything to act on.
                const why = firstError
                    ? `${firstError.name || 'Error'}: ${firstError.message || firstError}`
                    : 'no reason given';
                // A stall is the one failure with a real answer for the person
                // holding the phone: it is 22MB over whatever signal they have,
                // and saving the setlist beforehand is what makes a jam
                // independent of the venue's wifi.
                const stalled = /nothing arrived|aborted/i.test(why);
                document.getElementById('loadingStatus').innerHTML = stalled
                    ? `Nothing arrived — the connection looks too weak for this song
                       (about ${mb(bytesExpected || 22 * 1048576)} MB).
                       <button class="save-btn" onclick="retryCurrentSong()">Try again</button>`
                    : `Failed to load — ${why}`;
                return;
            }

            renderTempo();
            songDuration = Math.max(...Object.values(stems).map(b => b.duration));
            document.getElementById('loadingStatus').textContent = '';
            document.getElementById('totalTime').textContent = formatTime(songDuration);

            for (const stem of STEM_NAMES) {
                if (!gainNodes[stem]) {
                    gainNodes[stem] = audioCtx.createGain();
                    gainNodes[stem].connect(masterGain);
                }
            }

            // A mix carried over from the previous song wins: it is what the
            // room was just listening to. Otherwise this song's own saved
            // setup, and failing that the default.
            // In a playlist, a setup saved for the song in THAT playlist beats
            // everything, then the playlist's mode -- both beat the carried
            // mix, being what the set was planned with. The song's All setup
            // still brings its speed and key under a playlist mode.
            const savedSetup = setupFor(song.dir);
            const plMode = playlistMode();
            if (ownPlaylistSetup(song.dir)) {
                restoreSetup(savedSetup);
            } else if (plMode) {
                if (savedSetup) restoreSetup(savedSetup);
                applyPreset(plMode);
            } else if (carriedMix) {
                applyMix(carriedMix);
            } else if (savedSetup) {
                restoreSetup(savedSetup);
            } else {
                applyPreset(DEFAULT_PRESET);
            }
            // The key follows the song even when the mix is carried: a key
            // saved for this song is the singer's range, not a room setting.
            setKey(savedSetup && savedSetup.key ? savedSetup.key : 0);
            // Speed too, and back to 100% when nothing is saved: in a
            // playlist playing straight through, the next song used to keep
            // the last one's speed and ignore its own.
            setTempo(savedSetup && savedSetup.tempo ? savedSetup.tempo : 1);

            // A clip's start beats a setup's saved position: in a set, where
            // the song comes in is the whole point of the clip. The setup's
            // mix, speed and key above still apply -- those are the song's.
            cueClipStart();
            renderClip();

            setTransportEnabled(true);
            if (opts.autoplay) startPlayback();

            // Load lyrics
            loadLyrics(song.dir);

            // Warm the next song while this one plays.
            prefetchNext();
        }

        // Faders as plain numbers, so a mix survives the audio graph being
        // rebuilt for the next song.
        function currentMix() {
            const mix = {};
            for (const stem of STEM_NAMES) {
                const sl = document.getElementById('sl-' + stem);
                mix[stem] = sl ? Number(sl.value)
                               : (gainNodes[stem] ? gainNodes[stem].gain.value * 100 : 80);
            }
            return mix;
        }

        function applyMix(mix) {
            for (const [stem, vol] of Object.entries(mix)) {
                setStemVol(stem, vol);
                const sl = document.getElementById('sl-' + stem);
                if (sl) sl.value = vol;
            }
            // The mix no longer corresponds to a named preset unless it
            // happens to match one, so light whichever it equals.
            syncPresetButtons(mix);
        }

        // Nothing in the transport does anything useful until the stems are
        // decoded, and a play press that silently does nothing reads as a
        // broken app.
        function setTransportEnabled(on) {
            ['playBtn', 'stopBtn'].forEach(id => {
                const b = document.getElementById(id);
                if (b) { b.disabled = !on; b.style.opacity = on ? '' : '0.45'; }
            });
            const seek = document.getElementById('seekBar');
            if (seek) seek.disabled = !on;
        }

        let timedLyrics = null;
        let lyricsInterval = null;
        let lyricsLines = [];
        let crushedLines = [];

        // Viterbi has to place every lyric line, in order. Audio with no matching
        // text is absorbed by the aligner's star token, but there is no mechanism
        // for the reverse — a line the singer never sang at that point still has
        // to go somewhere, so it collapses to near-zero width between the lines
        // that did match, and the time it should have held gets dumped into a
        // neighbour. On screen it flashes past inside a single frame.
        //
        // Those lines still render, so nobody loses lyrics they wanted to read.
        // They simply never take the highlight: the last line that was really
        // sung holds instead. This is a display rule on purpose — rewriting the
        // spans themselves is the thing align-lyrics.py measured and rejected,
        // where evening out placement dropped word-on-voiced-audio 84% -> 72%.
        //
        // 5 w/s is above a comfortable sung line and below what the crushed ones
        // report (6-9 w/s). Genuine rap sections sit closest to it, so raise this
        // if a fast but real line stops lighting up.
        const MAX_WORDS_PER_SEC = 5.0;

        function isCrushed(line) {
            const w = line.words || [];
            const span = line.end - line.start;
            return w.length > 1 && span > 0 && (w.length / span) > MAX_WORDS_PER_SEC;
        }
        let lastActiveIdx = -2;
        let lastWordKey = '';
        let userScrolledAt = 0;
        const USER_SCROLL_GRACE_MS = 4000;

        async function loadLyrics(dir) {
            const el = document.getElementById('lyricsContent');
            const song = songs[currentSongIndex];
            const box = document.getElementById('pasteBox');
            const hint = document.getElementById('pasteHint');
            if (box && song) {
                box.style.display = 'block';
                if (hint) hint.hidden = true;
                document.getElementById('pasteSummary').textContent =
                    song.lyricsFault === 'words' ? '+ Paste lyrics for this song'
                                                 : '+ Replace the lyrics';
                // Open it unprompted only when the WORDS are wrong. A red dot no
                // longer means that on its own: a song whose words are right and
                // whose highlight parks for 42s is also red, and opening the box
                // there asks someone to retype a lyric that is already correct.
                document.getElementById('pastePanel').open =
                    (song.lyricsFault === 'words');
                document.getElementById('pasteNote').textContent = '';
            }
            timedLyrics = null;
            lyricsLines = [];
            crushedLines = [];
            if (lyricsInterval) clearInterval(lyricsInterval);
            // Hide the toggle until we know this song has something to toggle;
            // otherwise it lingers from the previous song.
            syncScriptToggle();

            // Try timed lyrics first (JSON with timestamps).
            // cache:'no-store' — realignment rewrites this file in place, and a
            // stale cached copy is indistinguishable from a bad alignment.
            try {
                const resp = await netFirstCached(stemUrl(dir, 'lyrics_timed.json'));
                if (resp.ok) {
                    timedLyrics = await resp.json();
                    syncScriptToggle();
                    renderTimedLyrics(el);
                    startLyricsSync();
                    return;
                }
            } catch (e) {}

            // Fallback to plain text lyrics — render as scrollable lines
            try {
                const resp = await netFirstCached(stemUrl(dir, 'lyrics.txt'));
                if (resp.ok) {
                    const text = await resp.text();
                    lyricsLines = text.split('\n').filter(l => l.trim());
                    if (lyricsLines.length > 0) {
                        renderPlainLyrics(el);
                        startLyricsSync();
                    } else {
                        el.innerHTML = '<span class="no-lyrics">No lyrics available</span>';
                    }
                } else {
                    el.innerHTML = '<span class="no-lyrics">No lyrics available</span>';
                }
            } catch (e) {
                el.innerHTML = '<span class="no-lyrics">No lyrics available</span>';
            }
        }

        function escapeHtml(s) {
            return s.replace(/[&<>"']/g, c =>
                ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        // The aligner emits per-word timings. Where they exist, wrap each display word
        // in its own span so it can be swept individually — a line span is too blunt
        // in fast passages, where a whole line can go by in under two seconds.
        //
        // Display text and aligned words are not 1:1: the aligner strips punctuation
        // and splits hyphenates ("khud-garzi" -> "khud","garzi"). So walk the display
        // words and the aligned words together, matching on normalized form, and
        // leave any display word without a match untimed rather than forcing a pairing.
        // Named for the script nearly every song uses, but it has to cover them
        // all: Lover arrived in Gurmukhi with a full set of romanised words,
        // and a Devanagari-only test hid both the A toggle and the echo, so
        // the spellings were unreachable (reported 16 Sep). Urdu through
        // Malayalam -- any script the room may not read.
        const DEVANAGARI = /[\u0600-\u06FF\u0900-\u0D7F]/;

        // The aligned token is uroman's rule-based transliteration, which reads
        // "mujhako itanaa bataae koii" for a line everyone spells "mujhko itna
        // bata de koi". romanize-lyrics.py writes a readable `roman` beside it
        // where one has been reviewed; the token stays the fallback so a song
        // that has not been through that pass still renders.
        const roman = w => w.roman || w.word;

        function buildWordSpans(line, lineIdx) {
            const aligned = line.words || [];
            // Romanised view: the aligned tokens ARE the display text, so every
            // word carries its own timing and the sweep is exact. This is the
            // only way word highlighting works on a Devanagari song at all —
            // norm() below strips Devanagari to nothing, so no display word
            // ever matches a token and the whole line falls back to plain text.
            if (romanMode && aligned.length) {
                return aligned.map((w, di) =>
                    `<span class="lyrics-word" id="w-${lineIdx}-${di}" ` +
                    `data-s="${w.start}" data-e="${w.end}">${escapeHtml(roman(w))}</span>`
                ).join(' ');
            }
            const display = line.text.split(/\s+/).filter(Boolean);
            if (!aligned.length) return escapeHtml(line.text);

            const norm = s => s.toLowerCase().replace(/[^a-z']/g, '');

            // Why some songs swept word by word and others only line by line:
            // norm() strips everything outside [a-z'], so every Devanagari word
            // normalises to the empty string, never matches a token, and the
            // whole line falls back to plain text. The aligner built its tokens
            // from these very words though, so when the counts agree, pairing
            // them by position is sound -- and when they do not (a hyphenate
            // split in two, a token dropped) we still fall through to the
            // matcher below rather than pairing words with the wrong times.
            if (display.length === aligned.length && display.every(w => !norm(w))) {
                return display.map((dw, di) =>
                    `<span class="lyrics-word" id="w-${lineIdx}-${di}" ` +
                    `data-s="${aligned[di].start}" data-e="${aligned[di].end}">` +
                    `${escapeHtml(dw)}</span>`
                ).join(' ');
            }
            let ai = 0;
            return display.map((dw, di) => {
                const key = norm(dw);
                let timing = null;
                if (key && ai < aligned.length) {
                    // Hyphenates collapse to several aligned words; consume them all.
                    let j = ai, acc = '';
                    while (j < aligned.length && acc.length < key.length) {
                        acc += aligned[j].word;
                        j++;
                    }
                    if (acc === key) {
                        timing = { start: aligned[ai].start, end: aligned[j - 1].end };
                        ai = j;
                    }
                }
                if (!timing) return escapeHtml(dw);
                return `<span class="lyrics-word" id="w-${lineIdx}-${di}" ` +
                       `data-s="${timing.start}" data-e="${timing.end}">${escapeHtml(dw)}</span>`;
            }).join(' ');
        }

        function renderTimedLyrics(el) {
            if (!timedLyrics) return;
            crushedLines = timedLyrics.map(isCrushed);
            el.innerHTML = timedLyrics.map((line, i) => {
                // The romanised echo only earns its space under the line being
                // sung, so it is rendered for every line and revealed by CSS.
                const echo = (!romanMode && line.words && line.words.length
                              && DEVANAGARI.test(line.text || ''))
                    ? `<div class="lyric-roman">${escapeHtml(
                          line.words.map(roman).join(' '))}</div>`
                    : '';
                return `<div class="lyrics-line upcoming${crushedLines[i] ? ' crushed' : ''}" ` +
                       `id="lyric-${i}">${buildWordSpans(line, i)}${echo}</div>`;
            }).join('');
        }

        /* The sheet holding the mixer, speed and transport. On a mirrored
           phone the screen showing the lyrics IS the controller, so the
           controls cannot live anywhere else -- they wait off screen and come
           back on a tap, the way a video player's do. */
        let stageHideTimer = null;

        function showStageControls() {
            if (!document.body.classList.contains('big-screen')) return;
            document.body.classList.add('controls-open');
            clearTimeout(stageHideTimer);
            stageHideTimer = setTimeout(hideStageControls, 5000);
        }

        function hideStageControls() {
            clearTimeout(stageHideTimer);
            stageHideTimer = null;
            document.body.classList.remove('controls-open');
        }

        document.addEventListener('click', (e) => {
            if (!document.body.classList.contains('big-screen')) return;
            // A tap on the controls themselves is use, not dismissal: keep them
            // up and restart the clock, or the sheet vanishes mid-fader.
            // The playlist picker hangs off <body>, outside the sheet, but
            // ticking a playlist is still use.
            if (e.target.closest('.panel-center') || e.target.closest('.topbar')
                || e.target.closest('.pp-backdrop')) {
                showStageControls();
                return;
            }
            if (document.body.classList.contains('controls-open')) hideStageControls();
            else showStageControls();
        });
        // Dragging a fader fires input, not click, and a slow drag would
        // otherwise time out under the hand using it.
        ['input', 'change'].forEach((ev) => document.addEventListener(ev, (e) => {
            if (document.body.classList.contains('big-screen')
                && e.target.closest('.panel-center')) showStageControls();
        }));

        /* ===== Reporting a fault =====
         *
         * The only detector this library has ever had for a wrong song is a
         * person playing it. Both of 2 Sep's mismatches were found that way,
         * and one of them had been graded "good" by every automatic check --
         * the words were real, well-formed and belonged to a different song.
         * Nothing a script looks at can see that. Someone singing can.
         *
         * The reason is a fixed choice rather than free text because the four
         * cases need different repairs: a wrong recording has to be
         * re-downloaded, wrong words refetched, bad sound re-separated.
         */
        let reportReason = null;

        function toggleReport() {
            const box = document.getElementById('reportBox');
            const btn = document.getElementById('flagBtn');
            if (!box) return;
            box.hidden = !box.hidden;
            btn.classList.toggle('open', !box.hidden);
            if (box.hidden) resetReport();
        }

        function resetReport() {
            reportReason = null;
            document.querySelectorAll('.report-reason')
                .forEach((b) => b.classList.remove('active'));
            const send = document.getElementById('reportSend');
            if (send) { send.disabled = true; send.textContent = 'Send'; }
            const note = document.getElementById('reportNote');
            if (note) note.value = '';
            const out = document.getElementById('reportResult');
            if (out) out.textContent = '';
        }

        function pickReason(el) {
            document.querySelectorAll('.report-reason')
                .forEach((b) => b.classList.toggle('active', b === el));
            reportReason = el.dataset.reason;
            document.getElementById('reportSend').disabled = false;
        }

        async function sendReport() {
            const song = songs[currentSongIndex];
            const out = document.getElementById('reportResult');
            const send = document.getElementById('reportSend');
            if (!song || !reportReason) return;
            send.disabled = true;
            send.textContent = 'Sending...';
            try {
                const r = await fetch('/api/report', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        dir: song.dir,
                        song: song.name,
                        reason: reportReason,
                        note: document.getElementById('reportNote').value.trim(),
                    }),
                });
                const d = await r.json().catch(() => ({}));
                if (!r.ok || !d.ok) throw new Error(d.error || `HTTP ${r.status}`);
                // Say so plainly. A paste used to succeed in silence and Iti
                // hit that as a real annoyance -- there was no way to tell a
                // send from a no-op.
                out.textContent = 'Thanks — logged. Someone will look at it.';
                send.textContent = 'Sent';
                setTimeout(() => {
                    const box = document.getElementById('reportBox');
                    if (box && !box.hidden) toggleReport();
                }, 2000);
            } catch (e) {
                out.textContent = 'Could not send that — try again in a moment.';
                send.disabled = false;
                send.textContent = 'Send';
            }
        }

        function toggleBigScreen() {
            const on = document.body.classList.toggle('big-screen');
            // There is no Escape key on a phone, so the way out rides with the
            // controls. It is the same button that got you in.
            // One button, two jobs, same place. On the player it opens the
            // lyrics; on the stage it is the way back to the songs.
            const ex = document.querySelector('.btn-expand');
            if (ex) {
                ex.textContent = on ? '\u2630' : '\uD83C\uDFA4';
                ex.title = on ? 'Songs' : 'Lyrics view';
                ex.setAttribute('aria-label', ex.title);
            }
            if (on) showStageControls(); else hideStageControls();
            document.getElementById('bsUrl').textContent = location.host;
            const song = songs[currentSongIndex];
            document.getElementById('bsSong').textContent = song ? song.name : '—';
            // The active line has to be re-centred against a pane that just
            // changed size, and its type is now twice as tall.
            lastActiveIdx = -2;
            lastWordKey = '';
            if (timedLyrics) updateLyricsHighlight();
            try { localStorage.setItem('bigScreen', on ? '1' : '0'); } catch (e) {}
        }

        /* On the stage the ☰ used to land on the player, and the songs were one
         * more tap away on the Library button -- found at the 18 Sep session
         * with Karan and Sumedha, where every "next song" took both taps. It
         * now goes straight to the list; the song keeps playing, and tapping it
         * there returns to the player. Escape still means "back to the player". */
        function expandButton() {
            const leaving = document.body.classList.contains('big-screen');
            toggleBigScreen();
            if (leaving) document.body.classList.add('view-library');
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && document.body.classList.contains('big-screen')) {
                toggleBigScreen();
            }
        });

        function toggleRoman() {
            romanMode = !romanMode;
            try { localStorage.setItem('romanLyrics', romanMode ? '1' : '0'); } catch (e) {}
            syncScriptToggle();
            const el = document.getElementById('lyricsContent');
            if (timedLyrics) {
                renderTimedLyrics(el);
                // Repaint immediately rather than waiting for the next tick, or
                // the line under the singer goes grey for up to 50ms.
                lastActiveIdx = -2;
                lastWordKey = '';
                updateLyricsHighlight();
            }
        }

        // Only worth offering when the words are in an Indian script AND the
        // aligner left romanised tokens to swap in.
        function syncScriptToggle() {
            const btn = document.getElementById('scriptToggle');
            if (!btn) return;
            const usable = timedLyrics && timedLyrics.some(l => l.words && l.words.length)
                        && timedLyrics.some(l => DEVANAGARI.test(l.text || ''));
            btn.style.display = usable ? 'inline-block' : 'none';
            btn.textContent = romanMode ? 'अ' : 'A';
            btn.title = romanMode ? 'Show Devanagari' : 'Show romanised';
            btn.className = 'script-toggle' + (romanMode ? ' on' : '');
        }

        function renderPlainLyrics(el) {
            el.innerHTML = lyricsLines.map((line, i) =>
                `<div class="lyrics-line upcoming" id="lyric-${i}">${line}</div>`
            ).join('');
        }

        /* ===== Lyrics in their own window =====
         *
         * For a laptop with the TV as a second screen: the controls stay on
         * the laptop, the room reads the TV. The window carries no script and
         * no audio of its own -- this page keeps rendering and highlighting
         * lyrics into its (hidden) #lyricsContent exactly as it always has,
         * and an observer copies each change across. So play, seek, speed,
         * the A toggle and song changes all follow with nothing new to keep
         * in step. A full copy only when the lines are replaced; after that,
         * class changes alone, by id, so the colour transitions still run.
         */
        let lyricsWin = null;
        let lyricsObserver = null;

        const POPOUT_HTML = `<!DOCTYPE html><html><head><meta charset="utf-8">
<title>Lyrics</title><style>
html, body { margin: 0; height: 100%; }
body {
    background: #0E1413; color: #E6EDEC; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex; flex-direction: column;
    --bs-now:   clamp(20px, min(7.2vh, 8.5vw), 96px);
    --bs-line:  clamp(13px, min(4.2vh, 5vw), 52px);
    --bs-roman: clamp(11px, min(3.1vh, 3.8vw), 38px);
    --bs-title: clamp(12px, min(3vh, 3.6vw), 34px);
    --bs-pad:   clamp(8px, 2.2vh, 30px);
}
:fullscreen body, body:fullscreen { cursor: none; }
#title {
    flex: 0 0 auto; text-align: center; color: #6E8B87;
    font-size: var(--bs-title); padding: var(--bs-pad) var(--bs-pad) 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#lyrics {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; scrollbar-width: none;
    padding: 45vh calc(var(--bs-pad) * 1.4);
    display: flex; flex-direction: column; gap: calc(var(--bs-pad) * 0.55);
}
#lyrics::-webkit-scrollbar { display: none; }
.lyrics-line {
    font-size: var(--bs-line); line-height: 1.25; color: #4A5453;
    text-align: center; overflow-wrap: break-word;
    transition: color 0.3s ease;
}
.lyrics-line.past { color: #2B3534; }
.lyrics-line.active { font-size: var(--bs-now); line-height: 1.2; color: #4DB6AC; font-weight: 600; }
.lyrics-word { transition: color 0.12s linear; }
.lyrics-line.active .lyrics-word { color: #7aa8a3; }
.lyrics-line.active .lyrics-word.sung { color: #80CBC4; }
.lyrics-line.active .lyrics-word.singing { color: #B2DFDB; }
.lyric-roman { display: none; }
.lyrics-line.active .lyric-roman {
    display: block; font-size: var(--bs-roman); line-height: 1.4;
    font-weight: 400; color: #6E8B87; margin-top: 0.35em; letter-spacing: 0.4px;
}
.no-lyrics { color: #4A5453; font-style: italic; text-align: center; font-size: var(--bs-line); }
#hint {
    position: fixed; left: 50%; bottom: 3vh; transform: translateX(-50%);
    background: #1C2625; color: #9FB5B1; padding: 10px 18px; border-radius: 8px;
    font-size: 15px; transition: opacity 0.6s; pointer-events: none;
}
#hint.gone { opacity: 0; }
</style></head><body>
<div id="title"></div>
<div id="lyrics"></div>
<div id="hint">Drag this window to the TV, then double-click for full screen</div>
</body></html>`;

        function popOutLyrics() {
            if (lyricsWin && !lyricsWin.closed) { lyricsWin.focus(); return; }
            // Named, so it can never stack a second window on the TV.
            lyricsWin = window.open('', 'beatzLyrics', 'popup,width=1280,height=720');
            if (!lyricsWin) return;
            const d = lyricsWin.document;
            d.open(); d.write(POPOUT_HTML); d.close();

            d.addEventListener('dblclick', () => {
                if (d.fullscreenElement) d.exitFullscreen();
                else d.documentElement.requestFullscreen().catch(() => {});
            });
            d.addEventListener('fullscreenchange', () =>
                d.getElementById('hint').classList.add('gone'));
            setTimeout(() => {
                const h = lyricsWin && !lyricsWin.closed && d.getElementById('hint');
                if (h) h.classList.add('gone');
            }, 12000);

            copyLyricsAcross();
            if (lyricsObserver) lyricsObserver.disconnect();
            lyricsObserver = new MutationObserver(onLyricsMutated);
            lyricsObserver.observe(document.getElementById('lyricsContent'),
                { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });
            lyricsObserver.observe(document.getElementById('nowPlaying'), { childList: true });
        }

        function popoutAlive() {
            if (lyricsWin && !lyricsWin.closed) return true;
            if (lyricsObserver) { lyricsObserver.disconnect(); lyricsObserver = null; }
            lyricsWin = null;
            return false;
        }

        function copyLyricsAcross() {
            if (!popoutAlive()) return;
            const d = lyricsWin.document;
            const song = songs[currentSongIndex];
            const name = song ? song.name : '';
            d.getElementById('title').textContent = name;
            d.title = name ? name + ' — lyrics' : 'Lyrics';
            const dst = d.getElementById('lyrics');
            dst.innerHTML = song ? document.getElementById('lyricsContent').innerHTML
                                 : '<div class="no-lyrics">Pick a song on the laptop</div>';
            centreActiveLine(false);
        }

        function onLyricsMutated(records) {
            if (!popoutAlive()) return;
            // A new song, or the A toggle re-rendering the lines: copy the lot.
            if (records.some(r => r.type === 'childList')) { copyLyricsAcross(); return; }
            const d = lyricsWin.document;
            let lineMoved = false;
            for (const r of records) {
                const src = r.target;
                if (!src.id) continue;
                const dst = d.getElementById(src.id);
                if (!dst) continue;
                dst.className = src.className;
                if (src.id.startsWith('lyric-') && src.classList.contains('active')) lineMoved = true;
            }
            if (lineMoved) centreActiveLine(true);
        }

        function centreActiveLine(smooth) {
            const d = lyricsWin.document;
            const box = d.getElementById('lyrics');
            const el = box.querySelector('.lyrics-line.active');
            if (!el) { if (!smooth) box.scrollTop = 0; return; }
            box.scrollTo({
                top: el.offsetTop - box.offsetTop - box.clientHeight / 2 + el.offsetHeight / 2,
                behavior: smooth ? 'smooth' : 'auto',
            });
        }

        // The window has nothing to show without this page behind it.
        window.addEventListener('pagehide', () => {
            if (lyricsWin && !lyricsWin.closed) lyricsWin.close();
        });

        function startLyricsSync() {
            if (lyricsInterval) clearInterval(lyricsInterval);
            lastActiveIdx = -2;   // -2 = "not yet rendered", forces a first paint
            lastWordKey = '';
            userScrolledAt = 0;
            // 50ms, not 200ms: the median aligned word is ~0.32s, so a 200ms tick
            // would quantize the sweep into visible steps. Only the active line's
            // words are touched per tick, so this stays cheap.
            lyricsInterval = setInterval(updateLyricsHighlight, 50);
        }

        // Which line should be lit at this playback position, or -1 for none yet.
        function computeActiveIdx(currentTime) {
            const totalLines = timedLyrics ? timedLyrics.length : lyricsLines.length;
            if (totalLines === 0) return -1;

            if (timedLyrics) {
                let idx = -1;
                for (let i = 0; i < timedLyrics.length; i++) {
                    if (currentTime >= timedLyrics[i].start && currentTime < timedLyrics[i].end) {
                        idx = i;
                        break;
                    }
                    if (currentTime < timedLyrics[i].start) break;
                    idx = i;   // past this line, hold it until the next one starts
                }
                // Walk back off any line too fast to have been sung, so the last
                // line the singer actually reached keeps the highlight instead of
                // it flashing through a line that was never there.
                while (idx >= 0 && crushedLines[idx]) idx--;
                return idx;
            }

            // No timestamps — spread lines evenly across the middle of the song.
            const lyricsStart = songDuration * 0.05;
            const lyricsEnd = songDuration * 0.92;
            const timePerLine = (lyricsEnd - lyricsStart) / totalLines;
            if (currentTime < lyricsStart) return -1;
            return Math.min(Math.floor((currentTime - lyricsStart) / timePerLine), totalLines - 1);
        }

        function updateLyricsHighlight() {
            if (!songDuration) return;
            const totalLines = timedLyrics ? timedLyrics.length : lyricsLines.length;
            if (totalLines === 0) return;

            // When paused, pauseOffset *is* the position — keeps the highlight
            // correct after seeking without playing.
            const currentTime = songPosition();
            const activeIdx = computeActiveIdx(currentTime);

            // Line classes and scrolling only change when the line changes; the word
            // sweep below runs every tick, so this early-return moved down.
            if (activeIdx !== lastActiveIdx) {
                const prevIdx = lastActiveIdx;
                lastActiveIdx = activeIdx;

                for (let i = 0; i < totalLines; i++) {
                    const el = document.getElementById('lyric-' + i);
                    if (!el) continue;
                    el.classList.remove('active', 'past', 'upcoming');
                    if (i === activeIdx) el.classList.add('active');
                    else if (activeIdx >= 0 && i < activeIdx) el.classList.add('past');
                    else el.classList.add('upcoming');
                }

                // Leaving a line: clear its word states so scrubbing back looks clean.
                if (prevIdx >= 0) clearWordStates(prevIdx);
                lastWordKey = '';

                if (activeIdx >= 0 && Date.now() - userScrolledAt >= USER_SCROLL_GRACE_MS) {
                    scrollLyricsTo(activeIdx);
                }
            }

            updateWordHighlight(activeIdx, currentTime);
        }

        function clearWordStates(lineIdx) {
            const line = document.getElementById('lyric-' + lineIdx);
            if (!line) return;
            line.querySelectorAll('.lyrics-word').forEach(w =>
                w.classList.remove('sung', 'singing'));
        }

        // Sweep words inside the active line. Words before the playhead read as sung,
        // the current one is emphasised. Writes to the DOM only when the boundary
        // actually moves, so a 50ms tick costs almost nothing.
        function updateWordHighlight(activeIdx, currentTime) {
            if (activeIdx < 0) return;
            const line = document.getElementById('lyric-' + activeIdx);
            if (!line) return;
            const words = line.querySelectorAll('.lyrics-word');
            if (!words.length) return;

            let cur = -1;
            for (let i = 0; i < words.length; i++) {
                const s = parseFloat(words[i].dataset.s);
                const e = parseFloat(words[i].dataset.e);
                if (currentTime >= s && currentTime < e) { cur = i; break; }
                if (currentTime >= e) cur = i;      // past it; hold until the next starts
                else break;
            }

            const key = activeIdx + ':' + cur;
            if (key === lastWordKey) return;
            lastWordKey = key;

            words.forEach((w, i) => {
                w.classList.toggle('singing', i === cur);
                w.classList.toggle('sung', i < cur);
            });
        }

        function scrollLyricsTo(idx) {
            const container = document.getElementById('lyricsContent');
            const el = document.getElementById('lyric-' + idx);
            if (!container || !el) return;
            const target = el.offsetTop - (container.clientHeight / 2) + (el.offsetHeight / 2);
            const max = container.scrollHeight - container.clientHeight;
            container.scrollTo({
                top: Math.max(0, Math.min(target, max)),
                behavior: 'smooth'
            });
        }

        function togglePlay() {
            if (isPlaying) pausePlayback();
            else startPlayback();
        }

        // The four stems are mixed through Web Audio, which both iOS and
        // Android suspend when the screen sleeps — so a song stops mid-verse
        // with nobody touching anything. A wake lock keeps the screen awake
        // while something is playing. It does NOT survive the user switching
        // apps; nothing short of an <audio> element would, and that cannot mix
        // four stems live.
        let wakeLock = null;

        async function keepScreenAwake() {
            if (!('wakeLock' in navigator) || wakeLock) return;
            try {
                wakeLock = await navigator.wakeLock.request('screen');
                // The browser drops it whenever the page is hidden; clear our
                // handle so the visibility handler can take a fresh one.
                wakeLock.addEventListener('release', () => { wakeLock = null; });
            } catch (e) {
                // Denied, unsupported, or the tab was already hidden. Playback
                // is unaffected — the screen just may sleep.
                console.warn('wake lock unavailable', e);
            }
        }

        function releaseScreenAwake() {
            if (!wakeLock) return;
            try { wakeLock.release(); } catch (e) {}
            wakeLock = null;
        }

        // Coming back to the tab re-takes the lock, since the browser released
        // it on the way out.
        document.addEventListener('visibilitychange', () => {
            // A save wants the screen awake for the same reason playback does:
            // the browser dropped the lock on the way out, and a throttled tab
            // downloads 3.6GB at a crawl.
            if (document.visibilityState === 'visible' && (isPlaying || offlineBusy)) {
                keepScreenAwake();
            }
        });

        /* Stems -> masterGain -> tempo shifter -> speakers.
         *
         * The shifter only ever raises pitch; the slowing is done by the source
         * nodes themselves. See tempo-worklet.js for why it cannot be the other
         * way round. */
        function ensureMasterBus() {
            if (masterGain) return;
            masterGain = audioCtx.createGain();
            masterGain.connect(audioCtx.destination);
            if (!audioCtx.audioWorklet) return;   // old browser: speed stays 1x
            const ctx = audioCtx;
            ctx.audioWorklet.addModule('tempo-worklet.js').then(() => {

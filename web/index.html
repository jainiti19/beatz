    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #fafafa;
            color: #1c1b1f;
            height: 100vh;
            overflow: hidden;
        }

        /* Top bar */
        .topbar {
            background: linear-gradient(135deg, #00897B, #43A047);
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .topbar h1 { font-size: 22px; }
        .topbar .now-playing { font-size: 13px; opacity: 0.9; }

        /* Three-panel layout */
        .panels {
            display: flex;
            height: calc(100vh - 50px);
        }

        /* Left panel — Songs & Playlists */
        .panel-left {
            flex: 1;
            background: white;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .search-box {
            padding: 10px;
            border-bottom: 1px solid #e0e0e0;
        }
        .search-box input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }
        .search-box input:focus { border-color: #00897B; }
        .search-box { position: relative; }
        /* Sized for a thumb, not a cursor: this is the control someone reaches
           for mid-song with a phone in one hand. */
        .search-clear {
            position: absolute;
            right: 14px; top: 50%; transform: translateY(-50%);
            width: 30px; height: 30px;
            border: none; background: transparent;
            color: #888; font-size: 20px; line-height: 1;
            cursor: pointer; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }
        .search-clear:hover { background: #eee; color: #333; }
        /* The way back to everything. Only shown while something is actually
           filtering -- a permanent "clear" reads as clutter, and there was no
           way at all to undo a search plus a playlist in one action. */
        .chip.chip-clear {
            border-color: #B4551C; color: #B4551C; font-weight: 600;
        }
        .chip.chip-clear:hover { background: #F7EBE1; }
        .chip-del {
            margin-left: 6px; opacity: 0.75; font-weight: 700;
        }
        .chip-del:hover { opacity: 1; }
        /* Requests bell. The laptop processes a song minutes after it is asked
           for, so the person who asked needs somewhere to find out what became
           of it without shouting across the room. */
        .bell-btn {
            position: relative; background: transparent; color: #fff; cursor: pointer;
            border: 1px solid rgba(255,255,255,.35); border-radius: 6px;
            padding: 5px 10px; font-size: 12px; margin-right: 8px;
        }
        .bell-btn:hover { border-color: #fff; }
        .bell-badge {
            background: #e53935; color: #fff; border-radius: 9px; font-size: 10px;
            padding: 1px 5px; margin-left: 6px; font-weight: 700;
        }
        .bell-panel {
            position: absolute; top: 46px; right: 12px; width: min(320px, 88vw);
            background: #1e1e1e; border: 1px solid #333; border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,.5); z-index: 60; overflow: hidden;
        }
        .bell-head {
            display: flex; justify-content: space-between; align-items: center;
            padding: 9px 12px; font-size: 12px; color: #aaa;
            border-bottom: 1px solid #333;
        }
        .bell-head button {
            background: none; border: none; color: #00897B; cursor: pointer; font-size: 11px;
        }
        /* The panel is dark and the two forms were built for the light page,
           so they get inverted here rather than being restyled everywhere. */
        .bell-actions { border-bottom: 1px solid #333; }
        .bell-actions .request-box { padding: 9px 12px; border-top: none; }
        .bell-actions .request-box + .request-box { border-top: 1px solid #262626; }
        .bell-actions .request-box summary { color: #4DB6AC; font-size: 12px; }
        .bell-actions .request-box input,
        .bell-actions .request-box textarea {
            background: #262626; border: 1px solid #3a3a3a; color: #e0e0e0;
        }
        .bell-actions .request-box input::placeholder,
        .bell-actions .request-box textarea::placeholder { color: #777; }
        .bell-actions .request-note { color: #9e9e9e; }
        .bell-hint { padding: 9px 12px; font-size: 11px; color: #777; }

        .bell-item { padding: 10px 12px; border-bottom: 1px solid #262626; font-size: 13px; }
        .bell-item:last-child { border-bottom: none; }
        .bell-item .st { font-size: 11px; margin-top: 2px; }
        .st.done { color: #4caf50; }
        .st.queued { color: #999; }
        .st.duplicate { color: #ffb300; }
        .st.failed { color: #ef5350; }
        .bell-empty { padding: 16px 12px; color: #777; font-size: 12px; text-align: center; }
        .brand-logo {
            width: 30px; height: 30px; border-radius: 7px; display: block;
            flex: none; margin-right: 9px;
        }
        body.big-screen .brand-logo { display: none; }
        .song-sub { font-size: 11px; color: #777; margin-top: 2px; }

        .playlist-chips {
            display: flex;
            gap: 4px;
            padding: 8px 10px;
            overflow-x: auto;
            border-bottom: 1px solid #eee;
            flex-shrink: 0;
        }
        .chip {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            cursor: pointer;
            white-space: nowrap;
            border: 1px solid #00897B;
            color: #00897B;
            background: white;
        }
        .chip.active { background: #00897B; color: white; }
        .chip:hover { background: #E0F2F1; }
        .chip.active:hover { background: #00796B; }

        .song-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0;
        }
        .song-item {
            padding: 10px 12px;
            cursor: pointer;
            border-bottom: 1px solid #f5f5f5;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }
        .song-item:hover { background: #E0F2F1; }
        .song-item.active { background: #00897B; color: white; }
        .song-item.active:hover { background: #00796B; }
        .song-item .song-name { flex: 1; }
        .song-item .song-playlists { font-size: 10px; color: #00897B; }
        .song-item.active .song-playlists { color: #B2DFDB; }
        .song-count { padding: 6px 12px; font-size: 11px; color: #999; }
        .request-box { padding: 10px; border-top: 1px solid #e0e0e0; }
        .request-box summary {
            font-size: 12px; color: #00897B; cursor: pointer; outline: none;
        }
        .request-box input {
            width: 100%; padding: 8px 12px; margin-top: 8px;
            border: 1px solid #ccc; border-radius: 8px; font-size: 13px;
            outline: none;
        }
        .request-box input:focus { border-color: #00897B; }
        .request-box button {
            width: 100%; margin-top: 8px; padding: 8px;
            background: #00897B; color: #fff; border: none;
            border-radius: 8px; font-size: 13px; cursor: pointer;
        }
        .request-box button:disabled { background: #9e9e9e; cursor: default; }
        .request-note { margin-top: 8px; font-size: 11px; color: #666; }
        .request-box textarea {
            width: 100%; margin-top: 8px; padding: 8px 12px;
            border: 1px solid #ccc; border-radius: 8px; font-size: 13px;
            font-family: inherit; outline: none; resize: vertical;
        }
        .request-box textarea:focus { border-color: #00897B; }

        /* Middle panel — Player */
        .panel-center {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px;
            overflow-y: auto;
        }
        .player-title {
            font-size: 20px;
            font-weight: 600;
            color: #00897B;
            margin-bottom: 4px;
        }
        .loading { font-size: 13px; color: #999; margin-bottom: 8px; }

        .seek-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 8px 0;
        }
        .seek-row input[type="range"] { flex: 1; accent-color: #00897B; }
        .time { font-size: 12px; color: #666; min-width: 40px; }

        .transport {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin: 8px 0;
        }
        .btn {
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .btn-play { width: 52px; height: 52px; background: #00897B; font-size: 20px; }
        .btn-stop { width: 36px; height: 36px; background: #888; font-size: 14px; }
        .btn:hover { opacity: 0.85; }

        /* ===== Report a fault =====
         * Both of 2 Sep's mismatched songs were found by Iti playing them and
         * noticing; every automatic check had passed one of them as "good".
         * The room hears these before any script does. */
        .player-head { display: flex; align-items: center; gap: 6px; }
        .player-head .player-title { flex: 1; min-width: 0; }
        .flag-btn {
            flex: 0 0 auto; border: none; background: none; cursor: pointer;
            color: #b0bec5; font-size: 15px; line-height: 1;
            padding: 7px 9px; border-radius: 6px;
        }
        .flag-btn:hover { background: #ECEFF1; color: #78909C; }
        .flag-btn.open { background: #FFEBEE; color: #C62828; }
        .report-box {
            border: 1px solid #e0e0e0; border-radius: 8px;
            padding: 10px; margin: 6px 0; background: #fafafa;
        }
        .report-reasons { display: flex; flex-wrap: wrap; gap: 6px; }
        .report-reason {
            flex: 1 1 auto; min-height: 34px; padding: 6px 10px;
            border: 1px solid #cfd8dc; border-radius: 6px; background: white;
            color: #455a64; font-size: 12px; cursor: pointer; white-space: nowrap;
        }
        .report-reason.active { background: #C62828; border-color: #C62828; color: #fff; }
        .report-box input {
            width: 100%; padding: 8px 10px; margin-top: 8px;
            border: 1px solid #ccc; border-radius: 8px; font-size: 13px; outline: none;
        }
        .report-send {
            margin-top: 8px; padding: 8px 14px; border: none; border-radius: 8px;
            background: #00897B; color: #fff; font-size: 13px; cursor: pointer;
        }
        .report-send:disabled { opacity: .5; cursor: default; }

        /* Enter the lyrics view from beside the sound controls, which is where
           you are when you want it. The topbar button stays, but only ON the
           stage, where it is the way out -- a phone has no Escape key. */
        .btn-expand {
            width: 40px; height: 40px; border-radius: 50%;
            background: #ECEFF1; color: #455A64; font-size: 15px;
        }
        .btn-expand:hover { background: #CFD8DC; }

        .presets {
            display: flex;
            gap: 4px;
            margin: 6px 0;
        }
        /* Four modes now, so they share the row rather than each demanding a
           comfortable width — min-width:0 lets them shrink instead of wrapping
           to a second line on a narrow phone. */
        .preset-btn {
            flex: 1;
            min-width: 0;
            padding: 6px 4px;
            border: 1px solid #00897B;
            border-radius: 6px;
            background: white;
            color: #00897B;
            cursor: pointer;
            font-size: 11px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .preset-btn:hover { background: #E0F2F1; }
        .preset-btn.active { background: #00897B; color: white; }

        .tempo-row {
            display: flex;
            align-items: center;
            gap: 4px;
            margin: 6px 0;
        }
        .tempo-label {
            font-size: 11px;
            color: #666;
            flex: 0 0 auto;
            padding-right: 2px;
        }
        /* Sized to its label rather than stretched across the row, and 30px
           tall. It was 40px and flex:1 on the argument that it gets used
           mid-song -- true, but six of them stretched edge to edge dominated
           the player, and Iti asked for the row back. Still comfortably above
           the 23px chips that were the actual too-small case. */
        .tempo-btn {
            flex: 0 1 auto;
            min-width: 0;
            min-height: 30px;
            padding: 5px 10px;
            border: 1px solid #00897B;
            border-radius: 6px;
            background: white;
            color: #00897B;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
        }
        .tempo-btn:hover { background: #E0F2F1; }
        .tempo-btn.active { background: #00897B; color: white; }

        /* Up next */
        .up-next {
            background: #E8F5E9;
            border-radius: 8px;
            padding: 8px 12px;
            margin: 8px 0;
            display: flex;
            align-items: center;
            font-size: 13px;
        }
        .up-next .label { color: #666; font-size: 11px; margin-right: 8px; }
        .up-next .next-name { flex: 1; font-weight: 500; }
        .up-next .skip-btn {
            padding: 4px 10px;
            border: 1px solid #00897B;
            border-radius: 6px;
            background: white;
            color: #00897B;
            cursor: pointer;
            font-size: 11px;
        }

        /* Collapsible sections */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            padding: 8px 0;
            font-weight: 600;
            font-size: 14px;
            color: #333;
            border-bottom: 1px solid #eee;
            margin-top: 8px;
        }
        .section-content { padding: 6px 0; }

        .stem-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
        }
        .stem-name { font-size: 13px; font-weight: 500; min-width: 80px; }
        .stem-row input[type="range"] { flex: 1; accent-color: #00897B; }
        .stem-vol { font-size: 12px; min-width: 35px; text-align: right; color: #666; }

        /* Save setup */
        .save-row {
            display: flex;
            gap: 6px;
            margin: 8px 0;
        }
        .save-btn {
            padding: 6px 12px;
            border: 1px solid #00897B;
            border-radius: 6px;
            background: white;
            color: #00897B;
            cursor: pointer;
            font-size: 12px;
        }
        .save-btn:hover { background: #E0F2F1; }
        .preset-indicator {
            font-size: 11px;
            color: #00897B;
            padding: 4px 0;
        }

        /* Right panel — Lyrics */
        .panel-right {
            flex: 1;
            background: white;
            border-left: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }
        .lyrics-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            font-weight: 600;
            font-size: 14px;
            border-bottom: 1px solid #eee;
            color: #333;
        }
        .lyrics-content {
            flex: 1;
            overflow-y: auto;
            position: relative;   /* offsetTop of lines is measured against this */
            padding: 16px;
            font-size: 16px;
            line-height: 28px;
            white-space: pre-wrap;
            color: #333;
        }
        .script-toggle {
            border: 1px solid #00897B;
            border-radius: 6px;
            background: white;
            color: #00897B;
            cursor: pointer;
            font-size: 11px;
            padding: 3px 8px;
            font-weight: 500;
        }
        .script-toggle:hover { background: #E0F2F1; }
        .script-toggle.on { background: #00897B; color: white; }
        /* Offline library row. Lives in the song-list rail, which the stage
           drops entirely, so it needs no big-screen rule of its own. */
        .offline-row {
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
            padding: 6px 10px; font-size: 12px; color: #46685c;
        }
        .offline-btn {
            border: 1px solid #bcd6cb; background: #f2f8f5; color: #17604a;
            border-radius: 999px; padding: 7px 12px; font-size: 12px;
            cursor: pointer; min-height: 34px;
        }
        .offline-btn:disabled { opacity: .55; cursor: default; }
        .offline-btn.armed { background: #17604a; color: #fff; border-color: #17604a; }
        .offline-note { color: #6b8a7d; }
        .lyric-roman { display: none; }
        /* Lyrics live on the stage, not the landing page: at desk size the pane
           was a narrow light-on-white column nobody read, and it pushed the
           song list and player apart. body.big-screen re-shows it below. */
        .panel-right { display: none; }
        .pp-backdrop {
            position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 60;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .pp-card {
            background: #fff; border-radius: 12px; width: min(340px, 100%);
            max-height: 70vh; overflow-y: auto; padding: 14px;
            box-shadow: 0 10px 40px rgba(0,0,0,.25);
        }
        .pp-head { font-weight: 600; margin-bottom: 10px; font-size: 14px; }
        .pp-row {
            display: flex; align-items: center; gap: 10px; width: 100%;
            background: none; border: none; border-radius: 8px; cursor: pointer;
            padding: 11px 8px; font-size: 14px; text-align: left; min-height: 44px;
        }
        .pp-row:hover { background: #f2f8f5; }
        .pp-row.on { color: #17604a; font-weight: 600; }
        .pp-tick { width: 16px; color: #17604a; }
        .pp-empty { color: #888; font-size: 13px; padding: 8px; }
        .pp-new {
            margin-top: 8px; width: 100%; min-height: 44px; cursor: pointer;
            background: #f2f8f5; border: 1px solid #bcd6cb; border-radius: 8px;
            color: #17604a; font-size: 13px;
        }
        .add-pl {
            font-size: 17px; line-height: 1; cursor: pointer; padding: 4px 8px;
            color: #17604a; border-radius: 6px; min-width: 30px; text-align: center;
        }
        .add-pl:hover { background: #e8f3ee; }
        .up-next { display: none; }
        .up-next.is-on { display: flex; }
        .no-lyrics { color: #999; font-style: italic; font-size: 14px; }
        .lyrics-line {
            padding: 6px 8px;
            border-radius: 6px;
            /* Colour only — animating font-size would move every line below the
               active one while the scroll animation is still running. */
            transition: color 0.3s ease, background-color 0.3s ease;
            color: #888;
            font-size: 16px;
            line-height: 26px;
        }
        .lyrics-line.active {
            color: #00897B;
            font-weight: 600;
            font-size: 20px;
            background: #E0F2F1;
        }
        .lyrics-line.past {
            color: #aaa;
        }
        .lyrics-line.upcoming {
            color: #555;
        }
        /* Word sweep, only meaningful on the active line. Colour-only transition —
           changing weight or size here would reflow the line mid-sweep. */
        .lyrics-word { transition: color 0.12s linear; }
        .lyrics-line.active .lyrics-word          { color: #7aa8a3; }
        .lyrics-line.active .lyrics-word.sung     { color: #00695C; }
        .lyrics-line.active .lyrics-word.singing  {
            color: #00251a;
            background: #A7E0D8;
            border-radius: 4px;
            box-shadow: 0 0 0 2px #A7E0D8;
        }

        /* Empty state */
        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            font-size: 15px;
        }

        /* Lyric-quality marker in the song list. Red means the words on screen
           are wrong or missing — Whisper garbage, or a four-line stub. Amber
           means the words are right but the timing wanders: crushed lines, or
           one line stretched over a whole passage. No dot means it is fine.
           Graded by scripts/check-lyrics-quality.py into songs.json. */
        .lyric-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 7px;
            vertical-align: middle;
            flex: none;
        }
        .lyric-dot.bad   { background: #e53935; }
        .lyric-dot.check { background: #f9a825; }

        /* ---- Phone layout ----------------------------------------------
           The three panels are side by side on a desktop, which leaves each
           one about 120px wide on a phone — unusable. Below 820px they stack
           into one scrolling column in the order you actually work in:
           pick a song, drive the controls, set the mix, then read the words.

           The panels are already in that order in the DOM, so this is a
           direction change rather than a reordering — no `order` juggling,
           and the tab sequence stays correct for anyone on a keyboard.

           Two heights stay capped on purpose. The song list would otherwise
           run to 61 entries and push the controls off the bottom of the
           screen. And #lyricsContent must remain its own bounded scroller:
           scrollToLyricLine() centres the active line using
           container.clientHeight and scrolls the container itself, so if it
           grew to fit the page instead, the word sweep would stop following
           the singer.                                                      */
        /* ===== Lyrics view (class name stays .big-screen) =====
           A projector in a dim room washes out white, and the normal 16px
           lyric pane is unreadable past about a metre. This is the same three
           panels rearranged by grid — lyrics as the stage, the player panel as
           a rail beneath it, the song list as the room's panel on the right —
           so the lyric sync code underneath is untouched. */
        .screen-btn {
            border: 1px solid rgba(255,255,255,0.55);
            border-radius: 6px; background: transparent; color: white;
            font-size: 12px; padding: 4px 10px; cursor: pointer; margin-left: 12px;
        }
        .screen-btn:hover { background: rgba(255,255,255,0.15); }
        .screen-btn.dark {
            border-color: #2C3E3B; color: #6E8B87; margin: 14px 0 0; width: 100%;
            padding: 8px; font-size: 14px;
        }
        .screen-btn.dark:hover { background: #1B2624; }
        .bs-head, .bs-foot { display: none; }

        /* Only above the phone breakpoint. A phone is never the projected
           display, and the grid this sets up collapses into nonsense at
           390px — these rules outrank the phone block on specificity, so
           they have to be switched off here rather than overridden. */
        /* ===== The stage =====
         *
         * One layout for every screen, with no breakpoint at all. The screen
         * this lands on is not knowable: mirroring a phone to a television
         * sends the PHONE's canvas, so the stage has to hold at 390x844, at
         * 905x412 when the phone is turned sideways, and at 1920x1080 when the
         * tab is cast properly. The previous stage was gated at min-width:821px
         * -- which a phone in landscape passes, with a third of the height that
         * gate was promising, and 80px type in 412px is why it looked broken.
         *
         * Type is min(vh, vw): vh alone sizes to the height and runs off the
         * side of a narrow screen, vw alone collapses on a short wide one. The
         * clamps stop a tiny viewport going illegible and a huge one comical.
         */
        body.big-screen {
            background: #0E1413; color: #E6EDEC; overflow: hidden;
            display: flex; flex-direction: column; height: 100dvh;
            --bs-now:    clamp(20px, min(7.2vh, 8.5vw), 96px);
            --bs-line:   clamp(13px, min(4.2vh, 5vw), 52px);
            --bs-roman:  clamp(11px, min(3.1vh, 3.8vw), 38px);
            --bs-chrome: clamp(11px, min(2.4vh, 3vw), 22px);
            --bs-pad:    clamp(8px, 2.2vh, 30px);
        }

        /* The topbar becomes the stage's title: the song, and nothing else the
           room has to read. The way out appears with the controls -- a phone
           has no Escape key, and the rail that used to carry "Leave lyrics view"
           is gone. */
        body.big-screen .topbar {
            background: transparent; box-shadow: none; border: none;
            padding: var(--bs-pad) calc(var(--bs-pad) * 1.4) 0;
            display: flex; align-items: center; gap: 12px;
            flex: 0 0 auto; position: relative; z-index: 3;
        }
        body.big-screen .topbar h1,
        body.big-screen .bell-btn,
        body.big-screen .bell-panel { display: none; }
        body.big-screen .now-playing {
            font-size: var(--bs-chrome); color: #6E8B87; flex: 1 1 auto;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        /* The topbar no longer carries a way in or out. Both live on the one
           button beside the transport, which toggles: an expand icon on the
           player, a list icon on the stage. The topbar button was only ever
           reachable with the control sheet open -- which is exactly when the
           transport is reachable too -- so it was pure duplication. */
        body.big-screen .panels {
            flex: 1 1 auto; min-height: 0;
            display: flex; flex-direction: column; overflow: hidden;
        }
        /* The song list and the request URL leave the stage. On a mirrored
           phone there is no width for a rail, and lyrics that fit beat a rail
           nobody in the room can read. */
        body.big-screen .panel-left { display: none; }
        body.big-screen .panel-right {
            /* Explicit display, because the pane is display:none off-stage now.
               Every other child of this grid is placed by hand for the same
               reason -- inheriting a default here is what breaks the stage. */
            display: flex; flex-direction: column;
            flex: 1 1 auto; min-height: 0; overflow: hidden;
            border: none; background: transparent; padding: 0;
        }
        body.big-screen .lyrics-header { display: none; }
        body.big-screen .lyrics-content {
            height: 100%; overflow-y: auto; scrollbar-width: none;
            /* Half-viewport padding rather than justify-content:center -- a
               centred flex column with overflow cannot be scrolled back to its
               start, so the sung line ends up above the top of the pane. */
            padding: 45vh calc(var(--bs-pad) * 1.4);
            display: flex; flex-direction: column;
            gap: calc(var(--bs-pad) * 0.55);
        }
        body.big-screen .lyrics-content::-webkit-scrollbar { display: none; }
        body.big-screen .lyrics-line {
            font-size: var(--bs-line); line-height: 1.25; color: #3D4B47;
            text-align: center; padding: 0; max-width: 100%;
            overflow-wrap: break-word; background: transparent;
        }
        body.big-screen .lyrics-line.past { color: #2B3534; }
        body.big-screen .lyrics-line.upcoming { color: #4A5453; }
        body.big-screen .lyrics-line.active {
            font-size: var(--bs-now); line-height: 1.2; color: #4DB6AC;
            background: transparent; font-weight: 600;
        }
        body.big-screen .lyrics-word.sung { color: #80CBC4; }
        body.big-screen .lyrics-word.singing { color: #B2DFDB; }
        /* Romanised echo, only under the line being sung. Hidden by default
           everywhere, or it renders under every line. */
        body.big-screen .lyric-roman { display: none; }
        body.big-screen .lyrics-line.active .lyric-roman {
            display: block; font-size: var(--bs-roman); line-height: 1.4;
            font-weight: 400; color: #6E8B87; margin-top: 0.35em;
            letter-spacing: 0.4px;
        }

        /* The controls are the same DOM as always -- every handler keeps
           working -- moved into a sheet that sits off screen until asked for.
           When the phone is being mirrored this is the only control surface
           that exists, so it cannot simply be hidden. */
        body.big-screen .panel-center {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 4;
            /* Opaque, not nearly-opaque: at 0.97 the lyrics ghosted through
               the faders and read as a rendering fault. */
            background: #0D1412;
            border-top: 1px solid #223230; border-radius: 0;
            padding: var(--bs-pad) calc(var(--bs-pad) * 1.4) calc(var(--bs-pad) * 1.3);
            max-height: 72dvh; overflow-y: auto;
            transform: translateY(101%);
            transition: transform 200ms ease;
        }
        body.big-screen.controls-open .panel-center { transform: translateY(0); }
        @media (prefers-reduced-motion: reduce) {
            body.big-screen .panel-center { transition: none; }
        }
        body.big-screen #playerContent {
            display: flex; flex-direction: column; gap: calc(var(--bs-pad) * 0.65);
        }
        body.big-screen .player-head,
        body.big-screen .player-title,
        body.big-screen .save-row,
        body.big-screen .preset-indicator,
        body.big-screen .section-header,
        body.big-screen .loading { display: none; }
        /* updateUpNext() sets style="display:flex" inline, which beats any
           stylesheet rule -- hence !important. loadLyrics() sets pasteBox the
           same way, and a "Replace the lyrics" link has no business on a wall. */
        /* loadLyrics() still sets pasteBox inline, and "Replace the lyrics"
           has no business on a wall. */
        body.big-screen #pasteBox { display: none !important; }
        /* A fault form has no business on a wall. The expand button DOES
           stay: on the stage it becomes the way back, in the same place, so
           the one control toggles between the two views. */
        body.big-screen .report-box { display: none !important; }
        body.big-screen .btn-expand {
            width: 40px; height: 40px; font-size: 15px;
            background: #37474F; color: #B0BEC5;
        }
        body.big-screen .btn-expand:hover { background: #455A64; }
        /* Up next belongs on the stage: when a phone is mirrored this sheet is
           the only control surface there is, so without it nobody can move the
           room to the next song without leaving the stage. */
        body.big-screen .up-next.is-on {
            display: flex; align-items: center; gap: 10px;
            background: transparent; border: 1px solid #2C3E3B; border-radius: 8px;
            padding: 8px 10px; margin: 0;
        }
        body.big-screen .up-next .label { color: #4A5453; font-size: var(--bs-chrome); }
        body.big-screen .up-next .next-name { color: #6E8B87; font-size: var(--bs-chrome); }
        body.big-screen .up-next .skip-btn {
            background: #00897B; color: #fff; border: none; border-radius: 6px;
            padding: 9px 16px; font-size: var(--bs-chrome); min-height: 40px; cursor: pointer;
        }
        body.big-screen .seek-row { display: flex; align-items: center; gap: 10px; margin: 0; }
        body.big-screen .seek-row input[type="range"] { height: 20px; }
        body.big-screen .time { font-size: var(--bs-chrome); color: #6E8B87; min-width: 3.4em; }
        body.big-screen .transport { display: flex; gap: 16px; margin: 0; }
        body.big-screen .btn-play { width: 54px; height: 54px; font-size: 21px; }
        body.big-screen .btn-stop { width: 40px; height: 40px; font-size: 15px; background: #37474F; }
        body.big-screen .presets,
        body.big-screen .tempo-row { display: flex; gap: 7px; margin: 0; }
        body.big-screen .preset-btn,
        body.big-screen .tempo-btn {
            border-color: #2C3E3B; background: transparent; color: #6E8B87;
            font-size: var(--bs-chrome); padding: 9px 6px;
            flex: 1 1 0; min-width: 0; min-height: 40px;
        }
        /* The speed buttons are sized to their labels here as they are on the
           main screen. Six of them stretched edge to edge is the shape the
           main player just moved away from, and the stage had kept it -- the
           two read as different apps. Type stays at --bs-chrome: this sheet
           gets used at arm's length from a mirrored phone, or across a room.
           Six short labels also leave the row shorter than the presets above
           it, so it is pushed to the left rather than centred by the gap. */
        body.big-screen .tempo-row { justify-content: flex-start; }
        body.big-screen .tempo-btn {
            flex: 0 1 auto;
            padding: 9px 14px;
        }
        body.big-screen .preset-btn:hover,
        body.big-screen .tempo-btn:hover { background: #1B2624; }
        body.big-screen .preset-btn.active,
        body.big-screen .tempo-btn.active {
            background: #00897B; color: white; border-color: #00897B;
        }
        body.big-screen .tempo-label { color: #4A5453; font-size: var(--bs-chrome); }
        /* Forced open, and allowed to wrap: the mixer is a collapsible section
           whose .section-content rule would otherwise win on specificity. Four
           faders sit in a row on a wide sheet and stack on a phone. */
        body.big-screen #mixerSection {
            display: flex !important; flex-wrap: wrap; gap: 9px 22px; padding: 0;
        }
        body.big-screen .stem-row { flex: 1 1 210px; padding: 0; }
        body.big-screen .stem-name { font-size: var(--bs-chrome); color: #6E8B87; min-width: 4.8em; }
        body.big-screen .stem-vol { font-size: var(--bs-chrome); color: #55605F; }

        @media (max-width: 820px) {
            body {
                height: auto;
                overflow-y: auto;
                overflow-x: hidden;
            }

            /* Two rows, not a stack: identity left, buttons right, and the
               song on its own line underneath. As a left-aligned column every
               item took a line of its own -- five lines of bar above a song
               list that only has a third of the screen to begin with. */
            .topbar {
                position: sticky;
                top: 0;
                z-index: 10;
                display: grid;
                grid-template-columns: auto minmax(0, 1fr) auto;
                align-items: center;
                column-gap: 8px;
                row-gap: 2px;
                padding: 8px 14px;
            }
            .topbar .brand-logo { grid-column: 1; grid-row: 1; margin-right: 0; }
            .topbar h1 {
                grid-column: 2; grid-row: 1; font-size: 18px;
                min-width: 0; overflow: hidden;
                text-overflow: ellipsis; white-space: nowrap;
            }
            .topbar .bell-btn { grid-column: 3; grid-row: 1; margin-right: 0; }
            .topbar .now-playing {
                grid-column: 1 / -1;
                grid-row: 2;
                font-size: 12px;
                /* One long title must not push the bar to three lines. */
                max-width: 100%;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .panels {
                flex-direction: column;
                height: auto;
            }

            /* 1. Songs */
            .panel-left {
                flex: none;
                border-right: none;
                border-bottom: 1px solid #e0e0e0;
            }
            .song-list {
                flex: none;
                max-height: 34vh;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }
            .song-item { padding: 13px 14px; font-size: 15px; }

            /* 2. Controls  +  3. Stem mixer (both live in the centre panel) */
            .panel-center {
                flex: none;
                overflow: visible;
                padding: 14px;
            }
            .player-title { font-size: 18px; }

            /* 4. Lyrics */
            .panel-right {
                flex: none;
                border-left: none;
                border-top: 1px solid #e0e0e0;
            }
            .lyrics-content {
                flex: none;
                height: 52vh;
                -webkit-overflow-scrolling: touch;
            }

            /* Touch targets. A 4px slider thumb is hard to catch with a
               thumb mid-song, and the stem faders get used constantly. */
            input[type="range"] { height: 30px; }
            .stem-row { padding: 8px 0; }
            .stem-name { min-width: 70px; font-size: 14px; }
            .btn {
                min-width: 56px;
                min-height: 48px;
                font-size: 20px;
            }
            /* Secondary to play and stop, so it does not take their size --
               .btn's phone minimums would otherwise override the base rule. */
            .btn-expand {
                min-width: 40px;
                min-height: 40px;
                width: 40px;
                height: 40px;
                font-size: 15px;
            }
            .save-btn, .skip-btn {
                min-height: 42px;
                padding: 8px 14px;
                font-size: 14px;
            }
            /* 32px rather than the 44px touch minimum, at Iti's request: two
               full-width 44px rows sat between the transport and the mixer and
               made the player taller than the song list. These are picked once
               at the start of a song, not hunted for mid-verse -- unlike the
               faders below, which keep their large targets. */
            .preset-btn {
                min-height: 32px;
                padding: 5px 6px;
                font-size: 11px;
            }
            .tempo-btn { min-height: 30px; font-size: 11px; }
            .section-header { padding: 12px 0; font-size: 15px; }
            .search-box input { padding: 12px; font-size: 15px; }
            /* The stage used to be hidden here because it was built for a
               desktop and leaked badly onto a phone. It now sizes itself, and
               a phone mirrored to a television is the main reason to have it. */
            .screen-btn { font-size: 11px; padding: 5px 8px; }

            /* ===== Landing on a phone is the song list, and nothing else =====
             *
             * Before a song is picked, the player and the lyric pane are both
             * empty states saying "Select a song" -- and between them they
             * pushed "Request a song" most of a screen below the fold. You
             * arrived, saw a third of a song list, and had to scroll past two
             * placeholders to ask for anything.
             *
             * So the two empty panels are not rendered until there is
             * something to put in them. The list then owns the screen and the
             * request row sits at the bottom of it, always in reach.
             *
             * :not(.big-screen) matters: the stage deliberately shows the
             * centre panel, and these rules sit LATER in the file than the
             * stage's, so at equal specificity they would win and blank it.
             * The same trap that leaked big-screen CSS onto phones in August.
             */
            body.no-song:not(.big-screen) {
                display: flex;
                flex-direction: column;
                /* dvh, not vh: vh is the height WITHOUT the browser's own
                   chrome, so the request row would sit under the address bar
                   on exactly the phones this is for. */
                height: 100dvh;
                overflow: hidden;
            }
            body.no-song:not(.big-screen) .panels {
                flex: 1 1 auto;
                height: auto;
                min-height: 0;
            }
            body.no-song:not(.big-screen) .panel-left {
                flex: 1 1 auto;
                min-height: 0;
                border-bottom: none;
            }
            body.no-song:not(.big-screen) .song-list {
                flex: 1 1 auto;
                max-height: none;
            }
            /* The lyric pane is already hidden everywhere but the stage
               (see .panel-right above), so only the player needs hiding. */
            body.no-song:not(.big-screen) .panel-center { display: none; }
        }
    </style>
</head>
<!-- no-song: on a phone this collapses the page to the song list alone. Set
     in the markup rather than by script so the empty panels never flash up
     before the first paint. Removed for good the first time a song is picked. -->

        <h1>BeatznBox</h1>
        <span class="now-playing" id="nowPlaying">Select a song to start</span>
        <button class="bell-btn" id="bellBtn" onclick="toggleBell()" title="Your requests">
            <span>Requests</span><span class="bell-badge" id="bellBadge" hidden>0</span>
        </button>
        <!-- Asking for a song and fixing its words both used to live down the
             page: the request form under the song list, the paste box in the
             player. Neither could be found without first picking a song, which
             is backwards for "the words are missing" and irrelevant for "please
             add this song". They are actions, so they hang off the one button
             in the bar that is always there. -->
        <div class="bell-panel" id="bellPanel" hidden>
            <div class="bell-actions">
                <div class="request-box">
                    <details id="requestPanel">
                        <summary>+ Request a song</summary>
                        <input type="text" id="reqSong" maxlength="120"
                               placeholder="Song name">
                        <input type="text" id="reqDetail" maxlength="120"
                               placeholder="Film or singer (helps find the lyrics)">
                        <input type="text" id="reqWho" maxlength="40"
                               placeholder="Your name (optional)">
                        <button id="reqBtn" onclick="submitRequest()">Send request</button>
                        <div class="request-note" id="reqNote"></div>
                    </details>
                </div>
                <div class="request-box" id="pasteBox" style="display:none">
                    <details id="pastePanel">
                        <summary id="pasteSummary">+ Paste lyrics for this song</summary>
                        <textarea id="pasteText" rows="6"
                                  placeholder="Paste the words, one line per sung line."></textarea>
                        <button id="pasteBtn" onclick="submitLyrics()">Send lyrics</button>
                        <div class="request-note" id="pasteNote"></div>
                    </details>
                </div>
                <!-- Pasting words is per song and cannot be otherwise, so when
                     nothing is playing this says so rather than offering a
                     form with nothing to attach itself to. -->
                <div class="bell-hint" id="pasteHint">Pick a song to paste or fix its words.</div>
            </div>
            <div class="bell-head">Your requests<button onclick="clearSeen()">Clear</button></div>
            <div id="bellList"></div>
        </div>
    </div>

    <div class="panels">
        <!-- Left: Songs & Playlists -->
        <div class="panel-left">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search song, film or singer..." oninput="filterSongs()">
                <button class="search-clear" id="searchClear" onclick="clearSearch()"
                        title="Clear search" aria-label="Clear search" hidden>&times;</button>
            </div>
            <div class="bs-head">
                <div class="bs-label">Now singing</div>
                <div class="bs-song" id="bsSong">—</div>
            </div>
            <div class="playlist-chips" id="playlistChips"></div>
            <div class="song-count" id="songCount"></div>
            <div class="offline-row" id="offlineRow" hidden></div>
            <div class="song-list" id="songList"></div>
            <div class="bs-foot">
                <div class="bs-label">Request a song</div>
                <div class="bs-url" id="bsUrl"></div>
                <button class="screen-btn dark" onclick="toggleBigScreen()">Leave lyrics view</button>
            </div>
        </div>

        <!-- Center: Player -->
        <div class="panel-center">
            <div id="playerContent">
                <div class="empty-state">Select a song to start</div>
            </div>
        </div>

        <!-- Right: Lyrics -->
        <div class="panel-right">
            <div class="lyrics-header">
                <span>Lyrics</span>
                <button class="script-toggle" id="scriptToggle" style="display:none"
                        onclick="toggleRoman()"></button>
            </div>
            <div class="lyrics-content" id="lyricsContent">
                <span class="no-lyrics">Select a song to view lyrics</span>
            </div>
        </div>
    </div>

    <script>
        const STEMS_BASE_URL = './stems';
        const stemUrl = (dir, file) =>
            `${STEMS_BASE_URL}/${encodeURIComponent(dir)}/${file}`;
        const STEM_NAMES = ['vocals', 'drums', 'bass', 'other'];

        /* Audio is now held on the device, and prepare-web.sh re-encodes to the
         * SAME filename when a song is reprocessed — which is exactly why the
         * Caddy header stops short of `immutable`. A held copy under a bare URL
         * would therefore be stale forever with nothing to bust it, so the URL
         * carries `rev`, the newest mp3 mtime, written into songs.json.
         * Looked up rather than kept in a map: `songs` is replaced wholesale by
         * refreshSongList(), and a map would be the thing that went stale. */
        const revOf = (dir) => {
            const s = songs.find((x) => x.dir === dir);
            return s && s.rev;
        };
        const audioUrl = (dir, stem) => {
            const rev = revOf(dir);
            return stemUrl(dir, `${stem}.mp3`) + (rev ? `?v=${rev}` : '');
        };

        /* ===== Where the audio actually comes from =====
         *
         * The origin is in Nuremberg and everyone using this is in Asia: 305ms
         * RTT against 120ms to Cloudflare's nearest edge, and 83-89% of a cold
         * song's load is the download. So the mp3s can come from an R2 Worker
         * instead -- but OPT IN, per session, with ?stems=edge. Twice on 2 Sep
         * hosting was changed under everybody at once and everybody lost the
         * site. Nobody's default moves until this has been proven on a phone.
         *
         * The Worker takes a signed token in the URL rather than the site
         * password. That is what lets it live on its own hostname: a browser
         * only sends an Authorization header to the origin that asked for it,
         * so a password-checking Worker had to sit in front of the live site,
         * and when it was wrong the live site was wrong. A token in the URL
         * travels anywhere, so the player is now untouchable from there.
         *
         * The hostname comes from the server, not from here: it carries an
         * account subdomain, and a page holding a stale one would fail in a
         * way indistinguishable from an outage.
         */
        // Default flipped to the edge on 2 Sep, after it was proven on Iti's
        // phone: zero .mp3 requests reached Nuremberg for a whole session,
        // against 13-20s per cold song before. ?stems=origin is the way back.
        // Safe to default because EVERY failure here degrades rather than
        // breaks -- no token, no edge configured, a 404, a 5xx, or a CORS
        // refusal all fall through to the origin, which holds every file.
        const STEMS_MODE = new URLSearchParams(location.search).get('stems') || 'edge';
        let edgeBase = null, stemToken = null;
        const edgeReady = (async () => {
            if (STEMS_MODE !== 'edge') return;
            try {
                // Same-origin and behind the same password, so the browser
                // attaches the credentials and only someone already logged in
                // can get a token.
                const r = await fetch('/api/stem-token', { credentials: 'include' });
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                const d = await r.json();
                if (d.ok && d.token && d.base) {
                    stemToken = d.token;
                    edgeBase = d.base.replace(/\/+$/, '');
                    console.info('stems: edge at', edgeBase);
                } else {
                    console.warn('stems: no edge configured — using the origin');
                }
            } catch (e) {
                // Never fatal. The origin serves every one of these files.
                console.warn('stems: could not get an edge token — using the origin', e);
            }
        })();

        /* A cache key is ALWAYS the origin URL, whoever served the bytes.
         * Otherwise switching ?stems= would orphan the whole held library, and
         * a token refresh would orphan it again a week later. */
        function toNet(url) {
            if (!edgeBase || !stemToken) return url;
            if (!/\.mp3(\?|$)/.test(url)) return url;   // audio only; lyrics and
                                                       // the manifest stay put
            const path = url.replace(/^\./, '');
            return edgeBase + path + (path.includes('?') ? '&' : '?')
                 + 't=' + encodeURIComponent(stemToken);
        }

        let audioCtx = null;
        let stems = {};
        // Compressed bytes for the song most likely to be picked next. Never
        // decoded here — see prefetchNext().
        let prefetched = { dir: null, bytes: null, ctrl: null };
        // Devanagari at singing tempo is unreadable for most of the room, and
        // the aligner already romanised every word to match the audio — so the
        // readable version costs nothing but a re-render.
        let pinnedRate = false;   // did we force the context to 44.1kHz?
        let romanMode = false;
        try { romanMode = localStorage.getItem('romanLyrics') === '1'; } catch (e) {}
        let gainNodes = {};
        let sourceNodes = {};
        let isPlaying = false;
        let wasPlayingBeforeSeek = false;
        let startTime = 0;
        let pauseOffset = 0;
        let songDuration = 0;
        let currentSongIndex = -1;
        // The dir of the song actually loaded, independent of its position in
        // `songs` — the manifest is refetched while a song plays.
        let currentSongDir = null;

        // Every other preset drops the vocal entirely, which is right for a
        // song the room knows cold and wrong for one it half knows — there is
        // nothing to come back to after a missed line. 'singalong' leaves the
        // original singer audible underneath rather than out front: enough to
        // find the line, quiet enough to sing over.
        const PRESETS = {
            singalong: { vocals: 30, drums: 75, bass: 80, other: 75 },
            karaoke:   { vocals: 0,  drums: 80, bass: 80, other: 80 },
            unplugged: { vocals: 0,  drums: 0,  bass: 80, other: 80 },
            jamming:   { vocals: 0,  drums: 70, bass: 80, other: 40 },
        };
        let seekInterval = null;
        let isLoading = false;
        // Practice speed. Everything downstream keeps working in *song* time;
        // only the two places that read the wall clock have to divide by this.
        const TEMPOS = [0.5, 0.6, 0.7, 0.8, 0.9, 1.0];
        let tempo = 1;
        let masterGain = null;   // stems mix here before the tempo shifter
        let tempoNode = null;
        let tempoReady = false;
        let pendingTempo = null;  // a saved setup restored before the worklet loaded
        let songs = [];
        let filteredSongs = [];
        let currentPreset = 'karaoke';

        // Playlists (stored in localStorage)
        // Playlists are shared across everyone's devices now: the server holds
        // them and localStorage is only the offline copy, so the set still shows
        // when the venue wifi is gone. Seeded from that copy so the first paint
        // has something before the fetch lands.
        let playlists = JSON.parse(localStorage.getItem('beatznbox_playlists') || '{}');
        let playlistRev = 0;
        // Names deleted on THIS device, so a merge after someone else's edit
        // does not resurrect them from the server's copy.
        const deletedPlaylists = new Set();
        let selectedPlaylist = null;

        // Session presets (stored in localStorage)
        let sessionPresets = JSON.parse(localStorage.getItem('beatznbox_presets') || '{}');

        // ===== Song List =====

        async function loadSongList() {
            try {
                // cache:'no-store' — every deploy adds songs to this file, and a
                // phone holding a cached copy just never sees the new ones. The
                // Caddy no-cache header only governs responses fetched after it
                // shipped, so copies cached before that stay stale forever.
                const resp = await fetch(STEMS_BASE_URL + '/songs.json',
                                         { cache: 'no-store' });
                songs = await resp.json();
            } catch (e) { songs = []; }
            filteredSongs = [...songs];
            renderPlaylistChips();
            renderSongList();
        }

        // The list used to be fetched exactly once, at startup — so a phone
        // left open never saw a song the watcher had published, and on a phone
        // "just reload" is not an obvious gesture: switching apps and back
        // does not do it. Refresh on returning to the page, and slowly while
        // it is open.
        async function refreshSongList({ quiet = true } = {}) {
            let incoming;
            try {
                const resp = await fetch(STEMS_BASE_URL + '/songs.json',
                                         { cache: 'no-store' });
                if (!resp.ok) return 0;
                incoming = await resp.json();
            } catch (e) { return 0; }
            if (!Array.isArray(incoming) || incoming.length === 0) return 0;

            const known = new Set(songs.map(s => s.dir));
            const added = incoming.filter(s => !known.has(s.dir)).length;
            const graded = JSON.stringify(incoming.map(s => s.dir + s.lyrics))
                        !== JSON.stringify(songs.map(s => s.dir + s.lyrics));
            if (!added && !graded) return 0;

            // Re-point at whatever is playing by NAME. currentSongIndex is an
            // index into `songs`, and a new manifest can order things
            // differently — a song added alphabetically above the current one
            // shifts every index below it.
            songs = incoming;
            if (currentSongDir) {
                const i = songs.findIndex(s => s.dir === currentSongDir);
                // Still playing something the manifest no longer lists: leave
                // the audio alone rather than silently selecting a neighbour.
                currentSongIndex = i;
            }
            filterSongs();          // re-applies the search box and playlist chip
            updateUpNext();
            if (added && !quiet) {
                const el = document.getElementById('songCount');
                if (el) el.textContent =
                    `${filteredSongs.length} songs · ${added} new`;
            }
            return added;
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') refreshSongList({ quiet: false });
        });

        function isFiltering() {
            const box = document.getElementById('searchInput');
            return !!selectedPlaylist || !!(box && box.value.trim());
        }

        function clearSearch() {
            const box = document.getElementById('searchInput');
            if (box) box.value = '';
            filterSongs();
            if (box) box.focus();
        }

        /* Both filters at once. Clearing a search and then hunting for the All
           chip is two operations for one intention. */
        function clearFilters() {
            const box = document.getElementById('searchInput');
            if (box) box.value = '';
            selectedPlaylist = null;
            renderPlaylistChips();
            filterSongs();
        }

        function deletePlaylist(name) {
            if (!confirm(`Delete the playlist "${name}"? The songs stay in the library.`)) return;
            delete playlists[name];
            deletedPlaylists.add(name);
            if (selectedPlaylist === name) selectedPlaylist = null;
            savePlaylists();
            renderPlaylistChips();
            filterSongs();
        }

        function renderPlaylistChips() {
            const el = document.getElementById('playlistChips');
            const esc = (t) => String(t).replace(/'/g, "\\'").replace(/"/g, '&quot;');
            let html = '';
            html += `<span class="chip ${selectedPlaylist === null ? 'active' : ''}" onclick="selectPlaylist(null)">All</span>`;
            for (const name of Object.keys(playlists)) {
                const on = selectedPlaylist === name;
                // The delete cross only appears on the playlist you are already
                // looking at, so a mis-tap on a crowded row cannot bin one.
                html += `<span class="chip ${on ? 'active' : ''}" onclick="selectPlaylist('${esc(name)}')">${name}`
                     +  (on ? `<span class="chip-del" onclick="event.stopPropagation();deletePlaylist('${esc(name)}')" title="Delete playlist">&times;</span>` : '')
                     +  `</span>`;
            }
            html += `<span class="chip" onclick="createPlaylist()">+</span>`;
            // Only offered once something is actually saved, or it reads as a
            // filter that always empties the list.

            el.innerHTML = html;
        }

        function selectPlaylist(name) {
            selectedPlaylist = name;
            // Saved and the playlists sit in the same row and look alike, so
            // they read as one either/or group -- but they used to AND
            // together, which meant picking a playlist while Saved was on
            // showed the intersection and you had to unclick Saved first.
            savedOnly = false;
            renderPlaylistChips();
            filterSongs();
        }

        function createPlaylist() {
            const name = prompt('New playlist name:');
            if (name && name.trim()) {
                playlists[name.trim()] = [];
                savePlaylists();
                renderPlaylistChips();
            }
        }

        // credentials:'include' is explicit rather than relying on the default.
        // These requests MUST carry the login: one that does not comes back 401
        // and the browser reopens its password prompt over a page that is
        // already signed in.
        async function loadPlaylists() {
            try {
                const r = await fetch('/api/playlists',
                                      { cache: 'no-store', credentials: 'include' });
                if (!r.ok) return;
                const d = await r.json();
                playlists = d.playlists || {};
                playlistRev = d.rev || 0;
                localStorage.setItem('beatznbox_playlists', JSON.stringify(playlists));
                renderPlaylistChips();
                filterSongs();
            } catch (e) {
                // Offline, or the queue service is down. The localStorage copy
                // is already loaded, so the set still works -- it just will not
                // pick up anyone else's changes until the next successful load.
                console.warn('playlists: using the local copy', e);
            }
        }

        async function savePlaylists() {
            localStorage.setItem('beatznbox_playlists', JSON.stringify(playlists));
            const body = () => JSON.stringify({ playlists, rev: playlistRev });
            try {
                let r = await fetch('/api/playlists', { method: 'POST', credentials: 'include',
                    headers: { 'Content-Type': 'application/json' }, body: body() });
                if (r.status === 409) {
                    // Someone edited from another phone between our load and
                    // our save. Keep both: their lists, ours winning on names
                    // we hold, minus whatever we deleted here.
                    const d = await r.json();
                    const merged = Object.assign({}, d.playlists || {}, playlists);
                    for (const n of deletedPlaylists) delete merged[n];
                    playlists = merged;
                    playlistRev = d.rev || 0;
                    r = await fetch('/api/playlists', { method: 'POST', credentials: 'include',
                        headers: { 'Content-Type': 'application/json' }, body: body() });
                }
                if (r.ok) {
                    const d = await r.json();
                    playlists = d.playlists || {};
                    playlistRev = d.rev || 0;
                    localStorage.setItem('beatznbox_playlists', JSON.stringify(playlists));
                    renderPlaylistChips();
                }
            } catch (e) {
                console.warn('playlists: change kept locally, not shared', e);
            }
        }

        function filterSongs() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const x = document.getElementById('searchClear');
            if (x) x.hidden = !query;
            let list = songs;

            if (selectedPlaylist) {
                const playlistSongs = playlists[selectedPlaylist] || [];
                list = playlistSongs.map(dir => songs.find(s => s.dir === dir)).filter(Boolean);
            }

            // One box across title, film and singer: at a party people type
            // "Kishore" or "Dabangg" as readily as they type the song.
            if (savedOnly) list = list.filter(s => offlineDirs.has(s.dir));

            if (query) {
                list = list.filter(s => {
                    const hay = [s.name, s.film || '', ...(s.singers || [])].join(' ').toLowerCase();
                    return hay.includes(query);
                });
            }

            filteredSongs = list;
            // The Clear chip appears and disappears with the filter it undoes.
            renderSongList();
        }

        function renderSongList() {
            const el = document.getElementById('songList');
            document.getElementById('songCount').textContent = `${filteredSongs.length} songs`;
            renderOffline();          // the offer depends on which songs are listed

            if (filteredSongs.length === 0) {
                el.innerHTML = '<div style="padding:20px;color:#999;text-align:center">No songs found</div>';
                return;
            }

            el.innerHTML = filteredSongs.map((song, i) => {
                const globalIdx = songs.indexOf(song);
                const isActive = globalIdx === currentSongIndex;
                const songPlaylists = Object.keys(playlists).filter(p => playlists[p].includes(song.dir));
                // A dot rather than a word: the list is scanned, not read, and
                // the point is to stop re-discovering a bad song mid-performance.
                const dot = song.lyrics === 'bad'
                    ? `<span class="lyric-dot bad" title="Lyrics unusable — ${song.lyricsNote || ''}"></span>`
                    : song.lyrics === 'check'
                    ? `<span class="lyric-dot check" title="Lyrics need checking — ${song.lyricsNote || ''}"></span>`
                    : '';
                return `<div class="song-item ${isActive ? 'active' : ''}" onclick="selectSong(${globalIdx})">
                    <div style="flex:1">
                        <div class="song-name">${dot}${song.name}</div>
                        ${(song.film || (song.singers || []).length)
                            ? `<div class="song-sub">${[song.film, (song.singers || [])[0]].filter(Boolean).join(' · ')}</div>`
                            : ''}
                        ${songPlaylists.length ? `<div class="song-playlists">${songPlaylists.join(', ')}</div>` : ''}
                    </div>
                    <span class="add-pl" title="Add to a playlist" aria-label="Add to a playlist" onclick="event.stopPropagation();addToPlaylist(${globalIdx})">+</span>
                </div>`;
            }).join('');
        }

        /* Picking, not typing. This used to be prompt() with the names listed
           in the message, so adding a song meant reading a playlist name and
           re-typing it exactly -- and a typo silently did nothing, because the
           old code only acted when the string matched a key. It also could only
           add, so removing meant going into edit mode on the playlist. */
        function addToPlaylist(songIdx) {
            const song = songs[songIdx];
            closePlaylistPicker();
            const names = Object.keys(playlists);
            const rows = names.map((n) => {
                const on = playlists[n].includes(song.dir);
                return `<button class="pp-row${on ? ' on' : ''}" onclick="togglePlaylistMember(${songIdx}, ${JSON.stringify(n).replace(/"/g, '&quot;')})">`
                     + `<span class="pp-tick">${on ? '&#10003;' : ''}</span>`
                     + `<span class="pp-name"></span></button>`;
            }).join('');
            const el = document.createElement('div');
            el.className = 'pp-backdrop';
            el.id = 'playlistPicker';
            el.onclick = (e) => { if (e.target === el) closePlaylistPicker(); };
            el.innerHTML = `<div class="pp-card" role="dialog" aria-label="Add to a playlist">
                    <div class="pp-head"></div>
                    <div class="pp-rows">${rows || '<div class="pp-empty">No playlists yet</div>'}</div>
                    <button class="pp-new" onclick="newPlaylistFor(${songIdx})">+ New playlist</button>
                </div>`;
            document.body.appendChild(el);
            // textContent, not interpolation: song and playlist names are data.
            el.querySelector('.pp-head').textContent = song.name;
            [...el.querySelectorAll('.pp-row')].forEach((b, i) => {
                b.querySelector('.pp-name').textContent = names[i];
            });
        }

        function closePlaylistPicker() {
            const el = document.getElementById('playlistPicker');
            if (el) el.remove();
        }

        function togglePlaylistMember(songIdx, name) {
            const song = songs[songIdx];
            const list = playlists[name];
            if (!list) return;
            const at = list.indexOf(song.dir);
            if (at >= 0) list.splice(at, 1); else list.push(song.dir);
            savePlaylists();
            renderSongList();
            addToPlaylist(songIdx);        // reopen, so several can be ticked
        }

        function newPlaylistFor(songIdx) {
            const name = prompt('New playlist name:');
            closePlaylistPicker();
            if (!name || !name.trim()) return;
            const n = name.trim();
            if (!playlists[n]) playlists[n] = [];
            if (!playlists[n].includes(songs[songIdx].dir)) playlists[n].push(songs[songIdx].dir);
            savePlaylists();
            renderPlaylistChips();
            renderSongList();
        }

        // ===== Player =====

        // opts.autoplay   — start as soon as the stems are decoded
        // opts.inheritMix  — carry the current fader positions across, instead
        //                    of resetting to a preset. Both are set when one
        //                    song rolls into the next on its own: nobody asked
        //                    for a change, so nothing should change.
        async function selectSong(index, opts = {}) {
            if (currentSongIndex === index) return;
            if (isLoading) return;

            // Read the mix before tearing the graph down.
            const carriedMix = opts.inheritMix ? currentMix() : null;

            // Fully stop and disconnect everything
            stopPlayback();
            for (const stem of STEM_NAMES) {
                if (gainNodes[stem]) {
                    gainNodes[stem].disconnect();
                    gainNodes[stem] = null;
                }
            }
            stems = {};
            sourceNodes = {};

            currentSongIndex = index;
            // There is something to show now, so the player and the lyric pane
            // come back. On a phone they were never rendered until this point.
            const wasLanding = document.body.classList.contains('no-song');
            document.body.classList.remove('no-song');
            if (wasLanding && window.matchMedia('(max-width: 820px)').matches) {
                // Only on the FIRST pick. The controls did not exist a moment
                // ago, so without this you tap a song and the thing you were
                // sent to is below the fold. On later picks the player is
                // already on screen and moving the page would just be rude.
                requestAnimationFrame(() => {
                    const el = document.querySelector('.panel-center');
                    // No behavior:'smooth'. Measured on 3 Sep: with 'smooth'
                    // the page did not move at all, while the default jumped
                    // correctly. An animation that silently no-ops is worse
                    // than no animation.
                    if (el) el.scrollIntoView({ block: 'start' });
                });
            }
            const song = songs[index];
            currentSongDir = song.dir;
            isLoading = true;

            document.getElementById('nowPlaying').textContent = song.name;
            document.getElementById('bsSong').textContent = song.name;
            renderSongList();

            document.getElementById('playerContent').innerHTML = `
                <div class="player-head">
                    <div class="player-title">${song.name}</div>
                    <button class="flag-btn" id="flagBtn" onclick="toggleReport()"
                            title="Report a problem with this song"
                            aria-label="Report a problem with this song">&#9873;</button>
                </div>
                <div class="report-box" id="reportBox" hidden>
                    <div class="report-reasons">
                        <button class="report-reason" data-reason="wrong-song"
                                onclick="pickReason(this)">Wrong song</button>
                        <button class="report-reason" data-reason="lyrics"
                                onclick="pickReason(this)">Lyrics don't match</button>
                        <button class="report-reason" data-reason="quality"
                                onclick="pickReason(this)">Sound quality</button>
                        <button class="report-reason" data-reason="other"
                                onclick="pickReason(this)">Something else</button>
                    </div>
                    <input type="text" id="reportNote" maxlength="200"
                           placeholder="Anything worth knowing (optional)">
                    <button class="report-send" id="reportSend" onclick="sendReport()" disabled>Send</button>
                    <div class="request-note" id="reportResult"></div>
                </div>
                <div class="loading" id="loadingStatus">Loading stems...</div>
                <div class="seek-row">
                    <span class="time" id="currentTime">0:00</span>
                    <input type="range" id="seekBar" min="0" max="1000" value="0" oninput="seekTo(this.value)">
                    <span class="time" id="totalTime">0:00</span>
                </div>
                <div class="transport">
                    <button class="btn btn-stop" id="stopBtn" onclick="stopPlayback()">&#9632;</button>
                    <button class="btn btn-play" id="playBtn" onclick="togglePlay()">&#9654;</button>
                    <button class="btn btn-expand" onclick="toggleBigScreen()"
                            title="Lyrics view" aria-label="Lyrics view">&#9974;</button>
                </div>
                <div class="presets">
                    <button class="preset-btn" id="pre-singalong" onclick="applyPreset('singalong')">Sing along</button>
                    <button class="preset-btn" id="pre-karaoke" onclick="applyPreset('karaoke')">Karaoke</button>
                    <button class="preset-btn" id="pre-unplugged" onclick="applyPreset('unplugged')">Unplugged</button>
                    <button class="preset-btn" id="pre-jamming" onclick="applyPreset('jamming')">Jamming</button>
                </div>
                <div class="tempo-row" id="tempoRow" style="display:none">
                    <span class="tempo-label">Speed</span>
                    ${TEMPOS.map((t) => `<button class="tempo-btn" data-tempo="${t}" onclick="setTempo(${t})">${Math.round(t * 100) + '%'}</button>`).join('')}
                </div>
                <div class="up-next" id="upNext">
                    <span class="label">Up next:</span>
                    <span class="next-name" id="nextSongName"></span>
                    <button class="skip-btn" onclick="playNext({ autoplay: true })">Play</button>
                </div>
                <div class="section-header" onclick="toggleSection('mixer')">
                    <span>Stem Mixer</span><span id="mixerArrow">&#9650;</span>
                </div>
                <div class="section-content" id="mixerSection">
                    <div class="stem-row"><span class="stem-name">Vocals</span><input type="range" min="0" max="100" value="0" id="sl-vocals" oninput="setStemVol('vocals',this.value)"><span class="stem-vol" id="vol-vocals">0%</span></div>
                    <div class="stem-row"><span class="stem-name">Drums</span><input type="range" min="0" max="100" value="80" id="sl-drums" oninput="setStemVol('drums',this.value)"><span class="stem-vol" id="vol-drums">80%</span></div>
                    <div class="stem-row"><span class="stem-name">Bass</span><input type="range" min="0" max="100" value="80" id="sl-bass" oninput="setStemVol('bass',this.value)"><span class="stem-vol" id="vol-bass">80%</span></div>
                    <div class="stem-row"><span class="stem-name">Harmony</span><input type="range" min="0" max="100" value="80" id="sl-other" oninput="setStemVol('other',this.value)"><span class="stem-vol" id="vol-other">80%</span></div>
                </div>
                <div class="save-row">
                    <button class="save-btn" onclick="saveSetup()">Save Setup</button>
                    <button class="save-btn" onclick="clearSetup()" style="display:none" id="clearSetupBtn">Clear</button>
                </div>
                <div class="preset-indicator" id="presetIndicator"></div>
            `;

            // The template above ships fresh, enabled buttons, so the lock has
            // to go on after it — not when loading started.
            setTransportEnabled(false);

            // Show up next
            updateUpNext();

            // Stacked on a phone, the controls sit below a song list that fills
            // a third of the screen — so picking a song appears to do nothing.
            // Bring the player into view. Desktop keeps all three panels
            // visible at once and needs no scrolling.
            if (window.matchMedia('(max-width: 820px)').matches) {
                document.querySelector('.panel-center')
                        .scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

            // Init audio. Pin the context to the stems' own 44.1kHz: left to
            // pick its own rate it opens at 48k and resamples every stem on
            // decode, which measured 2707ms against 1344ms rate-matched, and
            // holds 421MB of PCM instead of 386MB. Decode is the floor on
            // load time, so this is the single biggest win available.
            if (!audioCtx) {
                try {
                    audioCtx = new AudioContext({ sampleRate: 44100 });
                    pinnedRate = true;
                } catch (e) {
                    // A browser may refuse a rate its hardware cannot open.
                    // Correct playback at 48k beats no playback at 44.1k.
                    console.warn('44.1kHz context unavailable, using default', e);
                    audioCtx = new AudioContext();
                }
            }

            ensureMasterBus();

            // Load stems, all four at once. Serially this cost four round
            // trips plus four decodes with no overlap — each decode blocked
            // the next download — which is where the 10-15s wait came from.
            let loaded = 0;
            const pre = (prefetched.dir === song.dir) ? prefetched.bytes : null;
            // A prefetch for some *other* song is now dead weight: nothing will
            // ever read those bytes, but they are still on the wire competing
            // with the four stems we actually need. prefetchNext only aborted
            // the previous prefetch when starting the next one, so picking out
            // of list order -- which is what a room calling out songs does --

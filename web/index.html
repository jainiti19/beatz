    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #fafafa;
            color: #1c1b1f;
            height: 100vh;
            overflow: hidden;
        }

        /* Top bar */
        .topbar {
            background: linear-gradient(135deg, #00897B, #43A047);
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .topbar h1 { font-size: 22px; }
        .topbar .now-playing { font-size: 13px; opacity: 0.9; }

        /* Three-panel layout */
        .panels {
            display: flex;
            height: calc(100vh - 50px);
        }

        /* Left panel — Songs & Playlists */
        .panel-left {
            flex: 1;
            background: white;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .search-box {
            padding: 10px;
            border-bottom: 1px solid #e0e0e0;
        }
        .search-box input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }
        .search-box input:focus { border-color: #00897B; }
        .search-box { position: relative; }
        /* Sized for a thumb, not a cursor: this is the control someone reaches
           for mid-song with a phone in one hand. */
        .search-clear {
            position: absolute;
            right: 14px; top: 50%; transform: translateY(-50%);
            width: 30px; height: 30px;
            border: none; background: transparent;
            color: #888; font-size: 20px; line-height: 1;
            cursor: pointer; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }
        .search-clear:hover { background: #eee; color: #333; }
        /* The way back to everything. Only shown while something is actually
           filtering -- a permanent "clear" reads as clutter, and there was no
           way at all to undo a search plus a playlist in one action. */
        .chip.chip-clear {
            border-color: #B4551C; color: #B4551C; font-weight: 600;
        }
        .chip.chip-clear:hover { background: #F7EBE1; }
        .chip-del {
            margin-left: 6px; opacity: 0.75; font-weight: 700;
        }
        .chip-del:hover { opacity: 1; }
        /* Requests bell. The laptop processes a song minutes after it is asked
           for, so the person who asked needs somewhere to find out what became
           of it without shouting across the room. */
        .bell-btn {
            position: relative; background: transparent; color: #fff; cursor: pointer;
            border: 1px solid rgba(255,255,255,.35); border-radius: 6px;
            padding: 5px 10px; font-size: 12px; margin-right: 8px;
        }
        .bell-btn:hover { border-color: #fff; }
        .bell-badge {
            background: #e53935; color: #fff; border-radius: 9px; font-size: 10px;
            padding: 1px 5px; margin-left: 6px; font-weight: 700;
        }
        .bell-panel {
            position: absolute; top: 46px; right: 12px; width: min(320px, 88vw);
            background: #1e1e1e; border: 1px solid #333; border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,.5); z-index: 60; overflow: hidden;
        }
        .bell-head {
            display: flex; justify-content: space-between; align-items: center;
            padding: 9px 12px; font-size: 12px; color: #aaa;
            border-bottom: 1px solid #333;
        }
        .bell-head button {
            background: none; border: none; color: #00897B; cursor: pointer; font-size: 11px;
        }
        .bell-item { padding: 10px 12px; border-bottom: 1px solid #262626; font-size: 13px; }
        .bell-item:last-child { border-bottom: none; }
        .bell-item .st { font-size: 11px; margin-top: 2px; }
        .st.done { color: #4caf50; }
        .st.queued { color: #999; }
        .st.duplicate { color: #ffb300; }
        .st.failed { color: #ef5350; }
        .bell-empty { padding: 16px 12px; color: #777; font-size: 12px; text-align: center; }
        .brand-logo {
            width: 30px; height: 30px; border-radius: 7px; display: block;
            flex: none; margin-right: 9px;
        }
        body.big-screen .brand-logo { display: none; }
        .song-sub { font-size: 11px; color: #777; margin-top: 2px; }

        .playlist-chips {
            display: flex;
            gap: 4px;
            padding: 8px 10px;
            overflow-x: auto;
            border-bottom: 1px solid #eee;
            flex-shrink: 0;
        }
        .chip {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            cursor: pointer;
            white-space: nowrap;
            border: 1px solid #00897B;
            color: #00897B;
            background: white;
        }
        .chip.active { background: #00897B; color: white; }
        .chip:hover { background: #E0F2F1; }
        .chip.active:hover { background: #00796B; }

        .song-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0;
        }
        .song-item {
            padding: 10px 12px;
            cursor: pointer;
            border-bottom: 1px solid #f5f5f5;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }
        .song-item:hover { background: #E0F2F1; }
        .song-item.active { background: #00897B; color: white; }
        .song-item.active:hover { background: #00796B; }
        .song-item .song-name { flex: 1; }
        .song-item .song-playlists { font-size: 10px; color: #00897B; }
        .song-item.active .song-playlists { color: #B2DFDB; }
        .song-count { padding: 6px 12px; font-size: 11px; color: #999; }
        .request-box { padding: 10px; border-top: 1px solid #e0e0e0; }
        .request-box summary {
            font-size: 12px; color: #00897B; cursor: pointer; outline: none;
        }
        .request-box input {
            width: 100%; padding: 8px 12px; margin-top: 8px;
            border: 1px solid #ccc; border-radius: 8px; font-size: 13px;
            outline: none;
        }
        .request-box input:focus { border-color: #00897B; }
        .request-box button {
            width: 100%; margin-top: 8px; padding: 8px;
            background: #00897B; color: #fff; border: none;
            border-radius: 8px; font-size: 13px; cursor: pointer;
        }
        .request-box button:disabled { background: #9e9e9e; cursor: default; }
        .request-note { margin-top: 8px; font-size: 11px; color: #666; }
        .request-box textarea {
            width: 100%; margin-top: 8px; padding: 8px 12px;
            border: 1px solid #ccc; border-radius: 8px; font-size: 13px;
            font-family: inherit; outline: none; resize: vertical;
        }
        .request-box textarea:focus { border-color: #00897B; }

        /* Middle panel — Player */
        .panel-center {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px;
            overflow-y: auto;
        }
        .player-title {
            font-size: 20px;
            font-weight: 600;
            color: #00897B;
            margin-bottom: 4px;
        }
        .loading { font-size: 13px; color: #999; margin-bottom: 8px; }

        .seek-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 8px 0;
        }
        .seek-row input[type="range"] { flex: 1; accent-color: #00897B; }
        .time { font-size: 12px; color: #666; min-width: 40px; }

        .transport {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin: 8px 0;
        }
        .btn {
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .btn-play { width: 52px; height: 52px; background: #00897B; font-size: 20px; }
        .btn-stop { width: 36px; height: 36px; background: #888; font-size: 14px; }
        .btn:hover { opacity: 0.85; }

        .presets {
            display: flex;
            gap: 4px;
            margin: 6px 0;
        }
        /* Four modes now, so they share the row rather than each demanding a
           comfortable width — min-width:0 lets them shrink instead of wrapping
           to a second line on a narrow phone. */
        .preset-btn {
            flex: 1;
            min-width: 0;
            padding: 6px 4px;
            border: 1px solid #00897B;
            border-radius: 6px;
            background: white;
            color: #00897B;
            cursor: pointer;
            font-size: 11px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .preset-btn:hover { background: #E0F2F1; }
        .preset-btn.active { background: #00897B; color: white; }

        .tempo-row {
            display: flex;
            align-items: center;
            gap: 4px;
            margin: 6px 0;
        }
        .tempo-label {
            font-size: 11px;
            color: #666;
            flex: 0 0 auto;
            padding-right: 2px;
        }
        /* Taller than the mode buttons on purpose: this one gets used mid-song
           with a phone in one hand, and the 23px chips elsewhere are already
           too small to hit. */
        .tempo-btn {
            flex: 1;
            min-width: 0;
            min-height: 40px;
            padding: 6px 2px;
            border: 1px solid #00897B;
            border-radius: 6px;
            background: white;
            color: #00897B;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
        }
        .tempo-btn:hover { background: #E0F2F1; }
        .tempo-btn.active { background: #00897B; color: white; }

        /* Up next */
        .up-next {
            background: #E8F5E9;
            border-radius: 8px;
            padding: 8px 12px;
            margin: 8px 0;
            display: flex;
            align-items: center;
            font-size: 13px;
        }
        .up-next .label { color: #666; font-size: 11px; margin-right: 8px; }
        .up-next .next-name { flex: 1; font-weight: 500; }
        .up-next .skip-btn {
            padding: 4px 10px;
            border: 1px solid #00897B;
            border-radius: 6px;
            background: white;
            color: #00897B;
            cursor: pointer;
            font-size: 11px;
        }

        /* Collapsible sections */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            padding: 8px 0;
            font-weight: 600;
            font-size: 14px;
            color: #333;
            border-bottom: 1px solid #eee;
            margin-top: 8px;
        }
        .section-content { padding: 6px 0; }

        .stem-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
        }
        .stem-name { font-size: 13px; font-weight: 500; min-width: 80px; }
        .stem-row input[type="range"] { flex: 1; accent-color: #00897B; }
        .stem-vol { font-size: 12px; min-width: 35px; text-align: right; color: #666; }

        /* Save setup */
        .save-row {
            display: flex;
            gap: 6px;
            margin: 8px 0;
        }
        .save-btn {
            padding: 6px 12px;
            border: 1px solid #00897B;
            border-radius: 6px;
            background: white;
            color: #00897B;
            cursor: pointer;
            font-size: 12px;
        }
        .save-btn:hover { background: #E0F2F1; }
        .preset-indicator {
            font-size: 11px;
            color: #00897B;
            padding: 4px 0;
        }

        /* Right panel — Lyrics */
        .panel-right {
            flex: 1;
            background: white;
            border-left: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }
        .lyrics-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            font-weight: 600;
            font-size: 14px;
            border-bottom: 1px solid #eee;
            color: #333;
        }
        .lyrics-content {
            flex: 1;
            overflow-y: auto;
            position: relative;   /* offsetTop of lines is measured against this */
            padding: 16px;
            font-size: 16px;
            line-height: 28px;
            white-space: pre-wrap;
            color: #333;
        }
        .script-toggle {
            border: 1px solid #00897B;
            border-radius: 6px;
            background: white;
            color: #00897B;
            cursor: pointer;
            font-size: 11px;
            padding: 3px 8px;
            font-weight: 500;
        }
        .script-toggle:hover { background: #E0F2F1; }
        .script-toggle.on { background: #00897B; color: white; }
        .lyric-roman { display: none; }
        .no-lyrics { color: #999; font-style: italic; font-size: 14px; }
        .lyrics-line {
            padding: 6px 8px;
            border-radius: 6px;
            /* Colour only — animating font-size would move every line below the
               active one while the scroll animation is still running. */
            transition: color 0.3s ease, background-color 0.3s ease;
            color: #888;
            font-size: 16px;
            line-height: 26px;
        }
        .lyrics-line.active {
            color: #00897B;
            font-weight: 600;
            font-size: 20px;
            background: #E0F2F1;
        }
        .lyrics-line.past {
            color: #aaa;
        }
        .lyrics-line.upcoming {
            color: #555;
        }
        /* Word sweep, only meaningful on the active line. Colour-only transition —
           changing weight or size here would reflow the line mid-sweep. */
        .lyrics-word { transition: color 0.12s linear; }
        .lyrics-line.active .lyrics-word          { color: #7aa8a3; }
        .lyrics-line.active .lyrics-word.sung     { color: #00695C; }
        .lyrics-line.active .lyrics-word.singing  {
            color: #00251a;
            background: #A7E0D8;
            border-radius: 4px;
            box-shadow: 0 0 0 2px #A7E0D8;
        }

        /* Empty state */
        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            font-size: 15px;
        }

        /* Lyric-quality marker in the song list. Red means the words on screen
           are wrong or missing — Whisper garbage, or a four-line stub. Amber
           means the words are right but the timing wanders: crushed lines, or
           one line stretched over a whole passage. No dot means it is fine.
           Graded by scripts/check-lyrics-quality.py into songs.json. */
        .lyric-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 7px;
            vertical-align: middle;
            flex: none;
        }
        .lyric-dot.bad   { background: #e53935; }
        .lyric-dot.check { background: #f9a825; }

        /* ---- Phone layout ----------------------------------------------
           The three panels are side by side on a desktop, which leaves each
           one about 120px wide on a phone — unusable. Below 820px they stack
           into one scrolling column in the order you actually work in:
           pick a song, drive the controls, set the mix, then read the words.

           The panels are already in that order in the DOM, so this is a
           direction change rather than a reordering — no `order` juggling,
           and the tab sequence stays correct for anyone on a keyboard.

           Two heights stay capped on purpose. The song list would otherwise
           run to 61 entries and push the controls off the bottom of the
           screen. And #lyricsContent must remain its own bounded scroller:
           scrollToLyricLine() centres the active line using
           container.clientHeight and scrolls the container itself, so if it
           grew to fit the page instead, the word sweep would stop following
           the singer.                                                      */
        /* ===== Big screen =====
           A projector in a dim room washes out white, and the normal 16px
           lyric pane is unreadable past about a metre. This is the same three
           panels rearranged by grid — lyrics as the stage, the player panel as
           a rail beneath it, the song list as the room's panel on the right —
           so the lyric sync code underneath is untouched. */
        .screen-btn {
            border: 1px solid rgba(255,255,255,0.55);
            border-radius: 6px; background: transparent; color: white;
            font-size: 12px; padding: 4px 10px; cursor: pointer; margin-left: 12px;
        }
        .screen-btn:hover { background: rgba(255,255,255,0.15); }
        .screen-btn.dark {
            border-color: #2C3E3B; color: #6E8B87; margin: 14px 0 0; width: 100%;
            padding: 8px; font-size: 14px;
        }
        .screen-btn.dark:hover { background: #1B2624; }
        .bs-head, .bs-foot { display: none; }

        /* Only above the phone breakpoint. A phone is never the projected
           display, and the grid this sets up collapses into nonsense at
           390px — these rules outrank the phone block on specificity, so
           they have to be switched off here rather than overridden. */
        /* ===== The stage =====
         *
         * One layout for every screen, with no breakpoint at all. The screen
         * this lands on is not knowable: mirroring a phone to a television
         * sends the PHONE's canvas, so the stage has to hold at 390x844, at
         * 905x412 when the phone is turned sideways, and at 1920x1080 when the
         * tab is cast properly. The previous stage was gated at min-width:821px
         * -- which a phone in landscape passes, with a third of the height that
         * gate was promising, and 80px type in 412px is why it looked broken.
         *
         * Type is min(vh, vw): vh alone sizes to the height and runs off the
         * side of a narrow screen, vw alone collapses on a short wide one. The
         * clamps stop a tiny viewport going illegible and a huge one comical.
         */
        body.big-screen {
            background: #0E1413; color: #E6EDEC; overflow: hidden;
            display: flex; flex-direction: column; height: 100dvh;
            --bs-now:    clamp(20px, min(7.2vh, 8.5vw), 96px);
            --bs-line:   clamp(13px, min(4.2vh, 5vw), 52px);
            --bs-roman:  clamp(11px, min(3.1vh, 3.8vw), 38px);
            --bs-chrome: clamp(11px, min(2.4vh, 3vw), 22px);
            --bs-pad:    clamp(8px, 2.2vh, 30px);
        }

        /* The topbar becomes the stage's title: the song, and nothing else the
           room has to read. The way out appears with the controls -- a phone
           has no Escape key, and the rail that used to carry "Leave big screen"
           is gone. */
        body.big-screen .topbar {
            background: transparent; box-shadow: none; border: none;
            padding: var(--bs-pad) calc(var(--bs-pad) * 1.4) 0;
            display: flex; align-items: center; gap: 12px;
            flex: 0 0 auto; position: relative; z-index: 3;
        }
        body.big-screen .topbar h1,
        body.big-screen .bell-btn,
        body.big-screen .bell-panel { display: none; }
        body.big-screen .now-playing {
            font-size: var(--bs-chrome); color: #6E8B87; flex: 1 1 auto;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        body.big-screen .screen-btn { display: none; }
        body.big-screen.controls-open .screen-btn {
            display: inline-block; font-size: var(--bs-chrome);
            background: transparent; border: 1px solid #2C3E3B; color: #6E8B87;
        }

        body.big-screen .panels {
            flex: 1 1 auto; min-height: 0;
            display: flex; flex-direction: column; overflow: hidden;
        }
        /* The song list and the request URL leave the stage. On a mirrored
           phone there is no width for a rail, and lyrics that fit beat a rail
           nobody in the room can read. */
        body.big-screen .panel-left { display: none; }
        body.big-screen .panel-right {
            flex: 1 1 auto; min-height: 0; overflow: hidden;
            border: none; background: transparent; padding: 0;
        }
        body.big-screen .lyrics-header { display: none; }
        body.big-screen .lyrics-content {
            height: 100%; overflow-y: auto; scrollbar-width: none;
            /* Half-viewport padding rather than justify-content:center -- a
               centred flex column with overflow cannot be scrolled back to its
               start, so the sung line ends up above the top of the pane. */
            padding: 45vh calc(var(--bs-pad) * 1.4);
            display: flex; flex-direction: column;
            gap: calc(var(--bs-pad) * 0.55);
        }
        body.big-screen .lyrics-content::-webkit-scrollbar { display: none; }
        body.big-screen .lyrics-line {
            font-size: var(--bs-line); line-height: 1.25; color: #3D4B47;
            text-align: center; padding: 0; max-width: 100%;
            overflow-wrap: break-word; background: transparent;
        }
        body.big-screen .lyrics-line.past { color: #2B3534; }
        body.big-screen .lyrics-line.upcoming { color: #4A5453; }
        body.big-screen .lyrics-line.active {
            font-size: var(--bs-now); line-height: 1.2; color: #4DB6AC;
            background: transparent; font-weight: 600;
        }
        body.big-screen .lyrics-word.sung { color: #80CBC4; }
        body.big-screen .lyrics-word.singing { color: #B2DFDB; }
        /* Romanised echo, only under the line being sung. Hidden by default
           everywhere, or it renders under every line. */
        body.big-screen .lyric-roman { display: none; }
        body.big-screen .lyrics-line.active .lyric-roman {
            display: block; font-size: var(--bs-roman); line-height: 1.4;
            font-weight: 400; color: #6E8B87; margin-top: 0.35em;
            letter-spacing: 0.4px;
        }

        /* The controls are the same DOM as always -- every handler keeps
           working -- moved into a sheet that sits off screen until asked for.
           When the phone is being mirrored this is the only control surface
           that exists, so it cannot simply be hidden. */
        body.big-screen .panel-center {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 4;
            /* Opaque, not nearly-opaque: at 0.97 the lyrics ghosted through
               the faders and read as a rendering fault. */
            background: #0D1412;
            border-top: 1px solid #223230; border-radius: 0;
            padding: var(--bs-pad) calc(var(--bs-pad) * 1.4) calc(var(--bs-pad) * 1.3);
            max-height: 72dvh; overflow-y: auto;
            transform: translateY(101%);
            transition: transform 200ms ease;
        }
        body.big-screen.controls-open .panel-center { transform: translateY(0); }
        @media (prefers-reduced-motion: reduce) {
            body.big-screen .panel-center { transition: none; }
        }
        body.big-screen #playerContent {
            display: flex; flex-direction: column; gap: calc(var(--bs-pad) * 0.65);
        }
        body.big-screen .player-title,
        body.big-screen .save-row,
        body.big-screen .preset-indicator,
        body.big-screen .section-header,
        body.big-screen .loading { display: none; }
        /* updateUpNext() sets style="display:flex" inline, which beats any
           stylesheet rule -- hence !important. loadLyrics() sets pasteBox the
           same way, and a "Replace the lyrics" link has no business on a wall. */
        body.big-screen .up-next,
        body.big-screen #pasteBox { display: none !important; }
        body.big-screen .seek-row { display: flex; align-items: center; gap: 10px; margin: 0; }
        body.big-screen .seek-row input[type="range"] { height: 20px; }
        body.big-screen .time { font-size: var(--bs-chrome); color: #6E8B87; min-width: 3.4em; }
        body.big-screen .transport { display: flex; gap: 16px; margin: 0; }
        body.big-screen .btn-play { width: 54px; height: 54px; font-size: 21px; }
        body.big-screen .btn-stop { width: 40px; height: 40px; font-size: 15px; background: #37474F; }
        body.big-screen .presets,
        body.big-screen .tempo-row { display: flex; gap: 7px; margin: 0; }
        body.big-screen .preset-btn,
        body.big-screen .tempo-btn {
            border-color: #2C3E3B; background: transparent; color: #6E8B87;
            font-size: var(--bs-chrome); padding: 9px 6px;
            flex: 1 1 0; min-width: 0; min-height: 40px;
        }
        body.big-screen .preset-btn:hover,
        body.big-screen .tempo-btn:hover { background: #1B2624; }
        body.big-screen .preset-btn.active,
        body.big-screen .tempo-btn.active {
            background: #00897B; color: white; border-color: #00897B;
        }
        body.big-screen .tempo-label { color: #4A5453; font-size: var(--bs-chrome); }
        /* Forced open, and allowed to wrap: the mixer is a collapsible section
           whose .section-content rule would otherwise win on specificity. Four
           faders sit in a row on a wide sheet and stack on a phone. */
        body.big-screen #mixerSection {
            display: flex !important; flex-wrap: wrap; gap: 9px 22px; padding: 0;
        }
        body.big-screen .stem-row { flex: 1 1 210px; padding: 0; }
        body.big-screen .stem-name { font-size: var(--bs-chrome); color: #6E8B87; min-width: 4.8em; }
        body.big-screen .stem-vol { font-size: var(--bs-chrome); color: #55605F; }

        @media (max-width: 820px) {
            body {
                height: auto;
                overflow-y: auto;
                overflow-x: hidden;
            }

            /* Two rows, not a stack: identity left, buttons right, and the
               song on its own line underneath. As a left-aligned column every
               item took a line of its own -- five lines of bar above a song
               list that only has a third of the screen to begin with. */
            .topbar {
                position: sticky;
                top: 0;
                z-index: 10;
                display: grid;
                grid-template-columns: auto minmax(0, 1fr) auto auto;
                align-items: center;
                column-gap: 8px;
                row-gap: 2px;
                padding: 8px 14px;
            }
            .topbar .brand-logo { grid-column: 1; grid-row: 1; margin-right: 0; }
            .topbar h1 {
                grid-column: 2; grid-row: 1; font-size: 18px;
                min-width: 0; overflow: hidden;
                text-overflow: ellipsis; white-space: nowrap;
            }
            .topbar .bell-btn { grid-column: 3; grid-row: 1; margin-right: 0; }
            .topbar .screen-btn { grid-column: 4; grid-row: 1; }
            .topbar .now-playing {
                grid-column: 1 / -1;
                grid-row: 2;
                font-size: 12px;
                /* One long title must not push the bar to three lines. */
                max-width: 100%;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .panels {
                flex-direction: column;
                height: auto;
            }

            /* 1. Songs */
            .panel-left {
                flex: none;
                border-right: none;
                border-bottom: 1px solid #e0e0e0;
            }
            .song-list {
                flex: none;
                max-height: 34vh;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }
            .song-item { padding: 13px 14px; font-size: 15px; }

            /* 2. Controls  +  3. Stem mixer (both live in the centre panel) */
            .panel-center {
                flex: none;
                overflow: visible;
                padding: 14px;
            }
            .player-title { font-size: 18px; }

            /* 4. Lyrics */
            .panel-right {
                flex: none;
                border-left: none;
                border-top: 1px solid #e0e0e0;
            }
            .lyrics-content {
                flex: none;
                height: 52vh;
                -webkit-overflow-scrolling: touch;
            }

            /* Touch targets. A 4px slider thumb is hard to catch with a
               thumb mid-song, and the stem faders get used constantly. */
            input[type="range"] { height: 30px; }
            .stem-row { padding: 8px 0; }
            .stem-name { min-width: 70px; font-size: 14px; }
            .btn {
                min-width: 56px;
                min-height: 48px;
                font-size: 20px;
            }
            .save-btn, .skip-btn {
                min-height: 42px;
                padding: 8px 14px;
                font-size: 14px;
            }
            /* Still a 44px target on a phone, but no wider than a quarter of
               the row — four of them have to fit. */
            .preset-btn {
                min-height: 44px;
                padding: 8px 6px;
                font-size: 12px;
            }
            .section-header { padding: 12px 0; font-size: 15px; }
            .search-box input { padding: 12px; font-size: 15px; }
            /* The stage used to be hidden here because it was built for a
               desktop and leaked badly onto a phone. It now sizes itself, and
               a phone mirrored to a television is the main reason to have it. */
            .screen-btn { font-size: 11px; padding: 5px 8px; }
        }
    </style>
</head>

        <h1>BeatznBox</h1>
        <span class="now-playing" id="nowPlaying">Select a song to start</span>
        <button class="bell-btn" id="bellBtn" onclick="toggleBell()" title="Your requests">
            <span>Requests</span><span class="bell-badge" id="bellBadge" hidden>0</span>
        </button>
        <div class="bell-panel" id="bellPanel" hidden>
            <div class="bell-head">Your requests<button onclick="clearSeen()">Clear</button></div>
            <div id="bellList"></div>
        </div>
        <button class="screen-btn" onclick="toggleBigScreen()" title="Big screen (Esc to leave)">Big screen</button>
    </div>

    <div class="panels">
        <!-- Left: Songs & Playlists -->
        <div class="panel-left">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search song, film or singer..." oninput="filterSongs()">
                <button class="search-clear" id="searchClear" onclick="clearSearch()"
                        title="Clear search" aria-label="Clear search" hidden>&times;</button>
            </div>
            <div class="bs-head">
                <div class="bs-label">Now singing</div>
                <div class="bs-song" id="bsSong">—</div>
            </div>
            <div class="playlist-chips" id="playlistChips"></div>
            <div class="song-count" id="songCount"></div>
            <div class="song-list" id="songList"></div>
            <div class="bs-foot">
                <div class="bs-label">Request a song</div>
                <div class="bs-url" id="bsUrl"></div>
                <button class="screen-btn dark" onclick="toggleBigScreen()">Leave big screen</button>
            </div>
            <div class="request-box">
                <details id="requestPanel">
                    <summary>+ Request a song</summary>
                    <input type="text" id="reqSong" maxlength="120"
                           placeholder="Song name">
                    <input type="text" id="reqDetail" maxlength="120"
                           placeholder="Film or singer (helps find the lyrics)">
                    <input type="text" id="reqWho" maxlength="40"
                           placeholder="Your name (optional)">
                    <button id="reqBtn" onclick="submitRequest()">Send request</button>
                    <div class="request-note" id="reqNote"></div>
                </details>
            </div>
        </div>

        <!-- Center: Player -->
        <div class="panel-center">
            <div id="playerContent">
                <div class="empty-state">Select a song to start</div>
            </div>
        </div>

        <!-- Right: Lyrics -->
        <div class="panel-right">
            <div class="lyrics-header">
                <span>Lyrics</span>
                <button class="script-toggle" id="scriptToggle" style="display:none"
                        onclick="toggleRoman()"></button>
            </div>
            <div class="lyrics-content" id="lyricsContent">
                <span class="no-lyrics">Select a song to view lyrics</span>
            </div>
            <div class="request-box" id="pasteBox" style="display:none">
                <details id="pastePanel">
                    <summary id="pasteSummary">+ Paste lyrics for this song</summary>
                    <textarea id="pasteText" rows="8"
                              placeholder="Paste the words, one line per sung line."></textarea>
                    <button id="pasteBtn" onclick="submitLyrics()">Send lyrics</button>
                    <div class="request-note" id="pasteNote"></div>

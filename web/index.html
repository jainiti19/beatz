    <script>
        const STEMS_BASE_URL = './stems';
        const stemUrl = (dir, file) =>
            `${STEMS_BASE_URL}/${encodeURIComponent(dir)}/${file}`;
        const STEM_NAMES = ['vocals', 'drums', 'bass', 'other'];

        let audioCtx = null;
        let stems = {};
        // Compressed bytes for the song most likely to be picked next. Never
        // decoded here — see prefetchNext().
        let prefetched = { dir: null, bytes: null, ctrl: null };
        // Devanagari at singing tempo is unreadable for most of the room, and
        // the aligner already romanised every word to match the audio — so the
        // readable version costs nothing but a re-render.
        let pinnedRate = false;   // did we force the context to 44.1kHz?
        let romanMode = false;
        try { romanMode = localStorage.getItem('romanLyrics') === '1'; } catch (e) {}
        let gainNodes = {};
        let sourceNodes = {};
        let isPlaying = false;
        let wasPlayingBeforeSeek = false;
        let startTime = 0;
        let pauseOffset = 0;
        let songDuration = 0;
        let currentSongIndex = -1;
        // The dir of the song actually loaded, independent of its position in
        // `songs` — the manifest is refetched while a song plays.
        let currentSongDir = null;

        // Every other preset drops the vocal entirely, which is right for a
        // song the room knows cold and wrong for one it half knows — there is
        // nothing to come back to after a missed line. 'singalong' leaves the
        // original singer audible underneath rather than out front: enough to
        // find the line, quiet enough to sing over.
        const PRESETS = {
            singalong: { vocals: 30, drums: 75, bass: 80, other: 75 },
            karaoke:   { vocals: 0,  drums: 80, bass: 80, other: 80 },
            unplugged: { vocals: 0,  drums: 0,  bass: 80, other: 80 },
            jamming:   { vocals: 0,  drums: 70, bass: 80, other: 40 },
        };
        let seekInterval = null;
        let isLoading = false;
        // Practice speed. Everything downstream keeps working in *song* time;
        // only the two places that read the wall clock have to divide by this.
        const TEMPOS = [0.5, 0.6, 0.7, 0.8, 0.9, 1.0];
        let tempo = 1;
        let masterGain = null;   // stems mix here before the tempo shifter
        let tempoNode = null;
        let tempoReady = false;
        let pendingTempo = null;  // a saved setup restored before the worklet loaded
        let songs = [];
        let filteredSongs = [];
        let currentPreset = 'karaoke';

        // Playlists (stored in localStorage)
        let playlists = JSON.parse(localStorage.getItem('beatznbox_playlists') || '{}');
        let selectedPlaylist = null;

        // Session presets (stored in localStorage)
        let sessionPresets = JSON.parse(localStorage.getItem('beatznbox_presets') || '{}');

        // ===== Song List =====

        async function loadSongList() {
            try {
                // cache:'no-store' — every deploy adds songs to this file, and a
                // phone holding a cached copy just never sees the new ones. The
                // Caddy no-cache header only governs responses fetched after it
                // shipped, so copies cached before that stay stale forever.
                const resp = await fetch(STEMS_BASE_URL + '/songs.json',
                                         { cache: 'no-store' });
                songs = await resp.json();
            } catch (e) { songs = []; }
            filteredSongs = [...songs];
            renderPlaylistChips();
            renderSongList();
        }

        // The list used to be fetched exactly once, at startup — so a phone
        // left open never saw a song the watcher had published, and on a phone
        // "just reload" is not an obvious gesture: switching apps and back
        // does not do it. Refresh on returning to the page, and slowly while
        // it is open.
        async function refreshSongList({ quiet = true } = {}) {
            let incoming;
            try {
                const resp = await fetch(STEMS_BASE_URL + '/songs.json',
                                         { cache: 'no-store' });
                if (!resp.ok) return 0;
                incoming = await resp.json();
            } catch (e) { return 0; }
            if (!Array.isArray(incoming) || incoming.length === 0) return 0;

            const known = new Set(songs.map(s => s.dir));
            const added = incoming.filter(s => !known.has(s.dir)).length;
            const graded = JSON.stringify(incoming.map(s => s.dir + s.lyrics))
                        !== JSON.stringify(songs.map(s => s.dir + s.lyrics));
            if (!added && !graded) return 0;

            // Re-point at whatever is playing by NAME. currentSongIndex is an
            // index into `songs`, and a new manifest can order things
            // differently — a song added alphabetically above the current one
            // shifts every index below it.
            songs = incoming;
            if (currentSongDir) {
                const i = songs.findIndex(s => s.dir === currentSongDir);
                // Still playing something the manifest no longer lists: leave
                // the audio alone rather than silently selecting a neighbour.
                currentSongIndex = i;
            }
            filterSongs();          // re-applies the search box and playlist chip
            updateUpNext();
            if (added && !quiet) {
                const el = document.getElementById('songCount');
                if (el) el.textContent =
                    `${filteredSongs.length} songs · ${added} new`;
            }
            return added;
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') refreshSongList({ quiet: false });
        });

        function isFiltering() {
            const box = document.getElementById('searchInput');
            return !!selectedPlaylist || !!(box && box.value.trim());
        }

        function clearSearch() {
            const box = document.getElementById('searchInput');
            if (box) box.value = '';
            filterSongs();
            if (box) box.focus();
        }

        /* Both filters at once. Clearing a search and then hunting for the All
           chip is two operations for one intention. */
        function clearFilters() {
            const box = document.getElementById('searchInput');
            if (box) box.value = '';
            selectedPlaylist = null;
            renderPlaylistChips();
            filterSongs();
        }

        function deletePlaylist(name) {
            if (!confirm(`Delete the playlist "${name}"? The songs stay in the library.`)) return;
            delete playlists[name];
            if (selectedPlaylist === name) selectedPlaylist = null;
            savePlaylists();
            renderPlaylistChips();
            filterSongs();
        }

        function renderPlaylistChips() {
            const el = document.getElementById('playlistChips');
            const esc = (t) => String(t).replace(/'/g, "\\'").replace(/"/g, '&quot;');
            let html = '';
            if (isFiltering()) {
                html += `<span class="chip chip-clear" onclick="clearFilters()">&times; Clear</span>`;
            }
            html += `<span class="chip ${selectedPlaylist === null ? 'active' : ''}" onclick="selectPlaylist(null)">All</span>`;
            for (const name of Object.keys(playlists)) {
                const on = selectedPlaylist === name;
                // The delete cross only appears on the playlist you are already
                // looking at, so a mis-tap on a crowded row cannot bin one.
                html += `<span class="chip ${on ? 'active' : ''}" onclick="selectPlaylist('${esc(name)}')">${name}`
                     +  (on ? `<span class="chip-del" onclick="event.stopPropagation();deletePlaylist('${esc(name)}')" title="Delete playlist">&times;</span>` : '')
                     +  `</span>`;
            }
            html += `<span class="chip" onclick="createPlaylist()">+</span>`;
            el.innerHTML = html;
        }

        function selectPlaylist(name) {
            selectedPlaylist = name;
            renderPlaylistChips();
            filterSongs();
        }

        function createPlaylist() {
            const name = prompt('New playlist name:');
            if (name && name.trim()) {
                playlists[name.trim()] = [];
                savePlaylists();
                renderPlaylistChips();
            }
        }

        function savePlaylists() {
            localStorage.setItem('beatznbox_playlists', JSON.stringify(playlists));
        }

        function filterSongs() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const x = document.getElementById('searchClear');
            if (x) x.hidden = !query;
            let list = songs;

            if (selectedPlaylist) {
                const playlistSongs = playlists[selectedPlaylist] || [];
                list = playlistSongs.map(dir => songs.find(s => s.dir === dir)).filter(Boolean);
            }

            // One box across title, film and singer: at a party people type
            // "Kishore" or "Dabangg" as readily as they type the song.
            if (query) {
                list = list.filter(s => {
                    const hay = [s.name, s.film || '', ...(s.singers || [])].join(' ').toLowerCase();
                    return hay.includes(query);
                });
            }

            filteredSongs = list;
            // The Clear chip appears and disappears with the filter it undoes.
            const chips = document.getElementById('playlistChips');
            if (chips && (chips.querySelector('.chip-clear') !== null) !== isFiltering()) {
                renderPlaylistChips();
            }
            renderSongList();
        }

        function renderSongList() {
            const el = document.getElementById('songList');
            document.getElementById('songCount').textContent = `${filteredSongs.length} songs`;

            if (filteredSongs.length === 0) {
                el.innerHTML = '<div style="padding:20px;color:#999;text-align:center">No songs found</div>';
                return;
            }

            el.innerHTML = filteredSongs.map((song, i) => {
                const globalIdx = songs.indexOf(song);
                const isActive = globalIdx === currentSongIndex;
                const songPlaylists = Object.keys(playlists).filter(p => playlists[p].includes(song.dir));
                // A dot rather than a word: the list is scanned, not read, and
                // the point is to stop re-discovering a bad song mid-performance.
                const dot = song.lyrics === 'bad'
                    ? `<span class="lyric-dot bad" title="Lyrics unusable — ${song.lyricsNote || ''}"></span>`
                    : song.lyrics === 'check'
                    ? `<span class="lyric-dot check" title="Lyrics need checking — ${song.lyricsNote || ''}"></span>`
                    : '';
                return `<div class="song-item ${isActive ? 'active' : ''}" onclick="selectSong(${globalIdx})">
                    <div style="flex:1">
                        <div class="song-name">${dot}${song.name}</div>
                        ${(song.film || (song.singers || []).length)
                            ? `<div class="song-sub">${[song.film, (song.singers || [])[0]].filter(Boolean).join(' · ')}</div>`
                            : ''}
                        ${songPlaylists.length ? `<div class="song-playlists">${songPlaylists.join(', ')}</div>` : ''}
                    </div>
                    <span style="font-size:11px;cursor:pointer;padding:4px" onclick="event.stopPropagation();addToPlaylist(${globalIdx})">+P</span>
                </div>`;
            }).join('');
        }

        function addToPlaylist(songIdx) {
            const song = songs[songIdx];
            const names = Object.keys(playlists);
            if (names.length === 0) {
                createPlaylist();
                return;
            }
            const name = prompt('Add to playlist:\n' + names.join(', '));
            if (name && playlists[name] !== undefined) {
                if (!playlists[name].includes(song.dir)) {
                    playlists[name].push(song.dir);
                    savePlaylists();
                    renderSongList();
                }
            }
        }

        // ===== Player =====

        // opts.autoplay   — start as soon as the stems are decoded
        // opts.inheritMix  — carry the current fader positions across, instead
        //                    of resetting to a preset. Both are set when one
        //                    song rolls into the next on its own: nobody asked
        //                    for a change, so nothing should change.
        async function selectSong(index, opts = {}) {
            if (currentSongIndex === index) return;
            if (isLoading) return;

            // Read the mix before tearing the graph down.
            const carriedMix = opts.inheritMix ? currentMix() : null;

            // Fully stop and disconnect everything
            stopPlayback();
            for (const stem of STEM_NAMES) {
                if (gainNodes[stem]) {
                    gainNodes[stem].disconnect();
                    gainNodes[stem] = null;
                }
            }
            stems = {};
            sourceNodes = {};

            currentSongIndex = index;
            const song = songs[index];
            currentSongDir = song.dir;
            isLoading = true;

            document.getElementById('nowPlaying').textContent = song.name;
            document.getElementById('bsSong').textContent = song.name;
            renderSongList();

            document.getElementById('playerContent').innerHTML = `
                <div class="player-title">${song.name}</div>
                <div class="loading" id="loadingStatus">Loading stems...</div>
                <div class="seek-row">
                    <span class="time" id="currentTime">0:00</span>
                    <input type="range" id="seekBar" min="0" max="1000" value="0" oninput="seekTo(this.value)">
                    <span class="time" id="totalTime">0:00</span>
                </div>
                <div class="transport">
                    <button class="btn btn-stop" id="stopBtn" onclick="stopPlayback()">&#9632;</button>
                    <button class="btn btn-play" id="playBtn" onclick="togglePlay()">&#9654;</button>
                </div>
                <div class="presets">
                    <button class="preset-btn" id="pre-singalong" onclick="applyPreset('singalong')">Sing along</button>
                    <button class="preset-btn" id="pre-karaoke" onclick="applyPreset('karaoke')">Karaoke</button>
                    <button class="preset-btn" id="pre-unplugged" onclick="applyPreset('unplugged')">Unplugged</button>
                    <button class="preset-btn" id="pre-jamming" onclick="applyPreset('jamming')">Jamming</button>
                </div>
                <div class="tempo-row" id="tempoRow" style="display:none">
                    <span class="tempo-label">Speed</span>
                    ${TEMPOS.map((t) => `<button class="tempo-btn" data-tempo="${t}" onclick="setTempo(${t})">${Math.round(t * 100) + '%'}</button>`).join('')}
                </div>
                <div class="up-next" id="upNext" style="display:none">
                    <span class="label">Up next:</span>
                    <span class="next-name" id="nextSongName"></span>
                    <button class="skip-btn" onclick="playNext()">Skip</button>
                </div>
                <div class="section-header" onclick="toggleSection('mixer')">
                    <span>Stem Mixer</span><span id="mixerArrow">&#9650;</span>
                </div>
                <div class="section-content" id="mixerSection">
                    <div class="stem-row"><span class="stem-name">Vocals</span><input type="range" min="0" max="100" value="0" id="sl-vocals" oninput="setStemVol('vocals',this.value)"><span class="stem-vol" id="vol-vocals">0%</span></div>
                    <div class="stem-row"><span class="stem-name">Drums</span><input type="range" min="0" max="100" value="80" id="sl-drums" oninput="setStemVol('drums',this.value)"><span class="stem-vol" id="vol-drums">80%</span></div>
                    <div class="stem-row"><span class="stem-name">Bass</span><input type="range" min="0" max="100" value="80" id="sl-bass" oninput="setStemVol('bass',this.value)"><span class="stem-vol" id="vol-bass">80%</span></div>
                    <div class="stem-row"><span class="stem-name">Harmony</span><input type="range" min="0" max="100" value="80" id="sl-other" oninput="setStemVol('other',this.value)"><span class="stem-vol" id="vol-other">80%</span></div>
                </div>
                <div class="save-row">
                    <button class="save-btn" onclick="saveSetup()">Save Setup</button>
                    <button class="save-btn" onclick="clearSetup()" style="display:none" id="clearSetupBtn">Clear</button>
                </div>
                <div class="preset-indicator" id="presetIndicator"></div>
            `;

            // The template above ships fresh, enabled buttons, so the lock has
            // to go on after it — not when loading started.
            setTransportEnabled(false);

            // Show up next
            updateUpNext();

            // Stacked on a phone, the controls sit below a song list that fills
            // a third of the screen — so picking a song appears to do nothing.
            // Bring the player into view. Desktop keeps all three panels
            // visible at once and needs no scrolling.
            if (window.matchMedia('(max-width: 820px)').matches) {
                document.querySelector('.panel-center')
                        .scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

            // Init audio. Pin the context to the stems' own 44.1kHz: left to
            // pick its own rate it opens at 48k and resamples every stem on
            // decode, which measured 2707ms against 1344ms rate-matched, and
            // holds 421MB of PCM instead of 386MB. Decode is the floor on
            // load time, so this is the single biggest win available.
            if (!audioCtx) {
                try {
                    audioCtx = new AudioContext({ sampleRate: 44100 });
                    pinnedRate = true;
                } catch (e) {
                    // A browser may refuse a rate its hardware cannot open.
                    // Correct playback at 48k beats no playback at 44.1k.
                    console.warn('44.1kHz context unavailable, using default', e);
                    audioCtx = new AudioContext();
                }
            }

            ensureMasterBus();

            // Load stems, all four at once. Serially this cost four round
            // trips plus four decodes with no overlap — each decode blocked
            // the next download — which is where the 10-15s wait came from.
            let loaded = 0;
            const pre = (prefetched.dir === song.dir) ? prefetched.bytes : null;
            // A prefetch for some *other* song is now dead weight: nothing will
            // ever read those bytes, but they are still on the wire competing
            // with the four stems we actually need. prefetchNext only aborted
            // the previous prefetch when starting the next one, so picking out
            // of list order -- which is what a room calling out songs does --
            // left 8 mp3s in flight instead of 4. Measured 7.1-7.4s against
            // 5.8s for the same load in order.
            if (!pre && prefetched.ctrl) {
                prefetched.ctrl.abort();
                prefetched = { dir: null, bytes: null, ctrl: null };
            }
            // decodeAudioData detaches the buffer it is given, so prefetched
            // bytes are good for exactly one decode. Drop our handle now.
            if (pre) prefetched = { dir: null, bytes: null, ctrl: null };
            const setLoadStatus = () => {
                document.getElementById('loadingStatus').textContent =
                    loaded < STEM_NAMES.length
                        ? `Loading... (${loaded}/${STEM_NAMES.length})` : '';
            };
            setLoadStatus();
            let firstError = null;
            const fetchStem = async (stem) => {
                let buf = pre && pre[stem];
                if (!buf || buf.byteLength === 0) {
                    const resp = await fetch(stemUrl(song.dir, `${stem}.mp3`));
                    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                    buf = await resp.arrayBuffer();
                }
                return buf;
            };
            // Fetch all four at once, decode them one at a time. The network
            // is where the parallel win is; decoding in parallel as well put
            // four ~100MB buffers under allocation at the same moment, which a
            // phone does not have — it showed up as a stuck load on an iPhone
            // and as "failed to load" on Android.
            const pending = {};
            STEM_NAMES.forEach((stem) => {
                pending[stem] = fetchStem(stem).catch((e) => {
                    if (!firstError) firstError = e;
                    console.warn(`Fetch failed: ${stem}`, e);
                    return null;
                });
            });
            // Decode WIDTH, not "decode in parallel". Four at once put four
            // ~100MB allocations under the allocator at the same moment, which
            // hung an iPhone and gave Android "failed to load" -- that is why
            // this loop was serial. Two at once holds half the peak of the
            // version that broke.
            //
            // Phones were excluded wholesale at first, which meant the machine
            // that needs the help most got none of it. Measured over adb on the
            // OnePlus 12 (8 cores, 8GB), Kesariya's four stems: width 1 took
            // 1923ms and 1733ms, width 2 took 984ms and 990ms -- 45% off, the
            // same ratio as the laptop, with no failure.
            //
            // So the gate is memory, not screen size. navigator.deviceMemory is
            // a Chromium API that iOS Safari does not implement, so it reads
            // undefined there and an iPhone -- the device that actually hung --
            // keeps the serial path by construction rather than by our guess
            // about which iPhone is safe. Low-end Androids fall out too.
            const roomyEnough = !window.matchMedia('(max-width: 820px)').matches
                                || (navigator.deviceMemory || 0) >= 4;
            const decodeWidth = roomyEnough ? 2 : 1;
            for (let i = 0; i < STEM_NAMES.length; i += decodeWidth) {
                await Promise.all(STEM_NAMES.slice(i, i + decodeWidth).map(async (stem) => {
                    try {
                        const buf = await pending[stem];
                        if (!buf) return;
                        stems[stem] = await audioCtx.decodeAudioData(buf);
                        loaded++;
                        setLoadStatus();
                    } catch (e) {
                        if (!firstError) firstError = e;
                        console.warn(`Decode failed: ${stem}`, e);
                    }
                }));
            }

            // A context pinned to 44.1kHz decodes faster and holds less, but
            // some browsers accept the rate and then refuse to decode at it.
            // Losing playback is worse than losing the saving, so fall back to
            // whatever rate the device wants and try once more.
            if (loaded === 0 && audioCtx.sampleRate === 44100 && pinnedRate) {
                console.warn('44.1kHz decode failed everywhere; retrying at the device rate');
                pinnedRate = false;
                try { audioCtx.close(); } catch (e) {}
                audioCtx = new AudioContext();
                gainNodes = {};
                // masterGain and the worklet node belong to the context we just
                // closed. Kept, they would silently route the retry into nothing.
                masterGain = null; tempoNode = null; tempoReady = false;
                ensureMasterBus();
                firstError = null;
                for (const stem of STEM_NAMES) {
                    try {
                        // The first attempt detached these buffers, so refetch.
                        const buf = await fetchStem(stem);
                        stems[stem] = await audioCtx.decodeAudioData(buf);
                        loaded++;
                        setLoadStatus();
                    } catch (e) {
                        if (!firstError) firstError = e;
                        console.warn(`Retry failed: ${stem}`, e);
                    }
                }
            }

            isLoading = false;

            if (loaded === 0) {
                // Say what actually went wrong — "Failed to load" alone left
                // nobody anything to act on.
                const why = firstError
                    ? `${firstError.name || 'Error'}: ${firstError.message || firstError}`
                    : 'no reason given';
                document.getElementById('loadingStatus').textContent =
                    `Failed to load — ${why}`;
                return;
            }

            renderTempo();
            songDuration = Math.max(...Object.values(stems).map(b => b.duration));
            document.getElementById('loadingStatus').textContent = '';
            document.getElementById('totalTime').textContent = formatTime(songDuration);

            for (const stem of STEM_NAMES) {
                if (!gainNodes[stem]) {
                    gainNodes[stem] = audioCtx.createGain();
                    gainNodes[stem].connect(masterGain);
                }
            }

            // A mix carried over from the previous song wins: it is what the
            // room was just listening to. Otherwise this song's own saved
            // setup, and failing that the default.
            const presetKey = (selectedPlaylist || 'all') + '::' + song.dir;
            if (carriedMix) {
                applyMix(carriedMix);
            } else if (sessionPresets[presetKey]) {
                restoreSetup(sessionPresets[presetKey]);
            } else {
                applyPreset('singalong');
            }

            setTransportEnabled(true);
            if (opts.autoplay) startPlayback();

            // Load lyrics
            loadLyrics(song.dir);

            // Warm the next song while this one plays.
            prefetchNext();
        }

        // Faders as plain numbers, so a mix survives the audio graph being
        // rebuilt for the next song.
        function currentMix() {
            const mix = {};
            for (const stem of STEM_NAMES) {
                const sl = document.getElementById('sl-' + stem);
                mix[stem] = sl ? Number(sl.value)
                               : (gainNodes[stem] ? gainNodes[stem].gain.value * 100 : 80);
            }
            return mix;
        }

        function applyMix(mix) {
            for (const [stem, vol] of Object.entries(mix)) {
                setStemVol(stem, vol);
                const sl = document.getElementById('sl-' + stem);
                if (sl) sl.value = vol;
            }
            // The mix no longer corresponds to a named preset unless it
            // happens to match one, so light whichever it equals.
            syncPresetButtons(mix);
        }

        // Nothing in the transport does anything useful until the stems are
        // decoded, and a play press that silently does nothing reads as a
        // broken app.
        function setTransportEnabled(on) {
            ['playBtn', 'stopBtn'].forEach(id => {
                const b = document.getElementById(id);
                if (b) { b.disabled = !on; b.style.opacity = on ? '' : '0.45'; }
            });
            const seek = document.getElementById('seekBar');
            if (seek) seek.disabled = !on;
        }

        let timedLyrics = null;
        let lyricsInterval = null;
        let lyricsLines = [];
        let crushedLines = [];

        // Viterbi has to place every lyric line, in order. Audio with no matching
        // text is absorbed by the aligner's star token, but there is no mechanism
        // for the reverse — a line the singer never sang at that point still has
        // to go somewhere, so it collapses to near-zero width between the lines
        // that did match, and the time it should have held gets dumped into a
        // neighbour. On screen it flashes past inside a single frame.
        //
        // Those lines still render, so nobody loses lyrics they wanted to read.
        // They simply never take the highlight: the last line that was really
        // sung holds instead. This is a display rule on purpose — rewriting the
        // spans themselves is the thing align-lyrics.py measured and rejected,
        // where evening out placement dropped word-on-voiced-audio 84% -> 72%.
        //
        // 5 w/s is above a comfortable sung line and below what the crushed ones
        // report (6-9 w/s). Genuine rap sections sit closest to it, so raise this
        // if a fast but real line stops lighting up.
        const MAX_WORDS_PER_SEC = 5.0;

        function isCrushed(line) {
            const w = line.words || [];
            const span = line.end - line.start;
            return w.length > 1 && span > 0 && (w.length / span) > MAX_WORDS_PER_SEC;
        }
        let lastActiveIdx = -2;
        let lastWordKey = '';
        let userScrolledAt = 0;
        const USER_SCROLL_GRACE_MS = 4000;

        async function loadLyrics(dir) {
            const el = document.getElementById('lyricsContent');
            const song = songs[currentSongIndex];
            const box = document.getElementById('pasteBox');
            if (box && song) {
                box.style.display = 'block';
                document.getElementById('pasteSummary').textContent =
                    song.lyrics === 'good' ? '+ Replace the lyrics'
                                           : '+ Paste lyrics for this song';
                // Open it unprompted only when the words are known to be wrong.
                document.getElementById('pastePanel').open = (song.lyrics === 'bad');
                document.getElementById('pasteNote').textContent = '';
            }
            timedLyrics = null;
            lyricsLines = [];
            crushedLines = [];
            if (lyricsInterval) clearInterval(lyricsInterval);
            // Hide the toggle until we know this song has something to toggle;
            // otherwise it lingers from the previous song.
            syncScriptToggle();

            // Try timed lyrics first (JSON with timestamps).
            // cache:'no-store' — realignment rewrites this file in place, and a
            // stale cached copy is indistinguishable from a bad alignment.
            try {
                const resp = await fetch(stemUrl(dir, 'lyrics_timed.json'),
                                         { cache: 'no-store' });
                if (resp.ok) {
                    timedLyrics = await resp.json();
                    syncScriptToggle();
                    renderTimedLyrics(el);
                    startLyricsSync();
                    return;
                }
            } catch (e) {}

            // Fallback to plain text lyrics — render as scrollable lines
            try {
                const resp = await fetch(stemUrl(dir, 'lyrics.txt'));
                if (resp.ok) {
                    const text = await resp.text();
                    lyricsLines = text.split('\n').filter(l => l.trim());
                    if (lyricsLines.length > 0) {
                        renderPlainLyrics(el);
                        startLyricsSync();
                    } else {
                        el.innerHTML = '<span class="no-lyrics">No lyrics available</span>';
                    }
                } else {
                    el.innerHTML = '<span class="no-lyrics">No lyrics available</span>';
                }
            } catch (e) {
                el.innerHTML = '<span class="no-lyrics">No lyrics available</span>';
            }
        }

        function escapeHtml(s) {
            return s.replace(/[&<>"']/g, c =>
                ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        // The aligner emits per-word timings. Where they exist, wrap each display word
        // in its own span so it can be swept individually — a line span is too blunt
        // in fast passages, where a whole line can go by in under two seconds.
        //
        // Display text and aligned words are not 1:1: the aligner strips punctuation
        // and splits hyphenates ("khud-garzi" -> "khud","garzi"). So walk the display
        // words and the aligned words together, matching on normalized form, and
        // leave any display word without a match untimed rather than forcing a pairing.
        const DEVANAGARI = /[\u0900-\u097F]/;

        // The aligned token is uroman's rule-based transliteration, which reads
        // "mujhako itanaa bataae koii" for a line everyone spells "mujhko itna
        // bata de koi". romanize-lyrics.py writes a readable `roman` beside it
        // where one has been reviewed; the token stays the fallback so a song
        // that has not been through that pass still renders.
        const roman = w => w.roman || w.word;

        function buildWordSpans(line, lineIdx) {
            const aligned = line.words || [];
            // Romanised view: the aligned tokens ARE the display text, so every
            // word carries its own timing and the sweep is exact. This is the
            // only way word highlighting works on a Devanagari song at all —
            // norm() below strips Devanagari to nothing, so no display word
            // ever matches a token and the whole line falls back to plain text.
            if (romanMode && aligned.length) {
                return aligned.map((w, di) =>
                    `<span class="lyrics-word" id="w-${lineIdx}-${di}" ` +
                    `data-s="${w.start}" data-e="${w.end}">${escapeHtml(roman(w))}</span>`
                ).join(' ');
            }
            const display = line.text.split(/\s+/).filter(Boolean);
            if (!aligned.length) return escapeHtml(line.text);

            const norm = s => s.toLowerCase().replace(/[^a-z']/g, '');
            let ai = 0;
            return display.map((dw, di) => {
                const key = norm(dw);
                let timing = null;
                if (key && ai < aligned.length) {
                    // Hyphenates collapse to several aligned words; consume them all.
                    let j = ai, acc = '';
                    while (j < aligned.length && acc.length < key.length) {
                        acc += aligned[j].word;
                        j++;
                    }
                    if (acc === key) {
                        timing = { start: aligned[ai].start, end: aligned[j - 1].end };
                        ai = j;
                    }
                }
                if (!timing) return escapeHtml(dw);
                return `<span class="lyrics-word" id="w-${lineIdx}-${di}" ` +
                       `data-s="${timing.start}" data-e="${timing.end}">${escapeHtml(dw)}</span>`;
            }).join(' ');
        }

        function renderTimedLyrics(el) {
            if (!timedLyrics) return;
            crushedLines = timedLyrics.map(isCrushed);
            el.innerHTML = timedLyrics.map((line, i) => {
                // The romanised echo only earns its space under the line being
                // sung, so it is rendered for every line and revealed by CSS.
                const echo = (!romanMode && line.words && line.words.length
                              && DEVANAGARI.test(line.text || ''))
                    ? `<div class="lyric-roman">${escapeHtml(
                          line.words.map(roman).join(' '))}</div>`
                    : '';
                return `<div class="lyrics-line upcoming${crushedLines[i] ? ' crushed' : ''}" ` +
                       `id="lyric-${i}">${buildWordSpans(line, i)}${echo}</div>`;
            }).join('');
        }

        /* The sheet holding the mixer, speed and transport. On a mirrored
           phone the screen showing the lyrics IS the controller, so the
           controls cannot live anywhere else -- they wait off screen and come
           back on a tap, the way a video player's do. */
        let stageHideTimer = null;

        function showStageControls() {
            if (!document.body.classList.contains('big-screen')) return;
            document.body.classList.add('controls-open');
            clearTimeout(stageHideTimer);
            stageHideTimer = setTimeout(hideStageControls, 5000);
        }

        function hideStageControls() {
            clearTimeout(stageHideTimer);
            stageHideTimer = null;
            document.body.classList.remove('controls-open');
        }

        document.addEventListener('click', (e) => {
            if (!document.body.classList.contains('big-screen')) return;
            // A tap on the controls themselves is use, not dismissal: keep them
            // up and restart the clock, or the sheet vanishes mid-fader.
            if (e.target.closest('.panel-center') || e.target.closest('.topbar')) {
                showStageControls();
                return;
            }
            if (document.body.classList.contains('controls-open')) hideStageControls();
            else showStageControls();
        });
        // Dragging a fader fires input, not click, and a slow drag would
        // otherwise time out under the hand using it.
        ['input', 'change'].forEach((ev) => document.addEventListener(ev, (e) => {
            if (document.body.classList.contains('big-screen')
                && e.target.closest('.panel-center')) showStageControls();
        }));

        function toggleBigScreen() {
            const on = document.body.classList.toggle('big-screen');
            // There is no Escape key on a phone, so the way out rides with the
            // controls. It is the same button that got you in.
            const btn = document.querySelector('.topbar .screen-btn');
            if (btn) btn.textContent = on ? 'Leave' : 'Big screen';
            if (on) showStageControls(); else hideStageControls();
            document.getElementById('bsUrl').textContent = location.host;
            const song = songs[currentSongIndex];
            document.getElementById('bsSong').textContent = song ? song.name : '—';
            // The active line has to be re-centred against a pane that just
            // changed size, and its type is now twice as tall.
            lastActiveIdx = -2;
            lastWordKey = '';
            if (timedLyrics) updateLyricsHighlight();
            try { localStorage.setItem('bigScreen', on ? '1' : '0'); } catch (e) {}
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && document.body.classList.contains('big-screen')) {
                toggleBigScreen();
            }
        });

        function toggleRoman() {
            romanMode = !romanMode;
            try { localStorage.setItem('romanLyrics', romanMode ? '1' : '0'); } catch (e) {}
            syncScriptToggle();
            const el = document.getElementById('lyricsContent');
            if (timedLyrics) {
                renderTimedLyrics(el);
                // Repaint immediately rather than waiting for the next tick, or
                // the line under the singer goes grey for up to 50ms.
                lastActiveIdx = -2;
                lastWordKey = '';
                updateLyricsHighlight();
            }
        }

        // Only worth offering when the words are actually in Devanagari AND the
        // aligner left romanised tokens to swap in.
        function syncScriptToggle() {
            const btn = document.getElementById('scriptToggle');
            if (!btn) return;
            const usable = timedLyrics && timedLyrics.some(l => l.words && l.words.length)
                        && timedLyrics.some(l => DEVANAGARI.test(l.text || ''));
            btn.style.display = usable ? 'inline-block' : 'none';
            btn.textContent = romanMode ? 'अ' : 'A';
            btn.title = romanMode ? 'Show Devanagari' : 'Show romanised';
            btn.className = 'script-toggle' + (romanMode ? ' on' : '');
        }

        function renderPlainLyrics(el) {
            el.innerHTML = lyricsLines.map((line, i) =>
                `<div class="lyrics-line upcoming" id="lyric-${i}">${line}</div>`
            ).join('');
        }

        function startLyricsSync() {
            if (lyricsInterval) clearInterval(lyricsInterval);
            lastActiveIdx = -2;   // -2 = "not yet rendered", forces a first paint
            lastWordKey = '';
            userScrolledAt = 0;
            // 50ms, not 200ms: the median aligned word is ~0.32s, so a 200ms tick
            // would quantize the sweep into visible steps. Only the active line's
            // words are touched per tick, so this stays cheap.
            lyricsInterval = setInterval(updateLyricsHighlight, 50);
        }

        // Which line should be lit at this playback position, or -1 for none yet.
        function computeActiveIdx(currentTime) {
            const totalLines = timedLyrics ? timedLyrics.length : lyricsLines.length;
            if (totalLines === 0) return -1;

            if (timedLyrics) {
                let idx = -1;
                for (let i = 0; i < timedLyrics.length; i++) {
                    if (currentTime >= timedLyrics[i].start && currentTime < timedLyrics[i].end) {
                        idx = i;
                        break;
                    }
                    if (currentTime < timedLyrics[i].start) break;
                    idx = i;   // past this line, hold it until the next one starts
                }
                // Walk back off any line too fast to have been sung, so the last
                // line the singer actually reached keeps the highlight instead of
                // it flashing through a line that was never there.
                while (idx >= 0 && crushedLines[idx]) idx--;
                return idx;
            }

            // No timestamps — spread lines evenly across the middle of the song.
            const lyricsStart = songDuration * 0.05;
            const lyricsEnd = songDuration * 0.92;
            const timePerLine = (lyricsEnd - lyricsStart) / totalLines;
            if (currentTime < lyricsStart) return -1;
            return Math.min(Math.floor((currentTime - lyricsStart) / timePerLine), totalLines - 1);
        }

        function updateLyricsHighlight() {
            if (!songDuration) return;
            const totalLines = timedLyrics ? timedLyrics.length : lyricsLines.length;
            if (totalLines === 0) return;

            // When paused, pauseOffset *is* the position — keeps the highlight
            // correct after seeking without playing.
            const currentTime = songPosition();
            const activeIdx = computeActiveIdx(currentTime);

            // Line classes and scrolling only change when the line changes; the word
            // sweep below runs every tick, so this early-return moved down.
            if (activeIdx !== lastActiveIdx) {
                const prevIdx = lastActiveIdx;
                lastActiveIdx = activeIdx;

                for (let i = 0; i < totalLines; i++) {
                    const el = document.getElementById('lyric-' + i);
                    if (!el) continue;
                    el.classList.remove('active', 'past', 'upcoming');
                    if (i === activeIdx) el.classList.add('active');
                    else if (activeIdx >= 0 && i < activeIdx) el.classList.add('past');
                    else el.classList.add('upcoming');
                }

                // Leaving a line: clear its word states so scrubbing back looks clean.
                if (prevIdx >= 0) clearWordStates(prevIdx);
                lastWordKey = '';

                if (activeIdx >= 0 && Date.now() - userScrolledAt >= USER_SCROLL_GRACE_MS) {
                    scrollLyricsTo(activeIdx);
                }
            }

            updateWordHighlight(activeIdx, currentTime);
        }

        function clearWordStates(lineIdx) {
            const line = document.getElementById('lyric-' + lineIdx);
            if (!line) return;
            line.querySelectorAll('.lyrics-word').forEach(w =>
                w.classList.remove('sung', 'singing'));
        }

        // Sweep words inside the active line. Words before the playhead read as sung,
        // the current one is emphasised. Writes to the DOM only when the boundary
        // actually moves, so a 50ms tick costs almost nothing.
        function updateWordHighlight(activeIdx, currentTime) {
            if (activeIdx < 0) return;
            const line = document.getElementById('lyric-' + activeIdx);
            if (!line) return;
            const words = line.querySelectorAll('.lyrics-word');
            if (!words.length) return;

            let cur = -1;
            for (let i = 0; i < words.length; i++) {
                const s = parseFloat(words[i].dataset.s);
                const e = parseFloat(words[i].dataset.e);
                if (currentTime >= s && currentTime < e) { cur = i; break; }
                if (currentTime >= e) cur = i;      // past it; hold until the next starts
                else break;
            }

            const key = activeIdx + ':' + cur;
            if (key === lastWordKey) return;
            lastWordKey = key;

            words.forEach((w, i) => {
                w.classList.toggle('singing', i === cur);
                w.classList.toggle('sung', i < cur);
            });
        }

        function scrollLyricsTo(idx) {
            const container = document.getElementById('lyricsContent');
            const el = document.getElementById('lyric-' + idx);
            if (!container || !el) return;
            const target = el.offsetTop - (container.clientHeight / 2) + (el.offsetHeight / 2);
            const max = container.scrollHeight - container.clientHeight;
            container.scrollTo({
                top: Math.max(0, Math.min(target, max)),
                behavior: 'smooth'
            });
        }

        function togglePlay() {
            if (isPlaying) pausePlayback();
            else startPlayback();
        }

        // The four stems are mixed through Web Audio, which both iOS and
        // Android suspend when the screen sleeps — so a song stops mid-verse
        // with nobody touching anything. A wake lock keeps the screen awake
        // while something is playing. It does NOT survive the user switching
        // apps; nothing short of an <audio> element would, and that cannot mix
        // four stems live.
        let wakeLock = null;

        async function keepScreenAwake() {
            if (!('wakeLock' in navigator) || wakeLock) return;
            try {
                wakeLock = await navigator.wakeLock.request('screen');
                // The browser drops it whenever the page is hidden; clear our
                // handle so the visibility handler can take a fresh one.
                wakeLock.addEventListener('release', () => { wakeLock = null; });
            } catch (e) {
                // Denied, unsupported, or the tab was already hidden. Playback
                // is unaffected — the screen just may sleep.
                console.warn('wake lock unavailable', e);
            }
        }

        function releaseScreenAwake() {
            if (!wakeLock) return;
            try { wakeLock.release(); } catch (e) {}
            wakeLock = null;
        }

        // Coming back to the tab re-takes the lock, since the browser released
        // it on the way out.
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && isPlaying) keepScreenAwake();
        });

        /* Stems -> masterGain -> tempo shifter -> speakers.
         *
         * The shifter only ever raises pitch; the slowing is done by the source
         * nodes themselves. See tempo-worklet.js for why it cannot be the other
         * way round. */
        function ensureMasterBus() {
            if (masterGain) return;
            masterGain = audioCtx.createGain();
            masterGain.connect(audioCtx.destination);
            if (!audioCtx.audioWorklet) return;   // old browser: speed stays 1x
            const ctx = audioCtx;
            ctx.audioWorklet.addModule('tempo-worklet.js').then(() => {
                // A slow phone can finish loading after the context was
                // rebuilt by the 44.1kHz fallback. Wiring a node into a dead
                // context is silence, so check we are still the live one.
                if (audioCtx !== ctx || !masterGain) return;
                tempoNode = new AudioWorkletNode(ctx, 'tempo-processor', {
                    numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [2],
                    processorOptions: { pitch: 1 / tempo }
                });
                masterGain.disconnect();
                masterGain.connect(tempoNode);
                tempoNode.connect(ctx.destination);
                tempoReady = true;
                if (pendingTempo !== null) {
                    const t = pendingTempo; pendingTempo = null;
                    setTempo(t);
                }
                renderTempo();
            }).catch((e) => {
                // Without the worklet the only way to slow a song is to drop
                // its key, which is the thing singers cannot practise against.
                // Better to offer nothing than to quietly detune the room.
                console.warn('tempo worklet unavailable, speed control hidden', e);
                tempoReady = false;
                renderTempo();
            });
        }

        /* Position within the song, in the song's own seconds. At 0.8x the wall
         * clock advances 1.25s for every second of music. */
        function songPosition() {
            if (!isPlaying) return pauseOffset;
            return (audioCtx.currentTime - startTime) * tempo;
        }

        function setTempo(t) {
            // A restored setup can ask for a speed before the worklet exists.
            // Dropping it would silently ignore what the singer saved.
            if (!tempoReady && t !== 1) { pendingTempo = t; return; }
            if (t === tempo) return;
            const pos = songPosition();
            tempo = t;
            if (tempoNode) tempoNode.port.postMessage({ pitch: 1 / t });
            if (isPlaying) {
                for (const stem of STEM_NAMES) {
                    const src = sourceNodes[stem];
                    if (src) src.playbackRate.setValueAtTime(t, audioCtx.currentTime);
                }
                startTime = audioCtx.currentTime - pos / t;
            } else {
                pauseOffset = pos;
            }
            renderTempo();
        }

        function renderTempo() {
            const row = document.getElementById('tempoRow');
            if (!row) return;
            // Hidden rather than disabled while the worklet loads: a row of dead
            // buttons on a slow phone reads as a broken feature.
            row.style.display = tempoReady ? 'flex' : 'none';
            row.querySelectorAll('.tempo-btn').forEach((b) => {
                b.classList.toggle('active', parseFloat(b.dataset.tempo) === tempo);
            });
        }

        function startPlayback() {
            if (!audioCtx || Object.keys(stems).length === 0) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            keepScreenAwake();

            for (const stem of STEM_NAMES) {
                if (!stems[stem]) continue;
                const src = audioCtx.createBufferSource();
                src.buffer = stems[stem];
                src.playbackRate.value = tempo;
                src.connect(gainNodes[stem]);
                src.start(0, pauseOffset);
                sourceNodes[stem] = src;
            }

            // pauseOffset is song time; the wall clock runs 1/tempo faster.
            startTime = audioCtx.currentTime - pauseOffset / tempo;
            isPlaying = true;
            document.getElementById('playBtn').innerHTML = '&#10074;&#10074;';
            seekInterval = setInterval(updateSeek, 200);

            // Auto-next on end — only if song actually finished naturally
            const firstStem = STEM_NAMES.find(s => sourceNodes[s]);
            if (firstStem) {
                const expectedEndSong = currentSongIndex;
                sourceNodes[firstStem].addEventListener('ended', () => {
                    if (isPlaying && currentSongIndex === expectedEndSong) {
                        const cur = songPosition();
                        // Only auto-next if we're actually near the end
                        if (cur >= songDuration - 1) {
                            stopPlayback();
                            // Reached here because the song ended, not because
                            // anyone chose: keep playing, keep the same mix.
                            playNext({ autoplay: true, inheritMix: true });
                        }
                    }
                });
            }
        }

        function pausePlayback() {
            if (!isPlaying) return;
            pauseOffset = songPosition();
            for (const stem of STEM_NAMES) {
                try { sourceNodes[stem]?.stop(); sourceNodes[stem]?.disconnect(); } catch (e) {}
            }
            sourceNodes = {};
            isPlaying = false;
            releaseScreenAwake();
            document.getElementById('playBtn').innerHTML = '&#9654;';
            clearInterval(seekInterval);
        }

        function stopPlayback() {
            if (isPlaying) {
                for (const stem of STEM_NAMES) {
                    try { sourceNodes[stem]?.stop(); sourceNodes[stem]?.disconnect(); } catch (e) {}
                }
                sourceNodes = {};
                isPlaying = false;
                releaseScreenAwake();
                clearInterval(seekInterval);
            }
            pauseOffset = 0;
            const seekBar = document.getElementById('seekBar');
            const curTime = document.getElementById('currentTime');
            const playBtn = document.getElementById('playBtn');
            if (seekBar) seekBar.value = 0;
            if (curTime) curTime.textContent = '0:00';
            if (playBtn) playBtn.innerHTML = '&#9654;';
        }

        function seekTo(val) {
            const frac = val / 1000;
            wasPlayingBeforeSeek = isPlaying;
            if (isPlaying) {
                // Stop sources without triggering auto-next
                for (const stem of STEM_NAMES) {
                    try { sourceNodes[stem]?.stop(); sourceNodes[stem]?.disconnect(); } catch (e) {}
                }
                sourceNodes = {};
                isPlaying = false;
                clearInterval(seekInterval);
            }
            pauseOffset = frac * songDuration;
            document.getElementById('currentTime').textContent = formatTime(pauseOffset);
            userScrolledAt = 0;   // an explicit seek should snap the lyrics, grace period or not
            if (wasPlayingBeforeSeek) startPlayback();
        }

        function updateSeek() {
            if (!isPlaying || !songDuration) return;
            const cur = songPosition();
            document.getElementById('seekBar').value = (cur / songDuration) * 1000;
            document.getElementById('currentTime').textContent = formatTime(cur);
        }

        // ===== Stem Volume =====

        function setStemVol(stem, val) {
            const v = val / 100;
            if (gainNodes[stem]) gainNodes[stem].gain.value = v;
            const volEl = document.getElementById('vol-' + stem);
            if (volEl) volEl.textContent = v === 0 ? 'OFF' : Math.round(v * 100) + '%';
        }

        // Which preset, if any, does this mix correspond to? A carried-over
        // mix usually matches one exactly, and leaving every button dark when
        // it does looks like a bug.
        function syncPresetButtons(mix) {
            const p = PRESETS;
            let match = null;
            for (const [name, vals] of Object.entries(p)) {
                if (STEM_NAMES.every(k => Number(mix[k]) === vals[k])) { match = name; break; }
            }
            currentPreset = match;
            document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
            if (match) {
                const btn = document.getElementById('pre-' + match);
                if (btn) btn.classList.add('active');
            }
        }

        function applyPreset(name) {
            const p = PRESETS[name];
            if (!p) return;
            currentPreset = name;
            for (const [stem, vol] of Object.entries(p)) {
                setStemVol(stem, vol);
                const sl = document.getElementById('sl-' + stem);
                if (sl) sl.value = vol;
            }
            document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
            const btn = document.getElementById('pre-' + name);
            if (btn) btn.classList.add('active');
        }

        // ===== Pasted lyrics =====

        // For the songs LRCLIB simply does not carry. The words go to the
        // laptop, which aligns them against this song's own audio — so the
        // paste needs no timings, just the lines in singing order.
        async function submitLyrics() {
            const btn = document.getElementById('pasteBtn');
            const note = document.getElementById('pasteNote');
            const song = songs[currentSongIndex];
            if (!song) { note.textContent = 'Pick a song first.'; return; }
            const text = document.getElementById('pasteText').value.trim();
            if (text.split('\n').filter(l => l.trim()).length < 4) {
                note.textContent = 'Needs at least 4 lines.'; return;
            }
            btn.disabled = true;
            note.textContent = 'Sending...';
            try {
                const resp = await fetch('/api/lyrics', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dir: song.dir, lyrics: text }),
                });
                const data = await resp.json().catch(() => ({}));
                if (!resp.ok) throw new Error(data.error || `HTTP ${resp.status}`);
                note.textContent = `Got ${data.lines} lines. You'll see it under Requests when timed.`;
                addReq({ song: song.name + ' (lyrics)', title: song.name + ' (lyrics)',
                         state: 'queued', seen: true });
                document.getElementById('pasteText').value = '';
            } catch (e) {
                note.textContent = 'Could not send: ' + e.message;
            } finally {
                btn.disabled = false;
            }
        }

        // ===== Request tracking =====

        // What this browser asked for. Kept here rather than server-side so the
        // service stays anonymous - it never needs to know who anyone is.
        function myReqs() {
            let l;
            try { l = JSON.parse(localStorage.getItem('beatznbox_reqs') || '[]'); }
            catch (e) { return []; }
            // A finished request is news for a day, then it is clutter. Only
            // settled ones expire -- anything still queued stays visible however
            // long the laptop takes, because that is the case you need to see.
            const cutoff = Date.now() - 24 * 60 * 60 * 1000;
            const keep = l.filter(r => !r.at || !r.state || r.state === 'queued'
                                       || r.seen !== true || r.at > cutoff);
            if (keep.length !== l.length) {
                try { localStorage.setItem('beatznbox_reqs', JSON.stringify(keep)); }
                catch (e) {}
            }
            return keep;
        }
        function saveReqs(list) {
            try { localStorage.setItem('beatznbox_reqs', JSON.stringify(list.slice(-30))); }
            catch (e) {}
        }
        function addReq(rec) { const l = myReqs(); l.push(rec); saveReqs(l); renderBell(); }

        function toggleBell() {
            const p = document.getElementById('bellPanel');
            p.hidden = !p.hidden;
            if (!p.hidden) {
                // Opening the panel is the acknowledgement; the badge counts
                // only what has changed since it was last opened.
                const l = myReqs().map(r => ({ ...r, seen: true }));
                saveReqs(l);
                renderBell();
            }
        }
        function clearSeen() { saveReqs([]); renderBell(); document.getElementById('bellPanel').hidden = true; }

        function renderBell() {
            const list = myReqs().slice().reverse();
            const unseen = list.filter(r => !r.seen && r.state && r.state !== 'queued').length;
            const badge = document.getElementById('bellBadge');
            if (badge) { badge.hidden = unseen === 0; badge.textContent = unseen; }
            const el = document.getElementById('bellList');
            if (!el) return;
            if (!list.length) { el.innerHTML = '<div class="bell-empty">Nothing waiting. Songs you ask for show up here.</div>'; return; }
            el.innerHTML = list.map(r => {
                const st = r.state || 'queued';
                const label = { done: 'Ready — in the list now', queued: 'Waiting for the watcher',
                                duplicate: 'Already in the list', failed: 'Could not find it' }[st] || st;
                return `<div class="bell-item">
                    <div>${(r.title || r.song || '').replace(/</g, '&lt;')}</div>
                    <div class="st ${st}">${label}${r.note ? ' — ' + r.note.replace(/</g, '&lt;') : ''}</div>
                </div>`;
            }).join('');
        }

        // Ask only about things still in flight; a finished request never changes.
        async function pollRequests() {
            const list = myReqs();
            const open = list.filter(r => r.id && (!r.state || r.state === 'queued'));
            if (!open.length) return;
            try {
                const resp = await fetch('/api/status?ids=' + open.map(r => r.id).join(','),
                                         { cache: 'no-store' });
                if (!resp.ok) return;
                const data = await resp.json();
                let changed = false;
                list.forEach(r => {
                    const s = data.status && data.status[r.id];
                    if (!s || s.state === 'queued' || s.state === 'unknown') return;
                    if (r.state !== s.state) {
                        r.state = s.state;
                        if (s.title) r.title = s.title;   // the real title, not what was typed
                        if (s.note) r.note = s.note;
                        r.seen = false;
                        changed = true;
                    }
                });
                if (changed) { saveReqs(list); renderBell(); loadSongList(); }
            } catch (e) {}
        }

        // ===== Song requests =====

        // Hands the request to the queue service and stops there. The laptop
        // picks it up on its own schedule, so the honest thing to tell the
        // person is that it is queued — not that it is coming.
        async function submitRequest() {
            const btn = document.getElementById('reqBtn');
            const note = document.getElementById('reqNote');
            const song = document.getElementById('reqSong').value.trim();
            if (!song) { note.textContent = 'Type a song name first.'; return; }
            btn.disabled = true;
            note.textContent = 'Sending...';
            try {
                const resp = await fetch('/api/request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        song,
                        detail: document.getElementById('reqDetail').value.trim(),
                        who: document.getElementById('reqWho').value.trim(),
                    }),
                });
                const data = await resp.json().catch(() => ({}));
                if (!resp.ok) {
                    // A duplicate is not an error the person caused - say what we
                    // already have and leave the box alone so they can edit it.
                    if (data.duplicate) {
                        note.textContent = data.error || 'Already in the list.';
                        addReq({ at: Date.now(), song, title: data.existing || song,
                                 state: 'duplicate', seen: false });
                        return;
                    }
                    throw new Error(data.error || `HTTP ${resp.status}`);
                }
                addReq({ id: data.id, song, title: song, state: 'queued', seen: true, at: Date.now() });
                note.textContent = `Queued. You'll see it under Requests when it's ready.`;
                document.getElementById('reqSong').value = '';
                document.getElementById('reqDetail').value = '';
            } catch (e) {
                note.textContent = 'Could not send: ' + e.message;
            } finally {
                btn.disabled = false;
            }
        }

        // ===== Up Next =====

        function updateUpNext() {
            const el = document.getElementById('upNext');
            if (!el) return;
            const nextIdx = getNextSongIndex();
            if (nextIdx >= 0 && filteredSongs.length > 1) {
                el.style.display = 'flex';
                document.getElementById('nextSongName').textContent = songs[nextIdx].name;
            } else {
                el.style.display = 'none';
            }
        }

        // Pull the next song's mp3s in the background so switching does not
        // pay for the download a second time. Compressed bytes only: decoded
        // PCM is ~18x larger (389MB for a 4:36 song, vs 22MB of mp3), so
        // holding two decoded songs would get a phone tab killed.
        // A phone has neither the bandwidth to spare nor the memory: another
        // 22MB in flight competes with the song being loaded, and holding it
        // alongside ~390MB of decoded audio is what tips a tab over.
        function shouldPrefetch() {
            if (window.matchMedia('(max-width: 820px)').matches) return false;
            const c = navigator.connection;
            if (c && (c.saveData || /2g|slow-2g/.test(c.effectiveType || ''))) return false;
            return true;
        }

        async function prefetchNext() {
            if (!shouldPrefetch()) return;
            const nextIdx = getNextSongIndex();
            if (nextIdx < 0) return;
            const dir = songs[nextIdx].dir;
            if (prefetched.dir === dir) return;
            if (prefetched.ctrl) prefetched.ctrl.abort();
            const ctrl = new AbortController();
            const bytes = {};
            prefetched = { dir, bytes, ctrl };
            try {
                await Promise.all(STEM_NAMES.map(async (stem) => {
                    const resp = await fetch(stemUrl(dir, `${stem}.mp3`),
                                            { signal: ctrl.signal });
                    bytes[stem] = await resp.arrayBuffer();
                }));
            } catch (e) {
                // Superseded by a newer pick, or the network went away. Either
                // way selectSong just fetches on demand, so drop the partial.
                if (prefetched.ctrl === ctrl) {
                    prefetched = { dir: null, bytes: null, ctrl: null };
                }
            }
        }

        function getNextSongIndex() {
            if (currentSongIndex < 0) return -1;
            const currentInFiltered = filteredSongs.indexOf(songs[currentSongIndex]);
            if (currentInFiltered < 0) return -1;
            const nextFiltered = (currentInFiltered + 1) % filteredSongs.length;
            return songs.indexOf(filteredSongs[nextFiltered]);
        }

        function playNext(opts = {}) {
            const nextIdx = getNextSongIndex();
            if (nextIdx >= 0) selectSong(nextIdx, opts);
        }

        // ===== Session Presets =====

        function saveSetup() {
            if (currentSongIndex < 0) return;
            const song = songs[currentSongIndex];
            const tag = prompt('Tag name (e.g. Chorus, Hook):') || '';
            const key = (selectedPlaylist || 'all') + '::' + song.dir;
            const seekBar = document.getElementById('seekBar');
            sessionPresets[key] = {
                position: seekBar ? seekBar.value / 1000 : 0,
                volumes: {},
                preset: currentPreset,
                tempo: tempo,
                tag: tag
            };
            for (const stem of STEM_NAMES) {
                const sl = document.getElementById('sl-' + stem);
                sessionPresets[key].volumes[stem] = sl ? parseInt(sl.value) : 80;
            }
            localStorage.setItem('beatznbox_presets', JSON.stringify(sessionPresets));
            showPresetIndicator(tag);
        }

        function clearSetup() {
            if (currentSongIndex < 0) return;
            const song = songs[currentSongIndex];
            const key = (selectedPlaylist || 'all') + '::' + song.dir;
            delete sessionPresets[key];
            localStorage.setItem('beatznbox_presets', JSON.stringify(sessionPresets));
            document.getElementById('presetIndicator').textContent = '';
            document.getElementById('clearSetupBtn').style.display = 'none';
        }

        function restoreSetup(preset) {
            if (preset.volumes) {
                for (const [stem, vol] of Object.entries(preset.volumes)) {
                    setStemVol(stem, vol);
                    const sl = document.getElementById('sl-' + stem);
                    if (sl) sl.value = vol;
                }
            }
            if (preset.tempo) setTempo(preset.tempo);
            if (preset.position > 0) {
                pauseOffset = preset.position * songDuration;
                const seekBar = document.getElementById('seekBar');
                if (seekBar) seekBar.value = preset.position * 1000;
                document.getElementById('currentTime').textContent = formatTime(pauseOffset);
            }
            if (preset.preset) {
                currentPreset = preset.preset;
                document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
                const btn = document.getElementById('pre-' + preset.preset);
                if (btn) btn.classList.add('active');
            }
            showPresetIndicator(preset.tag);
        }

        function showPresetIndicator(tag) {
            const el = document.getElementById('presetIndicator');
            if (el) el.textContent = tag ? `Setup saved: "${tag}"` : 'Setup saved';
            const clearBtn = document.getElementById('clearSetupBtn');
            if (clearBtn) clearBtn.style.display = 'inline-block';
        }

        // ===== Helpers =====

        function toggleSection(name) {
            const el = document.getElementById(name + 'Section');
            const arrow = document.getElementById(name + 'Arrow');
            if (el) {
                el.style.display = el.style.display === 'none' ? 'block' : 'none';
                if (arrow) arrow.innerHTML = el.style.display === 'none' ? '&#9660;' : '&#9650;';
            }
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return m + ':' + (s < 10 ? '0' : '') + s;
        }

        // Init
        loadSongList();
        renderBell();
        pollRequests();
        setInterval(pollRequests, 20000);

        // 2 minutes: the manifest is ~8KB and no-cache, and a song takes
        // minutes to process, so anything tighter is just noise.
        setInterval(() => refreshSongList({ quiet: false }), 120000);

        // Track genuine user scrolling only. A 'scroll' listener would also fire
        // for our own smooth scrolling and permanently suppress auto-scroll.
        (function trackManualLyricsScroll() {
            const lc = document.getElementById('lyricsContent');
            if (!lc) return;
            const mark = () => { userScrolledAt = Date.now(); };
            lc.addEventListener('wheel', mark, { passive: true });
            lc.addEventListener('touchmove', mark, { passive: true });
        })();
    </script>
</body>
</html>
